<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Roster | AI Future</title>
  <style>
    :root {
      --ink: #17202c;
      --muted: #667085;
      --line: #d8dee8;
      --brand: #2563ff;
      --brand-dark: #1648cc;
      --green: #0f766e;
      --danger: #b42318;
      --page: #f5f7fb;
      --surface: #fff;
      --soft: #eef4ff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page);
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .shell {
      width: min(1280px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    h1, h2, h3 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 1.45rem; }
    h2 { font-size: 1rem; }
    h3 { font-size: 0.95rem; }
    p { margin: 0; color: var(--muted); line-height: 1.45; }

    .userline {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    a, button {
      font: inherit;
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--ink);
      background: #fff;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    .btn:hover { border-color: var(--brand); color: var(--brand); }
    .btn.primary {
      border-color: var(--brand);
      color: #fff;
      background: var(--brand);
    }
    .btn.primary:hover { background: var(--brand-dark); color: #fff; }
    .btn.danger { color: var(--danger); }

    main {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 18px;
      padding: 24px 0 48px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 12px 28px rgba(21, 31, 48, 0.07);
    }

    .panel-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel-body {
      display: grid;
      gap: 16px;
      padding: 18px;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #31415c;
      font-size: 0.88rem;
      font-weight: 800;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      color: var(--ink);
      background: #fff;
      font: inherit;
    }

    textarea { resize: vertical; min-height: 74px; }
    input:focus, select:focus, textarea:focus {
      outline: 3px solid rgba(37, 99, 255, 0.16);
      border-color: var(--brand);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .stat strong {
      display: block;
      font-size: 1.4rem;
      line-height: 1;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .class-list, .student-list, .enrollment-list {
      display: grid;
      gap: 10px;
    }

    .class-card, .student-card, .enroll-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
    }

    .class-card {
      display: grid;
      gap: 10px;
    }

    .class-top, .student-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }

    .pill {
      border-radius: 8px;
      padding: 4px 7px;
      color: #31415c;
      background: var(--soft);
      font-size: 0.78rem;
      font-weight: 850;
    }

    .pill.green {
      color: #0f5132;
      background: #e7f7ef;
    }

    .pill.off {
      color: #7a2e0e;
      background: #fff1e8;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .check-grid {
      display: grid;
      gap: 8px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: #31415c;
    }

    .check-row input {
      width: auto;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 7px;
      margin-top: 9px;
      padding: 10px;
      border-radius: 8px;
      background: #f8fafc;
    }

    .notice {
      display: none;
      padding: 11px 12px;
      border-radius: 8px;
      color: var(--danger);
      background: #fff7f5;
      border: 1px solid rgba(180, 35, 24, 0.22);
      font-weight: 750;
    }

    .empty {
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #fff;
    }

    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .filters { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .topbar { align-items: flex-start; flex-direction: column; padding: 16px 0; }
      .actions, .btn { width: 100%; }
      .row, .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell topbar">
      <div>
        <h1>Master Roster</h1>
        <div id="userline" class="userline">Loading...</div>
      </div>
      <div class="actions">
        <a class="btn" href="/coach-portal">Coach Portal</a>
        <button id="logoutButton" class="btn" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <aside class="panel">
      <div class="panel-head">
        <h2 id="studentFormTitle">Add Student</h2>
        <p>Assign students to summer weeks and fall classes from one place.</p>
      </div>
      <div class="panel-body">
        <div id="notice" class="notice" role="alert"></div>
        <form id="studentForm" class="form-grid">
          <input id="studentId" type="hidden">
          <label>Student name <input id="studentName" required></label>
          <label>Parent name <input id="parentName"></label>
          <div class="row">
            <label>Email <input id="email" type="email"></label>
            <label>Phone <input id="phone"></label>
          </div>
          <label>Notes <textarea id="notes"></textarea></label>
          <section>
            <h3>Class Enrollment</h3>
            <div id="enrollmentControls" class="enrollment-list"></div>
          </section>
          <div class="actions">
            <button class="btn primary" type="submit">Save student</button>
            <button id="cancelEditButton" class="btn" type="button">Clear</button>
          </div>
        </form>
      </div>
    </aside>

    <section class="panel">
      <div class="panel-head">
        <h2>Classes And Students</h2>
        <p>Create summer/fall classes, then manage who is enrolled.</p>
      </div>
      <div class="panel-body">
        <div class="stats">
          <div class="stat"><strong id="studentCount">0</strong><span>Students</span></div>
          <div class="stat"><strong id="classCount">0</strong><span>Classes</span></div>
          <div class="stat"><strong id="summerCount">0</strong><span>Summer enrollments</span></div>
        </div>

        <section class="class-card">
          <h3>Create Class</h3>
          <form id="classForm" class="form-grid">
            <div class="row">
              <label>Class name <input id="className" required></label>
              <label>Term
                <select id="classTerm">
                  <option value="summer">Summer</option>
                  <option value="fall" selected>Fall</option>
                  <option value="spring">Spring</option>
                  <option value="year-round">Year-round</option>
                </select>
              </label>
            </div>
            <div class="row">
              <label>Program
                <select id="classProgram">
                  <option value="lego-robotics">LEGO Robotics</option>
                  <option value="ftc">FTC</option>
                  <option value="fll">FLL</option>
                  <option value="code-lab">Code Lab</option>
                  <option value="other">Other</option>
                </select>
              </label>
              <label>Day <input id="classDay" placeholder="Saturday, Sunday, Weekly"></label>
            </div>
            <label>Schedule note <input id="classSchedule" placeholder="Saturday 10:00 AM, summer weekly enrollment, etc."></label>
            <button class="btn primary" type="submit">Create class</button>
          </form>
        </section>

        <section>
          <div class="filters">
            <input id="searchInput" placeholder="Search students or parents">
            <select id="termFilter">
              <option value="all">All terms</option>
              <option value="summer">Summer</option>
              <option value="fall">Fall</option>
              <option value="spring">Spring</option>
              <option value="year-round">Year-round</option>
            </select>
            <select id="classFilter">
              <option value="all">All classes</option>
            </select>
          </div>
          <div id="students" class="student-list"></div>
        </section>

        <section>
          <h3>Classes</h3>
          <div id="classes" class="class-list"></div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const state = { user: null, roster: null };
    const userline = document.getElementById('userline');
    const notice = document.getElementById('notice');
    const studentsEl = document.getElementById('students');
    const classesEl = document.getElementById('classes');
    const enrollmentControls = document.getElementById('enrollmentControls');
    const studentForm = document.getElementById('studentForm');
    const classForm = document.getElementById('classForm');
    const searchInput = document.getElementById('searchInput');
    const termFilter = document.getElementById('termFilter');
    const classFilter = document.getElementById('classFilter');

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showNotice(message) {
      notice.textContent = message || '';
      notice.style.display = message ? 'block' : 'none';
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
      });
      const result = await response.json();
      if (!response.ok || !result.success) throw new Error(result.message || 'Request failed');
      return result;
    }

    function classById(id) {
      return (state.roster.classes || []).find((item) => item.id === id);
    }

    function enrollmentFor(student, classId) {
      return (student.enrollments || []).find((item) => item.classId === classId) || null;
    }

    function formatProgram(value) {
      return {
        'lego-robotics': 'LEGO Robotics',
        ftc: 'FTC',
        fll: 'FLL',
        'code-lab': 'Code Lab',
        other: 'Other'
      }[value] || value;
    }

    async function load() {
      try {
        const session = await api('/api/coach/session');
        state.user = session.user;
        userline.textContent = `${session.user.name} · ${session.user.role === 'owner' ? 'Owner/Admin' : 'Coach'}`;
        const roster = await api('/api/master-roster');
        state.roster = roster.data;
        renderAll();
      } catch (err) {
        if (/login/i.test(err.message)) window.location.href = '/coach-login';
        showNotice(err.message);
      }
    }

    function renderAll() {
      renderEnrollmentControls();
      renderClassFilter();
      renderStats();
      renderStudents();
      renderClasses();
    }

    function renderStats() {
      const students = state.roster.students || [];
      const classes = state.roster.classes || [];
      const summerEnrollments = students.reduce((count, student) => {
        return count + (student.enrollments || []).filter((enrollment) => classById(enrollment.classId)?.term === 'summer').length;
      }, 0);
      document.getElementById('studentCount').textContent = students.length;
      document.getElementById('classCount').textContent = classes.length;
      document.getElementById('summerCount').textContent = summerEnrollments;
    }

    function renderClassFilter() {
      const selected = classFilter.value || 'all';
      classFilter.innerHTML = '<option value="all">All classes</option>' + state.roster.classes
        .map((item) => `<option value="${esc(item.id)}">${esc(item.name)}</option>`)
        .join('');
      classFilter.value = state.roster.classes.some((item) => item.id === selected) ? selected : 'all';
    }

    function renderEnrollmentControls(student = null) {
      enrollmentControls.innerHTML = state.roster.classes.map((classItem) => {
        const enrollment = student ? enrollmentFor(student, classItem.id) : null;
        const checked = Boolean(enrollment);
        const weeks = state.roster.settings.summerWeeks || [];
        const selectedWeeks = new Set(enrollment?.weeks || []);
        const weekHtml = classItem.term === 'summer' ? `
          <div class="week-grid" data-weeks-for="${esc(classItem.id)}" style="${checked ? '' : 'display:none'}">
            ${weeks.map((week) => `
              <label class="check-row">
                <input type="checkbox" data-week="${esc(week.id)}" data-class-id="${esc(classItem.id)}" ${selectedWeeks.has(week.id) ? 'checked' : ''}>
                <span>${esc(week.label)}<br><small>${esc(week.dates)}</small></span>
              </label>
            `).join('')}
          </div>
        ` : '';
        return `
          <div class="enroll-card">
            <label class="check-row">
              <input type="checkbox" data-class-check="${esc(classItem.id)}" ${checked ? 'checked' : ''}>
              <span>${esc(classItem.name)} <small>(${esc(classItem.term)}, ${esc(classItem.day || 'No day')})</small></span>
            </label>
            ${weekHtml}
          </div>
        `;
      }).join('') || '<div class="empty">Create a class first.</div>';

      enrollmentControls.querySelectorAll('[data-class-check]').forEach((input) => {
        input.addEventListener('change', () => {
          const weeks = enrollmentControls.querySelector(`[data-weeks-for="${CSS.escape(input.dataset.classCheck)}"]`);
          if (weeks) weeks.style.display = input.checked ? '' : 'none';
        });
      });
    }

    function collectEnrollments() {
      return Array.from(enrollmentControls.querySelectorAll('[data-class-check]:checked')).map((input) => {
        const classId = input.dataset.classCheck;
        const classItem = classById(classId);
        const weeks = classItem?.term === 'summer'
          ? Array.from(enrollmentControls.querySelectorAll(`[data-week][data-class-id="${CSS.escape(classId)}"]:checked`)).map((week) => week.dataset.week)
          : [];
        return { classId, weeks };
      });
    }

    function filteredStudents() {
      const q = searchInput.value.trim().toLowerCase();
      const term = termFilter.value;
      const classId = classFilter.value;
      return (state.roster.students || []).filter((student) => {
        const haystack = `${student.name} ${student.parentName} ${student.email} ${student.phone}`.toLowerCase();
        if (q && !haystack.includes(q)) return false;
        const enrollments = student.enrollments || [];
        if (classId !== 'all' && !enrollments.some((item) => item.classId === classId)) return false;
        if (term !== 'all' && !enrollments.some((item) => classById(item.classId)?.term === term)) return false;
        return true;
      });
    }

    function renderStudents() {
      const students = filteredStudents();
      if (!students.length) {
        studentsEl.innerHTML = '<div class="empty">No students match this view.</div>';
        return;
      }
      studentsEl.innerHTML = students.map((student) => {
        const enrollments = (student.enrollments || []).map((enrollment) => {
          const classItem = classById(enrollment.classId);
          if (!classItem) return '';
          const weeks = classItem.term === 'summer' && enrollment.weeks?.length
            ? ` · ${enrollment.weeks.length} week${enrollment.weeks.length === 1 ? '' : 's'}`
            : '';
          return `<span class="pill ${classItem.term === 'summer' ? 'green' : ''}">${esc(classItem.name)}${weeks}</span>`;
        }).join('');
        return `
          <article class="student-card">
            <div class="student-top">
              <div>
                <h3>${esc(student.name)}</h3>
                <p>${esc(student.parentName || 'No parent listed')} · ${esc(student.email || 'No email')} · ${esc(student.phone || 'No phone')}</p>
              </div>
              <div class="actions">
                <button class="btn" type="button" onclick="editStudent('${esc(student.id)}')">Edit</button>
                <button class="btn danger" type="button" onclick="deleteStudent('${esc(student.id)}')">Remove</button>
              </div>
            </div>
            <div class="meta">${enrollments || '<span class="pill off">No classes</span>'}</div>
            ${student.notes ? `<p style="margin-top:10px">${esc(student.notes)}</p>` : ''}
          </article>
        `;
      }).join('');
    }

    function renderClasses() {
      if (!state.roster.classes.length) {
        classesEl.innerHTML = '<div class="empty">No classes yet.</div>';
        return;
      }
      classesEl.innerHTML = state.roster.classes.map((classItem) => {
        const count = state.roster.students.filter((student) => enrollmentFor(student, classItem.id)).length;
        return `
          <article class="class-card">
            <div class="class-top">
              <div>
                <h3>${esc(classItem.name)}</h3>
                <div class="meta">
                  <span class="pill">${esc(classItem.term)}</span>
                  <span class="pill">${esc(formatProgram(classItem.program))}</span>
                  <span class="pill">${esc(classItem.day || 'No day')}</span>
                  <span class="pill green">${count} student${count === 1 ? '' : 's'}</span>
                </div>
                ${classItem.schedule ? `<p style="margin-top:8px">${esc(classItem.schedule)}</p>` : ''}
              </div>
              <button class="btn danger" type="button" onclick="deleteClass('${esc(classItem.id)}')">Remove</button>
            </div>
          </article>
        `;
      }).join('');
    }

    function resetStudentForm() {
      studentForm.reset();
      document.getElementById('studentId').value = '';
      document.getElementById('studentFormTitle').textContent = 'Add Student';
      renderEnrollmentControls();
      showNotice('');
    }

    window.editStudent = function editStudent(id) {
      const student = state.roster.students.find((item) => item.id === id);
      if (!student) return;
      document.getElementById('studentId').value = student.id;
      document.getElementById('studentName').value = student.name || '';
      document.getElementById('parentName').value = student.parentName || '';
      document.getElementById('email').value = student.email || '';
      document.getElementById('phone').value = student.phone || '';
      document.getElementById('notes').value = student.notes || '';
      document.getElementById('studentFormTitle').textContent = `Edit ${student.name}`;
      renderEnrollmentControls(student);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteStudent = async function deleteStudent(id) {
      if (!confirm('Remove this student from the master roster?')) return;
      try {
        const result = await api(`/api/master-roster/students/${encodeURIComponent(id)}`, { method: 'DELETE' });
        state.roster = result.data;
        resetStudentForm();
        renderAll();
      } catch (err) {
        showNotice(err.message);
      }
    };

    window.deleteClass = async function deleteClass(id) {
      if (!confirm('Remove this class? Students will be unenrolled from it.')) return;
      try {
        const result = await api(`/api/master-roster/classes/${encodeURIComponent(id)}`, { method: 'DELETE' });
        state.roster = result.data;
        resetStudentForm();
        renderAll();
      } catch (err) {
        showNotice(err.message);
      }
    };

    studentForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const id = document.getElementById('studentId').value;
      const payload = {
        name: document.getElementById('studentName').value,
        parentName: document.getElementById('parentName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        notes: document.getElementById('notes').value,
        enrollments: collectEnrollments()
      };
      try {
        const url = id ? `/api/master-roster/students/${encodeURIComponent(id)}` : '/api/master-roster/students';
        const method = id ? 'PATCH' : 'POST';
        const result = await api(url, { method, body: JSON.stringify(payload) });
        state.roster = result.data;
        resetStudentForm();
        renderAll();
      } catch (err) {
        showNotice(err.message);
      }
    });

    classForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        name: document.getElementById('className').value,
        term: document.getElementById('classTerm').value,
        program: document.getElementById('classProgram').value,
        day: document.getElementById('classDay').value,
        schedule: document.getElementById('classSchedule').value
      };
      try {
        const result = await api('/api/master-roster/classes', { method: 'POST', body: JSON.stringify(payload) });
        state.roster = result.data;
        classForm.reset();
        document.getElementById('classTerm').value = 'fall';
        renderAll();
      } catch (err) {
        showNotice(err.message);
      }
    });

    document.getElementById('cancelEditButton').addEventListener('click', resetStudentForm);
    document.getElementById('logoutButton').addEventListener('click', async () => {
      try { await fetch('/api/coach/logout', { method: 'POST' }); } finally { window.location.href = '/coach-login'; }
    });
    [searchInput, termFilter, classFilter].forEach((element) => element.addEventListener('input', renderStudents));

    load();
  </script>
</body>
</html>
