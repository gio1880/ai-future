<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Control | AI Future</title>
  <style>
    :root {
      --ink: #17202c;
      --muted: #667085;
      --line: #d8dee8;
      --brand: #2563ff;
      --brand-dark: #1648cc;
      --green: #0f766e;
      --page: #f5f7fb;
      --surface: #ffffff;
      --soft: #eef4ff;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page);
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .shell {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 850;
      background: linear-gradient(135deg, #2563ff, #14b8a6);
    }

    h1, h2, h3 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 1.45rem; }
    h2 { font-size: 1.1rem; }
    h3 { font-size: 1rem; }
    p { margin: 4px 0 0; color: var(--muted); line-height: 1.45; }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 13px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .btn.primary {
      border-color: var(--brand);
      color: #fff;
      background: var(--brand);
    }

    .btn.primary:hover { background: var(--brand-dark); }
    .btn.danger { color: var(--danger); }
    .btn:disabled { opacity: 0.65; cursor: wait; }

    main { padding: 24px 0 44px; }

    .layout {
      display: grid;
      grid-template-columns: minmax(290px, 360px) 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 10px 24px rgba(21, 31, 48, 0.07);
    }

    .panel-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-body { padding: 18px; }

    .notice {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(37, 99, 255, 0.24);
      background: var(--soft);
      color: #31415c;
      font-weight: 750;
    }

    .notice.error {
      border-color: rgba(180, 35, 24, 0.25);
      color: var(--danger);
      background: #fff7f5;
    }

    .coach-list {
      display: grid;
      gap: 8px;
      padding: 12px;
    }

    .coach-row {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 12px;
      text-align: left;
      background: #fff;
      cursor: pointer;
      font: inherit;
    }

    .coach-row:hover,
    .coach-row[aria-selected="true"] {
      border-color: var(--brand);
      background: var(--soft);
    }

    .coach-row strong { display: block; font-size: 0.98rem; }
    .coach-row span { display: block; margin-top: 3px; color: var(--muted); font-size: 0.86rem; }

    .status-pill {
      display: inline-block;
      margin-top: 8px;
      border-radius: 8px;
      padding: 4px 7px;
      color: var(--green);
      background: #eafaf7;
      font-size: 0.76rem;
      font-weight: 850;
    }

    .status-pill.off {
      color: var(--danger);
      background: #fff1ef;
    }

    form {
      display: grid;
      gap: 18px;
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    label.field {
      display: grid;
      gap: 7px;
      color: #31415c;
      font-size: 0.9rem;
      font-weight: 800;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
      color: var(--ink);
      background: #fff;
      font: inherit;
    }

    input:focus, select:focus {
      outline: 3px solid rgba(37, 99, 255, 0.18);
      border-color: var(--brand);
    }

    .toggles {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #31415c;
      font-weight: 800;
    }

    .check input { width: 18px; height: 18px; }

    .hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }

    .hub-check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-height: 74px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }

    .hub-check input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      flex: 0 0 auto;
    }

    .hub-check span {
      display: block;
      font-weight: 850;
    }

    .hub-check small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 820px) {
      .topbar { align-items: flex-start; flex-direction: column; padding: 16px 0; }
      .layout { grid-template-columns: 1fr; }
      .fields { grid-template-columns: 1fr; }
      .top-actions, .top-actions .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell topbar">
      <div class="brand">
        <div class="mark">AI</div>
        <div>
          <h1>Access Control</h1>
          <p>Master coach accounts, passwords, and hub permissions.</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn" type="button" onclick="window.location.href='/coach-portal'">Coach Portal</button>
        <button id="newButton" class="btn primary" type="button">New Coach</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <div id="notice" class="notice" role="alert"></div>
    <div class="layout">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>Coaches</h2>
            <p id="countLine">Loading...</p>
          </div>
        </div>
        <div id="coachList" class="coach-list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2 id="formTitle">Edit Coach</h2>
            <p>Changes here control the main portal, FLL Hub, Camp Hub, and linked coach tools.</p>
          </div>
        </div>
        <div class="panel-body">
          <form id="coachForm">
            <div class="fields">
              <label class="field">Name <input id="name" required></label>
              <label class="field">Username <input id="username" required autocomplete="username"></label>
              <label class="field">New password <input id="password" type="password" autocomplete="new-password" placeholder="Leave blank to keep current"></label>
              <label class="field">Role
                <select id="role">
                  <option value="coach">Coach</option>
                  <option value="owner">Owner</option>
                </select>
              </label>
            </div>

            <div class="toggles">
              <label class="check"><input id="active" type="checkbox"> Active account</label>
            </div>

            <div>
              <h3>Hub Access</h3>
              <p>Owner accounts automatically receive every admin hub.</p>
            </div>
            <div id="hubGrid" class="hub-grid"></div>

            <div class="form-actions">
              <button id="saveButton" class="btn primary" type="submit">Save Access</button>
              <button id="deactivateButton" class="btn danger" type="button">Deactivate</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script>
    const notice = document.getElementById('notice');
    const coachList = document.getElementById('coachList');
    const countLine = document.getElementById('countLine');
    const coachForm = document.getElementById('coachForm');
    const formTitle = document.getElementById('formTitle');
    const hubGrid = document.getElementById('hubGrid');
    const saveButton = document.getElementById('saveButton');
    const deactivateButton = document.getElementById('deactivateButton');
    const newButton = document.getElementById('newButton');
    const fields = {
      name: document.getElementById('name'),
      username: document.getElementById('username'),
      password: document.getElementById('password'),
      role: document.getElementById('role'),
      active: document.getElementById('active')
    };

    let users = [];
    let hubs = [];
    let selectedId = null;
    let creating = false;

    function showNotice(message, isError = false) {
      notice.textContent = message || '';
      notice.className = `notice${isError ? ' error' : ''}`;
      notice.style.display = message ? 'block' : 'none';
    }

    function selectedUser() {
      return users.find((user) => user.id === selectedId) || null;
    }

    function groupedHubs() {
      return hubs.slice().sort((a, b) => `${a.category} ${a.title}`.localeCompare(`${b.category} ${b.title}`));
    }

    function renderList() {
      coachList.innerHTML = '';
      countLine.textContent = `${users.filter((user) => user.active).length} active of ${users.length} total`;
      users.forEach((user) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'coach-row';
        button.setAttribute('aria-selected', String(user.id === selectedId));
        button.innerHTML = `
          <strong></strong>
          <span></span>
          <em class="status-pill"></em>
        `;
        button.querySelector('strong').textContent = user.name;
        button.querySelector('span').textContent = `${user.username} · ${user.role === 'owner' ? 'Owner' : 'Coach'} · ${user.hubs.length} hub${user.hubs.length === 1 ? '' : 's'}`;
        const pill = button.querySelector('.status-pill');
        pill.textContent = user.active ? 'Active' : 'Inactive';
        pill.classList.toggle('off', !user.active);
        button.addEventListener('click', () => {
          creating = false;
          selectedId = user.id;
          renderList();
          fillForm(user);
        });
        coachList.appendChild(button);
      });
    }

    function renderHubs(user) {
      const role = fields.role.value;
      const userHubs = new Set(user?.hubs || []);
      hubGrid.innerHTML = '';
      groupedHubs().forEach((hub) => {
        const label = document.createElement('label');
        label.className = 'hub-check';
        const disabled = role === 'owner' || hub.adminOnly;
        label.innerHTML = `
          <input type="checkbox" value="">
          <div><span></span><small></small></div>
        `;
        const input = label.querySelector('input');
        input.value = hub.id;
        input.checked = role === 'owner' || userHubs.has(hub.id);
        input.disabled = disabled;
        label.querySelector('span').textContent = hub.title;
        label.querySelector('small').textContent = `${hub.category}${hub.adminOnly ? ' · owner only' : ''}`;
        hubGrid.appendChild(label);
      });
    }

    function fillForm(user) {
      const source = user || { name: '', username: '', role: 'coach', hubs: [], active: true };
      formTitle.textContent = creating ? 'New Coach' : `Edit ${source.name}`;
      fields.name.value = source.name || '';
      fields.username.value = source.username || '';
      fields.password.value = '';
      fields.password.placeholder = creating ? 'Required for new coach' : 'Leave blank to keep current';
      fields.role.value = source.role === 'owner' ? 'owner' : 'coach';
      fields.active.checked = source.active !== false;
      deactivateButton.style.display = creating ? 'none' : 'inline-block';
      renderHubs(source);
    }

    function formPayload() {
      const role = fields.role.value;
      const checkedHubs = Array.from(hubGrid.querySelectorAll('input[type="checkbox"]:checked')).map((input) => input.value);
      return {
        name: fields.name.value.trim(),
        username: fields.username.value.trim(),
        password: fields.password.value,
        role,
        active: fields.active.checked,
        hubs: role === 'owner' ? hubs.map((hub) => hub.id) : checkedHubs
      };
    }

    async function loadAccessControl() {
      try {
        const response = await fetch('/api/coach/admin/users', { cache: 'no-store' });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Could not load access control');
        users = Array.isArray(result.users) ? result.users : [];
        hubs = Array.isArray(result.hubs) ? result.hubs : [];
        selectedId = selectedId || users[0]?.id || null;
        creating = !selectedId;
        renderList();
        fillForm(selectedUser());
      } catch (err) {
        showNotice(err.message || 'Could not load access control', true);
      }
    }

    coachForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      showNotice('');
      saveButton.disabled = true;
      try {
        const endpoint = creating ? '/api/coach/admin/users' : `/api/coach/admin/users/${encodeURIComponent(selectedId)}`;
        const response = await fetch(endpoint, {
          method: creating ? 'POST' : 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formPayload())
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Could not save coach');
        users = Array.isArray(result.users) ? result.users : users;
        selectedId = result.user?.id || selectedId;
        creating = false;
        renderList();
        fillForm(selectedUser());
        showNotice('Access saved.');
      } catch (err) {
        showNotice(err.message || 'Could not save coach', true);
      } finally {
        saveButton.disabled = false;
      }
    });

    deactivateButton.addEventListener('click', async () => {
      if (!selectedId) return;
      showNotice('');
      deactivateButton.disabled = true;
      try {
        const response = await fetch(`/api/coach/admin/users/${encodeURIComponent(selectedId)}`, { method: 'DELETE' });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Could not deactivate coach');
        users = Array.isArray(result.users) ? result.users : users;
        renderList();
        fillForm(selectedUser());
        showNotice('Coach deactivated.');
      } catch (err) {
        showNotice(err.message || 'Could not deactivate coach', true);
      } finally {
        deactivateButton.disabled = false;
      }
    });

    newButton.addEventListener('click', () => {
      creating = true;
      selectedId = null;
      renderList();
      fillForm(null);
      fields.name.focus();
    });

    fields.role.addEventListener('change', () => renderHubs(selectedUser()));

    loadAccessControl();
  </script>
</body>
</html>
