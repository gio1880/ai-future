<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coach Dashboard | Summer Camp Hub</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b2a4a" />
  <link rel="icon" href="/ai%20future%20logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* AI Future brand palette (see index.html) */
      --sun: #fece00;
      --sun-deep: #0b2a4a;
      --sun-light: #fff7d6;
      --sun-mid: #f5d96e;
      --sky: #1767b4;
      --sky-light: #e3effd;
      --grass: #16a34a;
      --grass-light: #e7f7ec;
      --red: #dc2626;
      --red-light: #fdecec;
      --ink: #10233f;
      --muted: #5f6c80;
      --line: #dce5ef;
      --bg: #f7f8fa;
      --white: #ffffff;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 20px rgba(11, 42, 74, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,0.94);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand { display: flex; align-items: center; gap: 11px; }

    .brand img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 4px;
      background: white;
    }

    .brand-text strong { display: block; font-size: 15px; font-weight: 800; }
    .brand-text span { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }

    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .chip {
      padding: 6px 12px;
      border-radius: 50px;
      border: 1.5px solid var(--line);
      font-size: 13px;
      font-weight: 700;
      background: white;
      color: var(--muted);
    }

    .chip.sun { background: var(--sun-light); border-color: var(--sun-mid); color: var(--sun-deep); }

    .btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 0;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      background: var(--ink);
      color: white;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.82; }

    .btn-primary { background: var(--sun-deep); }
    .btn-ghost {
      background: white;
      color: var(--sun-deep);
      border: 1.5px solid var(--sun-mid);
    }
    .btn-danger { background: var(--red-light); color: var(--red); }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .page-title { font-size: 26px; font-weight: 900; }
    .page-sub { font-size: 14px; color: var(--muted); margin-top: 4px; }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 18px;
      border-radius: 50px;
      border: 1.5px solid var(--line);
      background: white;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      color: var(--muted);
    }

    .tab-btn.active {
      background: var(--sun-deep);
      border-color: var(--sun-deep);
      color: white;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .section-title { font-size: 19px; font-weight: 900; margin-bottom: 6px; }
    .section-sub { font-size: 13.5px; color: var(--muted); margin-bottom: 16px; }

    .card {
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 18px;
    }

    /* Schedule editor */
    .week-block { margin-bottom: 14px; }

    .week-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
    }

    .week-head:hover { border-color: var(--sun-mid); }
    .week-head strong { font-size: 15px; }
    .week-head span { font-size: 12.5px; color: var(--muted); }

    .week-days { display: none; padding-top: 10px; }
    .week-block.open .week-days { display: grid; gap: 10px; }

    .day-edit {
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
    }

    .day-edit.is-today { border-color: var(--sun); background: var(--sun-light); }

    .day-edit-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .day-edit-date { font-weight: 900; font-size: 14px; }

    .day-edit label {
      display: block;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 10px 0 5px;
    }

    .day-edit textarea, .day-edit input {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 13.5px;
      background: white;
      color: var(--ink);
      outline: none;
      resize: vertical;
    }

    .day-edit textarea:focus, .day-edit input:focus { border-color: var(--sun); }

    .deck-open-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 8px 0 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: var(--sky);
      color: white;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(0,0,0,.12);
    }

    .deck-open-btn:hover { filter: brightness(.96); }

    .day-save-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .save-status {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--grass);
    }

    /* Announcements */
    .form-grid { display: grid; gap: 12px; }

    .form-grid label {
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      display: block;
      margin-bottom: 5px;
    }

    .form-grid input, .form-grid textarea, .form-grid select {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      font-size: 14px;
      outline: none;
      background: white;
      color: var(--ink);
    }

    .form-grid input:focus, .form-grid textarea:focus, .form-grid select:focus { border-color: var(--sun); }

    .announce-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 10px;
    }

    .announce-item.coach-only { border-left: 4px solid var(--sun); }

    .announce-item h4 { font-size: 15px; font-weight: 900; margin-bottom: 4px; }
    .announce-item p { font-size: 13.5px; color: var(--muted); line-height: 1.55; }

    .announce-meta {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    /* Campers */
    .table-wrap { overflow-x: auto; }

    table { border-collapse: collapse; width: 100%; min-width: 560px; }

    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px;
    }

    th {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: var(--sun-light);
    }

    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 50px;
      font-size: 11.5px;
      font-weight: 800;
    }
    .pill.on { background: var(--grass-light); color: var(--grass); }
    .pill.off { background: var(--red-light); color: var(--red); }

    .creds-box {
      background: var(--grass-light);
      border: 1.5px solid #bce5c8;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.7;
    }

    .creds-box code {
      background: white;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 8px;
      font-weight: 800;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .toolbar label {
      font-size: 12px;
      font-weight: 900;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .toolbar select {
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      background: white;
      color: var(--ink);
      font-weight: 700;
    }

    .progress-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .submission-card {
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .submission-card.missing { opacity: 0.72; background: #fbfcfd; }
    .submission-card h4 { font-size: 15px; margin-bottom: 6px; }
    .submission-card p { font-size: 13px; line-height: 1.5; color: var(--muted); margin-top: 8px; }
    .submission-card img { width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--line); margin-top: 10px; }

    .class-heading {
      font-size: 14px;
      font-weight: 900;
      color: var(--sun-deep);
      margin: 18px 0 8px;
    }

    .print-queue {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .print-queue-card {
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      background: white;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .print-queue-card h4 { margin: 0 0 6px; font-size: 15px; }
    .print-queue-card p { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 8px 0; }
    .print-queue-card img { width: 100%; max-height: 260px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--line); margin-top: 10px; }
    .print-controls { display: grid; grid-template-columns: 160px 110px 1fr auto; gap: 8px; align-items: end; margin-top: 12px; }
    .print-controls label { display: block; font-size: 11px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }

    .dojo-panel {
      display: grid;
      grid-template-columns: 1fr 1fr 110px 1.5fr auto;
      gap: 10px;
      align-items: end;
      margin-top: 14px;
    }

    .dojo-panel label {
      display: block;
      font-size: 11px;
      font-weight: 900;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 4px;
    }

    .dojo-feed {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .class-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
      margin: 14px 0 18px;
    }

    .class-tile {
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      background: white;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
      color: var(--ink);
    }

    .class-tile:hover,
    .class-tile.active {
      border-color: var(--sun);
      background: var(--sun-light);
    }

    .class-tile strong {
      display: block;
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .class-tile span {
      display: inline-block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-right: 8px;
    }

    .dojo-board-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .dojo-class-board {
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      background: white;
      padding: 16px;
      margin-bottom: 16px;
    }

    .dojo-board-tools {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .dojo-board-tools select,
    .dojo-board-tools input {
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      background: white;
      color: var(--ink);
      font-weight: 700;
      min-width: 150px;
    }

    .student-figure-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .student-figure-card {
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfd;
      padding: 14px;
      text-align: center;
    }

    .student-avatar {
      width: 66px;
      height: 66px;
      border-radius: 22px 22px 28px 28px;
      margin: 0 auto 10px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 900;
      font-size: 18px;
      box-shadow: inset 0 -10px 0 rgba(7,20,38,0.12), var(--shadow);
    }
    /* Cartoon-monster avatars (match the camper view) sit in a clean container */
    .student-avatar.monster { background: transparent; box-shadow: none; border-radius: 0; width: 64px; height: 66px; }
    .award-avatar.monster { background: transparent !important; }

    .student-figure-card h4 {
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .student-points {
      font-size: 22px;
      font-weight: 900;
      color: var(--sun-deep);
      margin-bottom: 10px;
    }

    .point-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .point-actions .btn {
      padding: 7px 8px;
      font-size: 12px;
    }

    .classroom-controls {
      display: grid;
      gap: 16px;
    }

    .control-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      align-items: end;
    }

    .group-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px;
      background: #fbfcfd;
      margin-top: 10px;
    }

    .group-card h4 { margin: 0 0 5px; }
    .group-card p { margin: 5px 0; color: var(--muted); font-size: 13px; line-height: 1.45; }

    .error-box {
      background: var(--red-light);
      border: 1.5px solid #f3c4c4;
      border-radius: var(--radius-sm);
      color: var(--red);
      padding: 12px 14px;
      font-size: 13.5px;
      margin-top: 12px;
      display: none;
    }

    .loading-state {
      min-height: 60vh;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .loading-spinner {
      font-size: 48px;
      animation: spin 1.5s linear infinite;
      display: block;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-size: 16px; font-weight: 700; color: var(--muted); }

    @media (max-width: 580px) {
      .page { padding-inline: 14px; }
      .dojo-panel { grid-template-columns: 1fr; }
      .student-figure-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* ── Collapsible sidebar dashboard layout ── */
    .dash { display: flex; gap: 20px; align-items: flex-start; }
    .sidebar {
      flex: 0 0 220px;
      position: sticky;
      top: 84px;
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 10px;
      transition: flex-basis 0.2s ease, transform 0.2s ease;
    }
    .sidebar nav { display: grid; gap: 4px; }
    .sidebar-tools {
      border-bottom: 1px solid var(--line);
      padding: 4px 4px 10px;
      margin-bottom: 8px;
      display: grid;
      gap: 8px;
    }
    .sidebar-tools label {
      display: block;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .sidebar-tools select {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      background: white;
      color: var(--ink);
      font-weight: 800;
      font-size: 13px;
    }
    .sidebar-tools select:focus { outline: 3px solid rgba(254,206,0,0.22); border-color: var(--sun); }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; text-align: left;
      padding: 11px 13px; border: 0; border-radius: var(--radius-sm);
      background: transparent; color: var(--ink);
      font-weight: 800; font-size: 14px; cursor: pointer;
      white-space: nowrap; overflow: hidden;
    }
    .nav-item:hover { background: var(--sun-light); }
    .nav-item.active { background: var(--sun-deep); color: white; }
    .nav-item .nav-ico { font-size: 17px; flex-shrink: 0; }
    .nav-item .nav-badge {
      margin-left: auto; background: var(--red); color: white;
      border-radius: 50px; font-size: 11px; font-weight: 900; padding: 1px 7px;
    }
    .nav-item.active .nav-badge { background: white; color: var(--sun-deep); }
    .dash-main { flex: 1 1 auto; min-width: 0; }
    .view { display: none; }
    .view.active { display: block; }

    .sidebar-toggle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--line); background: white; cursor: pointer;
      font-size: 18px; flex-shrink: 0;
    }
    .sidebar-toggle:hover { border-color: var(--sun); }

    /* Collapsed: sidebar slides away, main takes full width */
    .dash.collapsed .sidebar { display: none; }

    /* ── Live Lesson ── */
    .lesson-card {
      background: white; border: 1.5px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    }
    .lesson-card.is-live { border-color: var(--sun); box-shadow: 0 0 0 2px var(--sun-mid); }
    .lesson-card h4 { font-size: 16px; font-weight: 900; margin-bottom: 3px; }
    .lesson-card .meta { font-size: 12.5px; color: var(--muted); }
    .lesson-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .warmup-box {
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 14px;
      margin: 14px 0;
    }
    .warmup-box h4 { margin: 0 0 8px; font-size: 15px; font-weight: 900; }
    .warmup-q {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      margin-bottom: 8px;
      resize: vertical;
    }
    .warmup-panel {
      border: 1.5px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: var(--card-shadow);
      padding: 18px;
      margin-bottom: 18px;
    }
    .warmup-summary { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
    .warmup-answer {
      border-top: 1px solid var(--line);
      padding: 11px 0;
    }
    .warmup-answer strong { display: block; font-size: 13px; margin-bottom: 3px; }
    .warmup-answer p { margin: 0; color: var(--muted); line-height: 1.45; }
    .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 5px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .warmup-live-flag { margin: 10px 0 4px; font-weight: 800; font-size: 13.5px; color: var(--sun-deep); display: flex; align-items: center; gap: 4px; }

    .slide-editor {
      background: var(--bg); border: 1.5px solid var(--line); border-left: 4px solid var(--sun);
      border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px;
    }
    .slide-editor-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .slide-editor-head .idx { font-weight: 900; font-size: 13px; color: var(--sun-deep); }
    .slide-editor label { display: block; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 8px 0 4px; }
    .slide-editor input, .slide-editor textarea, .slide-editor select {
      width: 100%; border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 11px;
      font-size: 14px; background: white; color: var(--ink); outline: none; resize: vertical;
    }
    .slide-editor input:focus, .slide-editor textarea:focus, .slide-editor select:focus { border-color: var(--sun); }
    .opt-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .opt-row input[type="radio"] { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--grass); }
    .opt-row input[type="text"] { flex: 1; }
    .opt-row .opt-x { border: 0; background: var(--red-light); color: var(--red); border-radius: 7px; width: 30px; height: 32px; cursor: pointer; font-weight: 900; flex-shrink: 0; }
    .mini-btn { border: 1.5px solid var(--line); background: white; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 800; cursor: pointer; }
    .mini-btn:hover { border-color: var(--sun); }

    /* Presenter */
    .presenter { background: white; border: 1.5px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .presenter-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      background: var(--sun-deep); color: white; padding: 14px 18px;
    }
    .presenter-bar .title { font-weight: 900; font-size: 15px; }
    .presenter-bar .counter { font-weight: 800; font-size: 13px; opacity: 0.9; }
    .presenter-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .presenter-controls .btn { min-width: 92px; justify-content: center; }
    .slide-show { padding: 26px; min-height: 240px; }
    .slide-show.q { background: linear-gradient(180deg, var(--sun-light), white); }
    .slide-kicker { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sun-deep); margin-bottom: 8px; }
    .slide-show h2 { font-size: clamp(22px, 3vw, 30px); font-weight: 900; margin-bottom: 12px; line-height: 1.15; }
    .slide-show .body { font-size: clamp(16px, 2vw, 19px); line-height: 1.6; white-space: pre-wrap; }
    .slide-show img { max-width: 100%; max-height: 280px; border-radius: var(--radius-sm); margin-top: 14px; border: 1px solid var(--line); }
    .tally { display: grid; gap: 10px; margin-top: 18px; }
    .tally-row { }
    .tally-row .tally-label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; margin-bottom: 4px; }
    .tally-row.correct .tally-label { color: var(--grass); }
    .tally-bar { height: 26px; background: var(--bg); border-radius: 50px; overflow: hidden; border: 1px solid var(--line); }
    .tally-fill { height: 100%; background: var(--sun); border-radius: 50px; transition: width 0.4s ease; min-width: 2px; }
    .tally-row.correct .tally-fill { background: var(--grass); }
    .slide-thumbs { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--bg); }
    .thumb { width: 30px; height: 30px; border-radius: 7px; border: 1.5px solid var(--line); background: white; font-size: 12px; font-weight: 900; cursor: pointer; color: var(--muted); }
    .thumb.current { background: var(--sun-deep); color: white; border-color: var(--sun-deep); }
    .thumb.q { border-color: var(--sun); }

    /* Touch devices (iPad/phone): 16px inputs stop iOS focus-zoom; bigger tap targets */
    @media (pointer: coarse) {
      body { -webkit-tap-highlight-color: transparent; }
      .day-edit textarea, .day-edit input,
      .form-grid input, .form-grid textarea, .form-grid select,
      .slide-editor input, .slide-editor textarea, .slide-editor select { font-size: 16px; }
      .btn { min-height: 44px; }
      .tab-btn, .nav-item { min-height: 46px; }
      .week-head { padding: 18px; }
      th, td { padding: 14px 16px; }
    }

    @media (max-width: 820px) {
      .dash { flex-direction: column; }
      .sidebar { flex-basis: auto; width: 100%; position: static; }
      .sidebar nav { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; }
    }

    /* ============================================================
       MODERN OVERHAUL (overrides — keep at end of stylesheet)
       ============================================================ */
    :root {
      --shell-bg: #f1f5f9;
      --card-shadow: 0 1px 2px rgba(16,33,55,0.04), 0 8px 24px rgba(16,33,55,0.06);
      --card-radius: 18px;
    }
    body { background: var(--shell-bg); }

    /* App shell: full-width, sidebar tucks right under the sticky header */
    .page { max-width: 1280px; padding: 18px 22px 80px; }
    .dash { gap: 22px; align-items: flex-start; }

    /* Sidebar as a clean rail */
    .sidebar {
      flex-basis: 248px;
      top: 80px;
      padding: 14px;
      border: 1px solid #e6edf5;
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      background: #fff;
    }
    .sidebar-tools {
      display: grid; gap: 10px;
      padding: 4px 4px 14px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .sidebar-tools label {
      display: block; font-size: 10.5px; font-weight: 900; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--muted); margin-bottom: 6px;
    }
    .sidebar-tools select {
      width: 100%; border: 1.5px solid var(--line); border-radius: 10px;
      padding: 10px 12px; background: var(--bg); color: var(--ink); font-weight: 700; font-size: 14px;
    }
    .sidebar-tools .btn { width: 100%; justify-content: center; }

    .sidebar nav { gap: 3px; }
    .nav-item {
      position: relative; gap: 12px; padding: 12px 14px; border-radius: 12px;
      font-size: 14.5px; color: #3b4a5e;
    }
    .nav-item:hover { background: var(--sun-light); color: var(--ink); }
    .nav-item.active {
      background: linear-gradient(100deg, var(--sun-deep), #14365a); color: #fff;
      box-shadow: 0 6px 16px rgba(11,42,74,0.22);
    }
    .nav-item.active::before {
      content: ""; position: absolute; left: 5px; top: 50%; transform: translateY(-50%);
      width: 4px; height: 20px; border-radius: 4px; background: var(--gold);
    }
    .nav-item .nav-ico { font-size: 18px; }
    .nav-badge { box-shadow: 0 2px 6px rgba(220,38,38,0.3); }

    /* Toggle button: a touch friendlier */
    .sidebar-toggle { border-color: #e6edf5; box-shadow: var(--card-shadow); background: #fff; }
    .sidebar-toggle:hover { background: var(--sun-light); border-color: var(--sun-mid); }

    /* Page heading now lives in the main column, above the active view */
    .dash-main { display: flex; flex-direction: column; }
    .page-head {
      margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid #e6edf5;
      align-items: flex-end;
    }
    .page-title { font-size: 24px; letter-spacing: -0.02em; }
    .page-sub { font-size: 13.5px; }

    /* Cards & section headers refreshed */
    .card {
      border: 1px solid #e6edf5; border-radius: var(--card-radius);
      box-shadow: var(--card-shadow); padding: 22px;
    }
    .section-title { font-size: 18px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 9px; }
    .section-sub { font-size: 13.5px; line-height: 1.55; }

    /* ── Classroom tools (rebuilt) ── */
    .cl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .cl-card {
      border: 1px solid #e6edf5; border-radius: 16px; background: #fff;
      box-shadow: var(--card-shadow); padding: 18px; display: flex; flex-direction: column;
    }
    .cl-card-title { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .cl-field { margin-bottom: 12px; }
    .cl-field label { display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
    .cl-field input, .cl-field textarea {
      width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px;
      font-size: 14px; background: var(--bg); color: var(--ink); outline: none; resize: vertical;
    }
    .cl-field input:focus, .cl-field textarea:focus { border-color: var(--sun); background: #fff; }
    .cl-row2 { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }

    .timer-display {
      text-align: center; padding: 14px; margin: 4px 0 14px;
      background: linear-gradient(180deg, var(--sun-light), #fff);
      border: 1px solid var(--sun-mid); border-radius: 14px;
    }
    .timer-display .t-time { font-size: 44px; font-weight: 900; line-height: 1; color: var(--sun-deep); font-variant-numeric: tabular-nums; }
    .timer-display .t-state { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 6px; color: var(--muted); }
    .timer-display.is-running .t-state { color: var(--grass); }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-group .btn { flex: 1; justify-content: center; min-width: 84px; }

    .seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .seg-btn {
      border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px;
      padding: 12px 6px; font-weight: 800; font-size: 12.5px; cursor: pointer; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 4px; text-transform: capitalize;
    }
    .seg-btn .seg-ico { font-size: 18px; }
    .seg-btn:hover { border-color: var(--sun-mid); }
    .seg-btn.active { background: var(--sun-deep); border-color: var(--sun-deep); color: #fff; }

    .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .group-tile {
      border: 1px solid #e6edf5; border-left: 4px solid var(--sun); border-radius: 14px;
      background: #fff; box-shadow: var(--card-shadow); padding: 15px 16px;
    }
    .group-tile h4 { margin: 0 0 8px; font-size: 15px; font-weight: 900; }
    .group-tile .g-focus { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; line-height: 1.45; }
    .group-tile .g-chiprow { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
    .g-chip { background: var(--sun-light); color: var(--sun-deep); border-radius: 50px; font-size: 11.5px; font-weight: 800; padding: 3px 9px; }
    .g-sub { font-size: 12.5px; margin: 6px 0 0; }
    .g-sub strong { color: var(--ink); }
    .group-tile .g-del { margin-top: 12px; }

    /* ── Fullscreen presenter ── */
    .presenter-bar .fs-btn {
      background: rgba(255,255,255,0.16); color: #fff; border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 10px; font-weight: 800; font-size: 14px; padding: 9px 13px; cursor: pointer; min-height: 42px;
    }
    .presenter-bar .fs-btn:hover { background: rgba(255,255,255,0.28); }
    .presenter:fullscreen { display: flex; flex-direction: column; background: #fff; }
    .presenter:fullscreen .slide-show { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 5vh 8vw; }
    .presenter:fullscreen .slide-show h2 { font-size: clamp(34px, 6vw, 68px); }
    .presenter:fullscreen .slide-show .body { font-size: clamp(22px, 3.4vw, 40px); }
    .presenter:fullscreen .slide-show img { max-height: 50vh; }
    .presenter:-webkit-full-screen .slide-show { flex: 1; display: flex; flex-direction: column; justify-content: center; }

    /* ── ClassDojo-style board: tappable camper cards ── */
    .student-figure-card.tappable {
      cursor: pointer; border: 1.5px solid var(--line); background: #fff; text-align: center;
      transition: transform 0.12s, box-shadow 0.15s, border-color 0.15s; font: inherit; color: inherit;
    }
    .student-figure-card.tappable:hover { transform: translateY(-3px); border-color: var(--sun-mid); box-shadow: 0 10px 26px rgba(11,42,74,0.14); }
    .student-figure-card.tappable:active { transform: scale(0.97); }
    .student-points { transition: transform 0.2s; }

    /* ── Award / manage modals ── */
    .award-overlay {
      position: fixed; inset: 0; z-index: 90; background: rgba(7,20,38,0.55);
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      display: none; place-items: center; padding: 18px; overflow-y: auto;
    }
    .award-overlay.open { display: grid; }
    .award-modal {
      width: min(560px, 100%); background: #fff; border-radius: 22px; box-shadow: 0 24px 70px rgba(7,20,38,0.3);
      max-height: calc(100vh - 36px); overflow-y: auto; padding: 20px 22px; position: relative;
      animation: pop .2s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: none; } }
    .award-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .award-avatar { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 20px; flex-shrink: 0; }
    .award-who { flex: 1; min-width: 0; }
    .award-who h3 { margin: 0; font-size: 21px; font-weight: 900; }
    .award-total { font-size: 14px; font-weight: 800; color: var(--sun-deep); margin-top: 2px; }
    .award-close { border: 0; background: #eef1f5; color: var(--ink); width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; }
    .award-close:hover { background: #e2e7ee; }

    .skill-section-label { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 10px; }
    .skill-section-label.pos { color: var(--grass); }
    .skill-section-label.neg { color: var(--red); }
    .skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .skill-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
      border: 2px solid var(--line); border-radius: 16px; background: #fff; padding: 14px 8px; cursor: pointer;
      font: inherit; transition: transform 0.1s, box-shadow 0.15s, background 0.15s;
    }
    .skill-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(11,42,74,0.12); }
    .skill-btn:active { transform: scale(0.94); }
    .skill-btn.pos { border-color: #bce5c8; }
    .skill-btn.pos:hover { background: var(--grass-light); }
    .skill-btn.neg { border-color: #f3c4c4; }
    .skill-btn.neg:hover { background: var(--red-light); }
    .skill-btn .skill-ico { font-size: 28px; line-height: 1; }
    .skill-btn .skill-name { font-size: 13px; font-weight: 800; line-height: 1.2; }
    .skill-btn .skill-pts { font-size: 13px; font-weight: 900; }
    .skill-btn.pos .skill-pts { color: var(--grass); }
    .skill-btn.neg .skill-pts { color: var(--red); }

    .award-fx {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
      font-size: 56px; font-weight: 900; pointer-events: none; opacity: 0; z-index: 5;
      text-shadow: 0 4px 18px rgba(0,0,0,0.18);
    }
    .award-fx.pos { color: var(--grass); }
    .award-fx.neg { color: var(--red); }
    @keyframes awardPop {
      0% { opacity: 0; transform: translate(-50%,-30%) scale(0.5); }
      30% { opacity: 1; transform: translate(-50%,-55%) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%,-85%) scale(1); }
    }

    .skill-manage-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
    .pos-label { color: var(--grass) !important; }
    .neg-label { color: var(--red) !important; }
    .skill-manage-row { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: #fff; }
    .skill-manage-row .sm-ico { font-size: 20px; }
    .skill-manage-row .sm-name { flex: 1; font-weight: 800; font-size: 14px; }
    .skill-manage-row .btn { padding: 6px 10px; font-size: 12px; }
    .skill-add { border-top: 1px solid var(--line); padding-top: 14px; }
    .skill-add-grid { display: grid; grid-template-columns: 60px 1fr 70px 130px auto; gap: 8px; align-items: center; }
    .skill-add-grid input, .skill-add-grid select { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; font-size: 14px; background: #fff; color: var(--ink); width: 100%; }

    @media (max-width: 560px) {
      .skill-manage-cols { grid-template-columns: 1fr; }
      .skill-add-grid { grid-template-columns: 60px 1fr; }
    }

    /* ── Question manager (add / edit / delete Kahoot questions) ── */
    .qm-modal { width: min(620px, 100%); }
    .qm-list { display: grid; gap: 10px; }
    .qm-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; }
    .qm-row .qm-q { flex: 1; min-width: 0; }
    .qm-row .qm-q strong { display: block; font-size: 14.5px; line-height: 1.3; }
    .qm-row .qm-correct { font-size: 12.5px; color: var(--grass); font-weight: 800; margin-top: 4px; }
    .qm-row .qm-acts { display: flex; gap: 6px; flex-shrink: 0; }
    .qm-row .qm-acts .btn { padding: 7px 11px; font-size: 12.5px; }
    .qm-empty { color: var(--muted); font-weight: 700; padding: 18px 4px; text-align: center; }
    .qm-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 4px 0 14px; }
    .qm-toolbar .qm-count { font-weight: 800; font-size: 13.5px; color: var(--muted); }
    .qm-form label { display: block; font-weight: 800; font-size: 13.5px; margin: 14px 0 6px; }
    .qm-form textarea, .qm-opt input {
      width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px;
      font: inherit; font-size: 14.5px; background: #fff; color: var(--ink);
    }
    .qm-form textarea { min-height: 60px; resize: vertical; }
    .qm-opt { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .qm-opt input { flex: 1; }
    .qm-opt .qm-correct-pick { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; cursor: pointer; }
    .qm-opt .qm-correct-pick input { width: 18px; height: 18px; accent-color: var(--grass); }
    .qm-opt .qm-del-opt { border: 0; background: #eef1f5; color: var(--ink); width: 32px; height: 32px; border-radius: 9px; cursor: pointer; font-size: 15px; flex-shrink: 0; }
    .qm-opt .qm-del-opt:hover { background: var(--red-light); }
    .qm-form-actions { display: flex; gap: 8px; margin-top: 18px; }
    .qm-add-opt { margin-top: 4px; }
    .qm-hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

    /* ── Lesson Slides (present exact decks) ── */
    .teacher-decks { margin-bottom: 22px; border: 1.5px solid var(--sun-mid); }
    .teacher-decks .present-today {
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 16px; padding: 14px 22px; margin: 4px 0 18px; text-decoration: none;
    }
    .deck-list { display: grid; gap: 8px; }
    .deck-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); background: #fff;
    }
    .deck-row.is-today { border-color: var(--sun); background: var(--sun-light); }
    .deck-row .deck-info strong { display: block; font-size: 14px; }
    .deck-row .deck-build { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    .deck-row .btn { text-decoration: none; white-space: nowrap; }
    .deck-row-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

    /* Live HTML-deck presenter */
    .deck-presenter { display: flex; flex-direction: column; }
    .deck-frame { width: 100%; height: min(64vh, 620px); border: 0; background: #8fc4f4; display: block; }
    .deck-presenter:fullscreen .deck-frame { flex: 1; height: auto; }
    .deck-presenter:-webkit-full-screen .deck-frame { flex: 1; height: auto; }
    .deck-q-bar { border-top: 1.5px solid var(--line); padding: 14px 16px; background: var(--bg); }
    .deck-q-label { font-weight: 800; display: block; margin-bottom: 8px; }
    .deck-q-push-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .deck-q-push-row select { flex: 1; min-width: 200px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); font: inherit; background: #fff; }
    .deck-q-empty { color: var(--muted); font-weight: 700; }
    .deck-q-live .deck-q-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    .deck-q-live .deck-q-head strong { font-size: 16px; }
    .deck-q-live .deck-q-body { font-size: 14px; color: var(--ink); margin-bottom: 12px; }
    .deck-presenter:fullscreen .deck-q-bar, .deck-presenter:-webkit-full-screen .deck-q-bar { max-height: 38vh; overflow: auto; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Show or hide menu" title="Show/hide menu">☰</button>
        <img src="/ai%20future%20logo.png" alt="AI Future" />
        <div class="brand-text">
          <strong>Coach Dashboard</strong>
          <span id="userLine">Loading…</span>
        </div>
      </div>
      <div class="topbar-right">
        <a class="chip" href="/camp-hub">Camper view</a>
        <span class="chip sun">Coach</span>
        <button class="btn" id="logoutButton">Sign out</button>
      </div>
    </div>
  </header>

  <main class="page" id="app">
    <div class="loading-state">
      <span class="loading-spinner">☀️</span>
      <p class="loading-text">Loading the coach dashboard…</p>
    </div>
  </main>

  <!-- Award points modal (ClassDojo-style) -->
  <div class="award-overlay" id="awardOverlay" onclick="if(event.target===this)closeAward()">
    <div class="award-modal">
      <div id="awardModalBody"></div>
      <div class="award-fx" id="awardFx" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Manage skills modal -->
  <div class="award-overlay" id="skillsOverlay" onclick="if(event.target===this)closeManageSkills()">
    <div class="award-modal">
      <div class="award-head">
        <h3 style="margin:0;font-size:18px;font-weight:900;flex:1">⚙️ Manage Skills</h3>
        <button class="award-close" type="button" onclick="closeManageSkills()" aria-label="Close">✕</button>
      </div>
      <div id="skillsModalBody"></div>
    </div>
  </div>

  <!-- Question manager modal (add / edit / delete Kahoot questions; saved to the lesson) -->
  <div class="award-overlay" id="qmOverlay" onclick="if(event.target===this)closeQuestionManager()">
    <div class="award-modal qm-modal">
      <div class="award-head">
        <div class="award-who" style="flex:1">
          <h3 id="qmTitle" style="margin:0;font-size:19px;font-weight:900">Questions</h3>
          <div class="award-total" id="qmSubtitle">💾 Saved for next time</div>
        </div>
        <button class="award-close" type="button" onclick="closeQuestionManager()" aria-label="Close">✕</button>
      </div>
      <div id="qmBody"></div>
    </div>
  </div>

  <script>
    const app = document.getElementById('app');
    const userLine = document.getElementById('userLine');
    const logoutButton = document.getElementById('logoutButton');

    let hubData = null;
    let roster = [];
    let progressData = { students: [], days: [], submissions: [] };
    let printQueue = [];
    let projectQueue = [];
    let rosterView = 'class';
    let selectedClassName = '';
    let classroomState = { noiseLevel: 'partner', timer: { label: 'Work time', durationMinutes: 20, pausedRemainingSeconds: 1200, running: false }, groups: [] };
    let lessons = [];
    let liveState = null;
    let livePollTimer = null;
    let lessonDraft = null;
    let warmupResponses = null;
    let warmupSelectedDayId = '';

    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function todayKey() {
      const now = new Date();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${now.getFullYear()}-${m}-${d}`;
    }

    function fmt(value, opts) {
      if (!value) return '';
      const date = new Date(`${value}T12:00:00`);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString(undefined, opts);
    }

    function defaultBeginQuestions(day) {
      const custom = Array.isArray(day.beginLessonQuestions) ? day.beginLessonQuestions.filter(Boolean).slice(0, 3) : [];
      if (custom.length >= 3) return custom.slice(0, 3);
      const activity = day.activity || day.assignment || 'today\'s challenge';
      const build = day.build || day.assignment || activity || 'this project';
      return [...custom,
        `What part of "${activity}" sounds most interesting or surprising to you?`,
        `Before we begin, what do you predict will be the trickiest part of building or testing ${build}?`,
        'If you were the engineer leading this lesson, what would you try first and why?'
      ].slice(0, 3);
    }

    function formatProgramLabel(program) {
      const labels = { 'lego-robotics': 'LEGO Robotics', ftc: 'FTC Robotics', fll: 'FLL', 'code-lab': 'Code Lab' };
      return labels[program] || 'Robotics';
    }

    const summerClassOrder = ['Summer LEGO Robotics G2-3', 'Summer LEGO Robotics G4-5', 'Summer FTC Robotics G6+'];

    function summerClassRank(name) {
      const index = summerClassOrder.indexOf(name);
      return index === -1 ? 99 : index;
    }

    function classList() {
      return Array.from(new Set([
        ...summerClasses().map(item => item.name),
        ...roster.filter(u => u.role === 'student').map(u => u.className || 'Unassigned')
      ])).sort((a, b) => {
        return summerClassRank(a) - summerClassRank(b) || a.localeCompare(b);
      });
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const result = await response.json().catch(() => ({}));
      if (response.status === 401) {
        window.location.href = '/camp-hub/login';
        throw new Error('Login required');
      }
      if (!response.ok || result.success === false) {
        throw new Error(result.message || 'Request failed');
      }
      return result;
    }

    /* ── Schedule tab ── */
    function renderScheduleTab(curriculum) {
      const today = todayKey();
      return `
        <div class="section-title">Schedule Editor</div>
        <p class="section-sub">Edit any day's activity, build, or private coach notes — campers see activity and build instantly. Weeks 7–8 have open days ready to fill in.</p>
        ${curriculum.map(week => {
          const dates = (week.days || []).map(d => d.date).filter(Boolean).sort();
          const isCurrent = dates.length && today >= dates[0] && today <= dates[dates.length - 1];
          return `
            <div class="week-block ${isCurrent ? 'open' : ''}" id="wk-${esc(week.id)}">
              <div class="week-head" onclick="document.getElementById('wk-${esc(week.id)}').classList.toggle('open')">
                <div>
                  <strong>${esc(week.label)}${week.theme ? ` · ${esc(week.theme)}` : ''}</strong><br/>
                  <span>${esc(fmt(dates[0], { month: 'short', day: 'numeric' }))} – ${esc(fmt(dates[dates.length - 1], { month: 'short', day: 'numeric' }))}${week.goal ? ` · ${esc(week.goal)}` : ''}</span>
                </div>
                <span style="font-weight:900;color:var(--sun-deep)">${isCurrent ? 'This week' : 'Edit'} ▾</span>
              </div>
              <div class="week-days">
                ${(week.days || []).map(day => `
                  <div class="day-edit ${day.date === today ? 'is-today' : ''}" id="day-${esc(day.id)}">
                    <div class="day-edit-head">
                      <span class="day-edit-date">${esc(fmt(day.date, { weekday: 'long', month: 'long', day: 'numeric' }))}${day.date === today ? ' · TODAY' : ''}</span>
                    </div>
                    <label>Activity (campers see this)</label>
                    <textarea rows="2" data-field="activity">${esc(day.activity)}</textarea>
                    <label>Assignment / reflection prompt (campers submit this)</label>
                    <textarea rows="2" data-field="assignment">${esc(day.assignment || '')}</textarea>
                    <label>Build (campers see this)</label>
                    <input data-field="build" value="${esc(day.build)}" />
                    <label>Worksheet or PDF label</label>
                    <input data-field="worksheetLabel" value="${esc(day.worksheetLabel || '')}" placeholder="e.g. Gear Ratio Worksheet" />
                    <label>Worksheet or PDF URL</label>
                    <input data-field="worksheetUrl" value="${esc(day.worksheetUrl || '')}" placeholder="https://... or /path/to/file.pdf" />
                    ${day.lessonDeckUrl ? `<a class="deck-open-btn" href="${esc(day.lessonDeckUrl)}" target="_blank" rel="noreferrer">Open exact Lesson Building deck</a>` : ''}
                    <label>Lesson deck URL</label>
                    <input data-field="lessonDeckUrl" value="${esc(day.lessonDeckUrl || '')}" placeholder="/camp-hub/lessons/..." />
                    <label>Coach notes (private — coaches only)</label>
                    <textarea rows="2" data-field="coachNotes">${esc(day.coachNotes)}</textarea>
                    <div class="warmup-box">
                      <h4>Begin Lesson Questions</h4>
                      <p class="section-sub" style="margin-bottom:10px">Campers answer these before the live lesson starts.</p>
                      ${defaultBeginQuestions(day).map((question, qIndex) => `
                        <textarea class="warmup-q" rows="2" data-begin-question="${qIndex}" placeholder="Warm-up question ${qIndex + 1}">${esc(question)}</textarea>
                      `).join('')}
                      <button class="mini-btn" type="button" onclick="resetBeginQuestions('${esc(day.id)}')">Reset to defaults</button>
                    </div>
                    <div class="day-save-row">
                      <button class="btn btn-primary" onclick="saveDay('${esc(day.id)}')">Save day</button>
                      <span class="save-status" id="status-${esc(day.id)}"></span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).join('')}
      `;
    }

    async function saveDay(dayId) {
      const box = document.getElementById('day-' + dayId);
      const status = document.getElementById('status-' + dayId);
      if (!box) return;
      const payload = {};
      box.querySelectorAll('[data-field]').forEach(el => { payload[el.dataset.field] = el.value; });
      payload.beginLessonQuestions = [...box.querySelectorAll('[data-begin-question]')].map(el => el.value);
      status.textContent = 'Saving…';
      status.style.color = 'var(--muted)';
      try {
        const result = await api(`/api/camp/coach/days/${encodeURIComponent(dayId)}`, {
          method: 'PATCH',
          body: JSON.stringify(payload)
        });
        const localDay = (hubData.curriculum || []).flatMap(week => week.days || []).find(item => item.id === dayId);
        if (localDay && result.day) Object.assign(localDay, result.day);
        status.textContent = 'Saved ✓';
        status.style.color = 'var(--grass)';
        setTimeout(() => { status.textContent = ''; }, 2500);
      } catch (err) {
        status.textContent = err.message;
        status.style.color = 'var(--red)';
      }
    }

    /* ── Announcements tab ── */
    function resetBeginQuestions(dayId) {
      const day = (hubData.curriculum || []).flatMap(week => week.days || []).find(item => item.id === dayId);
      const box = document.getElementById('day-' + dayId);
      if (!day || !box) return;
      const draft = { ...day, beginLessonQuestions: [] };
      box.querySelectorAll('[data-field]').forEach(el => { draft[el.dataset.field] = el.value; });
      const questions = defaultBeginQuestions(draft);
      box.querySelectorAll('[data-begin-question]').forEach((el, index) => { el.value = questions[index] || ''; });
    }

    function renderAnnouncementsTab(announcements) {
      return `
        <div class="section-title">Announcements</div>
        <p class="section-sub">Post updates for campers, or coach-only notes for the team. Newest first.</p>
        <div class="card">
          <div class="form-grid">
            <div>
              <label for="annTitle">Title</label>
              <input id="annTitle" placeholder="e.g. Bring a water bottle tomorrow!" />
            </div>
            <div>
              <label for="annBody">Message</label>
              <textarea id="annBody" rows="3" placeholder="What do campers (or coaches) need to know?"></textarea>
            </div>
            <div>
              <label for="annAudience">Audience</label>
              <select id="annAudience">
                <option value="all">Everyone</option>
                <option value="coach">Coaches only</option>
              </select>
            </div>
            <div>
              <button class="btn btn-primary" onclick="postAnnouncement()">Post announcement</button>
            </div>
            <div class="error-box" id="annError"></div>
          </div>
        </div>
        <div id="announceList">
          ${renderAnnounceItems(announcements)}
        </div>
      `;
    }

    function renderAnnounceItems(announcements) {
      const sorted = [...announcements].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
      if (!sorted.length) return '<p style="color:var(--muted);font-size:14px">No announcements yet.</p>';
      return sorted.map(a => `
        <div class="announce-item ${a.audience === 'coach' ? 'coach-only' : ''}">
          <div>
            <div class="announce-meta">${esc(a.date || '')} · ${a.audience === 'coach' ? 'Coaches only' : 'Everyone'}</div>
            <h4>${esc(a.title)}</h4>
            <p>${esc(a.body)}</p>
          </div>
          <button class="btn btn-danger" onclick="deleteAnnouncement('${esc(a.id)}')">Delete</button>
        </div>
      `).join('');
    }

    async function postAnnouncement() {
      const title = document.getElementById('annTitle').value.trim();
      const body = document.getElementById('annBody').value.trim();
      const audience = document.getElementById('annAudience').value;
      const errorBox = document.getElementById('annError');
      errorBox.style.display = 'none';
      if (!title || !body) {
        errorBox.textContent = 'Title and message are both required.';
        errorBox.style.display = 'block';
        return;
      }
      try {
        const result = await api('/api/camp/coach/announcements', {
          method: 'POST',
          body: JSON.stringify({ title, body, audience })
        });
        hubData.announcements = result.announcements;
        document.getElementById('announceList').innerHTML = renderAnnounceItems(hubData.announcements);
        document.getElementById('annTitle').value = '';
        document.getElementById('annBody').value = '';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    }

    async function deleteAnnouncement(id) {
      if (!confirm('Delete this announcement?')) return;
      try {
        const result = await api(`/api/camp/coach/announcements/${encodeURIComponent(id)}`, { method: 'DELETE' });
        hubData.announcements = result.announcements;
        document.getElementById('announceList').innerHTML = renderAnnounceItems(hubData.announcements);
      } catch (err) {
        alert(err.message);
      }
    }

    /* ── Campers tab ── */
    const NOISE_LEVELS = [
      { id: 'silent', ico: '🤫', label: 'Silent' },
      { id: 'whisper', ico: '🔉', label: 'Whisper' },
      { id: 'partner', ico: '👥', label: 'Partner' },
      { id: 'team', ico: '👫', label: 'Team' },
      { id: 'present', ico: '🙌', label: 'Present' }
    ];

    function coachTimerRemaining() {
      const t = classroomState.timer || {};
      const base = Number(t.pausedRemainingSeconds || 0);
      if (t.running && t.startedAt) {
        const elapsed = Math.floor((Date.now() - new Date(t.startedAt).getTime()) / 1000);
        return Math.max(0, base - elapsed);
      }
      return base;
    }
    function fmtClock(sec) {
      const m = Math.floor(sec / 60), s = sec % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function renderClassroomControls() {
      const timer = classroomState.timer || {};
      const running = !!timer.running;
      return `
        <div class="section-title">🎛️ Classroom Tools</div>
        <p class="section-sub">Set the shared timer, noise level, and groups that campers see live in their hub.</p>
        <div class="cl-grid">
          <div class="cl-card">
            <div class="cl-card-title">⏱️ Shared timer</div>
            <div class="timer-display ${running ? 'is-running' : ''}">
              <div class="t-time" id="coachTimerTime">${fmtClock(coachTimerRemaining())}</div>
              <div class="t-state">${running ? '● Running' : 'Paused'}</div>
            </div>
            <div class="cl-row2">
              <div class="cl-field" style="margin:0"><label for="timerLabel">Label</label><input id="timerLabel" value="${esc(timer.label || 'Work time')}" placeholder="Work time" /></div>
              <div class="cl-field" style="margin:0"><label for="timerMinutes">Minutes</label><input id="timerMinutes" type="number" min="1" max="180" value="${esc(timer.durationMinutes || 20)}" /></div>
            </div>
            <div class="btn-group" style="margin-top:14px">
              <button class="btn btn-primary" onclick="saveClassroomBasics(true)">▶ Start</button>
              <button class="btn btn-ghost" onclick="pauseClassroomTimer()">⏸ Pause</button>
              <button class="btn btn-ghost" onclick="saveClassroomBasics(false)">↻ Reset</button>
            </div>
          </div>

          <div class="cl-card">
            <div class="cl-card-title">🔊 Noise level</div>
            <p class="section-sub" style="margin:-6px 0 12px">Tap the level for right now — campers see it instantly.</p>
            <div class="seg">
              ${NOISE_LEVELS.map(n => `
                <button class="seg-btn ${classroomState.noiseLevel === n.id ? 'active' : ''}" onclick="setNoise('${n.id}')">
                  <span class="seg-ico">${n.ico}</span>${n.label}
                </button>`).join('')}
            </div>
          </div>
        </div>

        <div class="cl-card" style="margin-top:16px">
          <div class="cl-card-title">👥 Create a group</div>
          <div class="cl-row2" style="grid-template-columns:1fr 1fr">
            <div class="cl-field"><label>Group name</label><input id="groupName" placeholder="e.g. Robot Builders" /></div>
            <div class="cl-field"><label>Focus</label><input id="groupFocus" placeholder="What should this group work on?" /></div>
          </div>
          <div class="cl-field"><label>Members (one per line)</label><textarea id="groupMembers" rows="2" placeholder="Maya&#10;Leo&#10;Aria"></textarea></div>
          <div class="cl-field"><label>Subgroups (optional — “Name: student, student”)</label><textarea id="groupSubgroups" rows="3" placeholder="Build Team: Maya, Leo&#10;Code Team: Aria, Sam"></textarea></div>
          <div><button class="btn btn-primary" onclick="createClassroomGroup()">＋ Create group</button></div>
        </div>

        <div style="margin-top:18px">
          <div class="cl-card-title" style="margin-bottom:12px">📋 Groups (${(classroomState.groups || []).length})</div>
          <div id="groupList">${renderCoachGroups()}</div>
        </div>
      `;
    }

    function renderCoachGroups() {
      const groups = classroomState.groups || [];
      if (!groups.length) return '<div class="empty-curriculum">No groups yet — create one above.</div>';
      return `<div class="group-grid">${groups.map(group => `
        <div class="group-tile">
          <h4>${esc(group.name)}</h4>
          ${group.focus ? `<p class="g-focus">🎯 ${esc(group.focus)}</p>` : ''}
          ${group.members?.length ? `<div class="g-chiprow">${group.members.map(m => `<span class="g-chip">${esc(m)}</span>`).join('')}</div>` : ''}
          ${(group.subgroups || []).map(sub => `<p class="g-sub"><strong>${esc(sub.name)}:</strong> ${esc((sub.members || []).join(', ') || 'No members')}</p>`).join('')}
          <button class="btn btn-danger g-del" onclick="deleteClassroomGroup('${esc(group.id)}')">Delete</button>
        </div>
      `).join('')}</div>`;
    }

    function setNoise(level) {
      classroomState.noiseLevel = level;
      document.querySelectorAll('#view-classroom .seg-btn').forEach(b => b.classList.toggle('active', b.getAttribute('onclick').includes(`'${level}'`)));
      api('/api/camp/coach/classroom', { method: 'PATCH', body: JSON.stringify({ noiseLevel: level, timer: classroomState.timer || {} }) })
        .then(r => { classroomState = r.classroom; })
        .catch(err => alert(err.message));
    }

    function tickCoachTimer() {
      const el = document.getElementById('coachTimerTime');
      if (!el) return;
      const t = classroomState.timer || {};
      if (!t.running) return;
      el.textContent = fmtClock(coachTimerRemaining());
    }

    function parseLines(value) {
      return String(value || '').split(/\r?\n/).map(line => line.trim()).filter(Boolean);
    }

    function parseSubgroups(value) {
      return parseLines(value).map(line => {
        const [name, membersText = ''] = line.split(':');
        return { name: (name || '').trim() || 'Subgroup', members: membersText.split(',').map(item => item.trim()).filter(Boolean) };
      });
    }

    async function saveClassroomBasics(startTimer) {
      const minutes = Math.max(1, Number(document.getElementById('timerMinutes').value || 20));
      const timer = {
        label: document.getElementById('timerLabel').value.trim() || 'Work time',
        durationMinutes: minutes,
        pausedRemainingSeconds: minutes * 60,
        running: Boolean(startTimer),
        startedAt: startTimer ? new Date().toISOString() : ''
      };
      const result = await api('/api/camp/coach/classroom', {
        method: 'PATCH',
        body: JSON.stringify({ noiseLevel: classroomState.noiseLevel, timer })
      });
      classroomState = result.classroom;
      document.getElementById('classroomToolsWrap').innerHTML = renderClassroomControls();
    }

    async function pauseClassroomTimer() {
      const current = classroomState.timer || {};
      const elapsed = current.running && current.startedAt ? Math.floor((Date.now() - new Date(current.startedAt).getTime()) / 1000) : 0;
      const remaining = Math.max(0, Number(current.pausedRemainingSeconds || 0) - elapsed);
      const result = await api('/api/camp/coach/classroom', {
        method: 'PATCH',
        body: JSON.stringify({ timer: { ...current, running: false, startedAt: '', pausedRemainingSeconds: remaining } })
      });
      classroomState = result.classroom;
      document.getElementById('classroomToolsWrap').innerHTML = renderClassroomControls();
    }

    async function createClassroomGroup() {
      const result = await api('/api/camp/coach/classroom/groups', {
        method: 'POST',
        body: JSON.stringify({
          name: document.getElementById('groupName').value,
          focus: document.getElementById('groupFocus').value,
          members: parseLines(document.getElementById('groupMembers').value),
          subgroups: parseSubgroups(document.getElementById('groupSubgroups').value)
        })
      });
      classroomState = result.classroom;
      document.getElementById('classroomToolsWrap').innerHTML = renderClassroomControls();
    }

    async function deleteClassroomGroup(id) {
      if (!confirm('Delete this group?')) return;
      const result = await api(`/api/camp/coach/classroom/groups/${encodeURIComponent(id)}`, { method: 'DELETE' });
      classroomState = result.classroom;
      document.getElementById('classroomToolsWrap').innerHTML = renderClassroomControls();
    }

    function renderProgressTab() {
      const classes = ['All', ...classSummaries().map(c => c.name)];
      const days = progressData.days || [];
      const defaultDay = days.find(d => d.date >= todayKey()) || days[0] || {};
      const summaries = classSummaries();
      const selected = summaries.some(item => item.name === selectedClassName) ? selectedClassName : summaries[0]?.name || 'Unassigned';
      selectedClassName = selected;
      return `
        <div class="section-title">Summer Classes</div>
        <p class="section-sub">Choose a class to open its classroom board. Each camper has a small figure for quick ClassDojo-style point awards.</p>
        ${renderClassTiles()}
        <div id="dojoClassBoard">${renderClassDojoBoard(selected)}</div>
        <div class="toolbar">
          <label for="progressClass">Class</label>
          <select id="progressClass" onchange="refreshProgressView()">
            ${classes.map(c => `<option value="${esc(c)}" ${c === selected ? 'selected' : ''}>${esc(c)}</option>`).join('')}
          </select>
          <label for="progressDay">Assignment</label>
          <select id="progressDay" onchange="refreshProgressView()">
            ${days.map(d => `<option value="${esc(d.id)}" ${d.id === defaultDay.id ? 'selected' : ''}>${esc(fmt(d.date, { month: 'short', day: 'numeric' }))} - ${esc((d.assignment || d.activity || 'Assignment').slice(0, 60))}</option>`).join('')}
          </select>
        </div>
        <div id="progressView"></div>
      `;
    }

    function campStudents() {
      return (progressData.students || []).filter(s => s.active !== false);
    }

    function summerClasses() {
      const seeded = (progressData.summerClasses || [])
        .filter(item => item?.name)
        .map(item => ({
          id: item.id || item.name,
          name: item.name || 'Unassigned',
          program: item.program || '',
          schedule: item.schedule || ''
        }));
      if (seeded.length) return seeded;
      return summerClassOrder
        .map(name => ({ id: name.toLowerCase().replace(/[^a-z0-9]+/g, '-'), name, program: name.includes('FTC') ? 'ftc' : 'lego-robotics', schedule: 'Summer camp weekly enrollment' }));
    }

    function classSummaries() {
      const groups = new Map();
      summerClasses().forEach(classItem => {
        groups.set(classItem.name, { ...classItem, students: [] });
      });
      campStudents().forEach(student => {
        const name = student.className || 'Unassigned';
        if (!groups.has(name)) groups.set(name, { id: name, name, program: '', schedule: '', students: [] });
        groups.get(name).students.push(student);
      });
      return Array.from(groups.values()).map(item => ({
        ...item,
        students: item.students.sort((a, b) => a.name.localeCompare(b.name)),
        totalPoints: item.students.reduce((sum, s) => sum + Number(s.points?.total || 0), 0)
      })).sort((a, b) => {
        return summerClassRank(a.name) - summerClassRank(b.name) || a.name.localeCompare(b.name);
      });
    }

    function avatarColor(id) {
      const colors = ['#1767b4', '#16a34a', '#f97316', '#7c3aed', '#db2777', '#0f766e', '#b45309', '#2563eb'];
      const text = String(id || '');
      const n = Array.from(text).reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
      return colors[n % colors.length];
    }

    // Same cute "monster" cartoon avatar campers see in their hub — keeps each
    // student's character consistent across the camper view and the coach board.
    function monsterAvatar(seed) {
      let h = 2166136261;
      const s = String(seed || 'camper');
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
      const pick = (n) => { h = (Math.imul(h, 48271)) >>> 0; return h % n; };
      const bodyColors = ['#ff6b6b','#4dabf7','#51cf66','#ffd43b','#cc5de8','#ff922b','#22b8cf','#f783ac','#9775fa','#20c997','#ffa94d','#63e6be','#ff8787','#74c0fc'];
      const body = bodyColors[pick(bodyColors.length)];
      const eyeCount = 1 + pick(3);
      const horn = pick(3);
      const mouth = pick(3);
      let top = '';
      if (horn === 0) top = `<path d="M22 14 L26 3 L30 14 Z" fill="${body}"/><path d="M34 14 L38 3 L42 14 Z" fill="${body}"/>`;
      else if (horn === 1) top = `<line x1="22" y1="14" x2="19" y2="5" stroke="${body}" stroke-width="2.5"/><circle cx="19" cy="4" r="3.5" fill="${body}"/><line x1="42" y1="14" x2="45" y2="5" stroke="${body}" stroke-width="2.5"/><circle cx="45" cy="4" r="3.5" fill="${body}"/>`;
      else top = `<path d="M18 16 Q32 0 46 16" fill="none" stroke="${body}" stroke-width="3.5" stroke-linecap="round"/>`;
      const eyePos = eyeCount === 1 ? [32] : eyeCount === 2 ? [25, 39] : [21, 32, 43];
      let eyes = '';
      eyePos.forEach((x) => { eyes += `<circle cx="${x}" cy="31" r="6" fill="#fff"/><circle cx="${x}" cy="32" r="3" fill="#22303f"/>`; });
      let mo = '';
      if (mouth === 0) mo = '<path d="M24 45 Q32 53 40 45" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>';
      else if (mouth === 1) mo = '<path d="M25 45 h14 a3 3 0 0 1 -14 0 z" fill="#22303f"/><rect x="29" y="45" width="2" height="4" fill="#fff"/><rect x="34" y="45" width="2" height="4" fill="#fff"/>';
      else mo = '<ellipse cx="32" cy="46" rx="4" ry="4.5" fill="#22303f"/>';
      return `<svg viewBox="0 0 64 66" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" aria-hidden="true">${top}<rect x="13" y="15" width="38" height="41" rx="17" fill="${body}"/>${eyes}${mo}<ellipse cx="32" cy="61" rx="15" ry="3" fill="rgba(0,0,0,0.08)"/></svg>`;
    }

    /* ── Sounds (Web Audio — no files needed) ── */
    let pointAudioCtx = null;
    function playPointSound(positive) {
      try {
        pointAudioCtx = pointAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (pointAudioCtx.state === 'suspended') pointAudioCtx.resume();
        const ctx = pointAudioCtx;
        const now = ctx.currentTime;
        const notes = positive ? [523.25, 659.25, 783.99] : [349.23, 261.63];
        const step = positive ? 0.085 : 0.14;
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = positive ? 'triangle' : 'sine';
          osc.frequency.value = freq;
          const t = now + i * step;
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(positive ? 0.28 : 0.22, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + (positive ? 0.22 : 0.3));
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t); osc.stop(t + 0.35);
        });
      } catch (err) { /* audio not available — silent */ }
    }

    /* ── Award modal (tap a camper → tap a skill) ── */
    let awardStudentId = null;

    function studentById(id) {
      return (progressData.students || []).find(s => s.id === id);
    }

    window.openAward = function openAward(studentId) {
      awardStudentId = studentId;
      // Prime audio on the user gesture so the first sound is allowed to play.
      try { pointAudioCtx = pointAudioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (pointAudioCtx.state === 'suspended') pointAudioCtx.resume(); } catch (e) {}
      renderAwardModal();
      document.getElementById('awardOverlay').classList.add('open');
    };
    window.closeAward = function closeAward() {
      document.getElementById('awardOverlay').classList.remove('open');
      awardStudentId = null;
    };

    function renderAwardModal() {
      const student = studentById(awardStudentId);
      if (!student) return;
      const skills = campSkills();
      const positive = skills.filter(s => s.type !== 'negative');
      const negative = skills.filter(s => s.type === 'negative');
      const skillBtn = (s) => `
        <button class="skill-btn ${s.type === 'negative' ? 'neg' : 'pos'}" type="button" onclick="awardSkill('${esc(s.id)}')">
          <span class="skill-ico">${esc(s.icon || '⭐')}</span>
          <span class="skill-name">${esc(s.name)}</span>
          <span class="skill-pts">${s.type === 'negative' ? '−' : '+'}${esc(s.points)}</span>
        </button>`;
      document.getElementById('awardModalBody').innerHTML = `
        <div class="award-head">
          <div class="award-avatar monster">${monsterAvatar(student.id)}</div>
          <div class="award-who">
            <h3>${esc(student.name)}</h3>
            <div class="award-total" id="awardTotal">${esc(student.points?.total || 0)} points</div>
          </div>
          <button class="award-close" type="button" onclick="closeAward()" aria-label="Close">✕</button>
        </div>
        ${positive.length ? `<div class="skill-section-label pos">➕ Great job!</div><div class="skill-grid">${positive.map(skillBtn).join('')}</div>` : ''}
        ${negative.length ? `<div class="skill-section-label neg">➖ Let's fix it</div><div class="skill-grid">${negative.map(skillBtn).join('')}</div>` : ''}
        <p class="section-sub" style="margin-top:14px;text-align:center">Keep tapping to give more — close when you're done.</p>
      `;
    }

    window.awardSkill = async function awardSkill(skillId) {
      const skill = campSkills().find(s => s.id === skillId);
      const student = studentById(awardStudentId);
      if (!skill || !student) return;
      const positive = skill.type !== 'negative';
      playPointSound(positive);
      // Optimistic UI: bump the totals immediately, flash the button.
      const delta = positive ? skill.points : -skill.points;
      flashAward(skill, positive);
      try {
        const res = await api('/api/camp/coach/points', {
          method: 'POST',
          body: JSON.stringify({ studentId: student.id, category: skill.name, icon: skill.icon, points: skill.points, type: positive ? 'positive' : 'needs-work' })
        });
        // update local cache so the modal + board reflect the new total
        if (res.points && typeof res.points.total === 'number') {
          student.points = res.points;
        } else if (student.points) {
          student.points.total = (Number(student.points.total) || 0) + delta;
        }
        const at = document.getElementById('awardTotal');
        if (at) at.textContent = `${student.points?.total || 0} points`;
        const bp = document.getElementById('board-pts-' + student.id);
        if (bp) bp.textContent = student.points?.total || 0;
        // refresh feed/tiles quietly
        const refreshed = await api('/api/camp/coach/progress');
        progressData = refreshed || progressData;
        const feed = document.querySelector('#dojoClassBoard .dojo-feed');
        if (feed) { document.getElementById('dojoClassBoard').innerHTML = renderClassDojoBoard(selectedClassName); }
        const sideTools = document.getElementById('sidebarTools');
        if (sideTools) sideTools.innerHTML = renderSidebarTools();
      } catch (err) {
        alert(err.message);
      }
    };

    window.resetClassPoints = async function resetClassPoints(className) {
      const target = className || selectedClassName || 'this class';
      if (!confirm(`Reset ClassDojo points for ${target}? This clears positive/needs-work point events, but keeps assignment submissions and project/print bonus points.`)) return;
      try {
        await api('/api/camp/coach/points/reset', {
          method: 'POST',
          body: JSON.stringify({ className: target })
        });
        const refreshed = await api('/api/camp/coach/progress');
        progressData = refreshed || progressData;
        const wrap = document.getElementById('progressToolsWrap');
        if (wrap) wrap.innerHTML = renderProgressTab();
        const sideTools = document.getElementById('sidebarTools');
        if (sideTools) sideTools.innerHTML = renderSidebarTools();
      } catch (err) {
        alert(err.message);
      }
    };

    function flashAward(skill, positive) {
      const fx = document.getElementById('awardFx');
      if (!fx) return;
      fx.textContent = `${skill.icon || (positive ? '⭐' : '⚠️')} ${positive ? '+' : '−'}${skill.points}`;
      fx.className = 'award-fx ' + (positive ? 'pos' : 'neg');
      fx.style.animation = 'none';
      void fx.offsetWidth;
      fx.style.animation = 'awardPop 0.7s ease';
    }

    /* ── Manage skills ── */
    window.openManageSkills = function openManageSkills() {

      document.getElementById('skillsOverlay').classList.add('open');

    window.closeManageSkills = function closeManageSkills() {

    function renderManageSkills() {

      document.getElementById('skillsModalBody').innerHTML = `

    window.addSkill = async function addSkill() {
      const name = document.getElementById('newSkillName').value.trim();
      if (!name) { alert('Give the skill a name.'); return; }
      const payload = {
        name,
        icon: document.getElementById('newSkillIcon').value.trim() || (document.getElementById('newSkillType').value === 'negative' ? '⚠️' : '⭐'),
        points: Number(document.getElementById('newSkillPoints').value) || 1,
        type: document.getElementById('newSkillType').value
      };
      try {
        const res = await api('/api/camp/coach/skills', { method: 'POST', body: JSON.stringify(payload) });
        classroomState = res.classroom || classroomState;
        renderManageSkills();
      } catch (err) { alert(err.message); }
