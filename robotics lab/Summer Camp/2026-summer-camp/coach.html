<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coach Dashboard | Summer Camp Hub</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b2a4a" />
  <link rel="icon" href="/ai%20future%20logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* AI Future brand palette (see index.html) */
      --sun: #fece00;
      --sun-deep: #0b2a4a;
      --sun-light: #fff7d6;
      --sun-mid: #f5d96e;
      --sky: #1767b4;
      --sky-light: #e3effd;
      --grass: #16a34a;
      --grass-light: #e7f7ec;
      --red: #dc2626;
      --red-light: #fdecec;
      --ink: #10233f;
      --muted: #5f6c80;
      --line: #dce5ef;
      --bg: #f7f8fa;
      --white: #ffffff;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 20px rgba(11, 42, 74, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,0.94);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand { display: flex; align-items: center; gap: 11px; }

    .brand img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 4px;
      background: white;
    }

    .brand-text strong { display: block; font-size: 15px; font-weight: 800; }
    .brand-text span { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }

    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .chip {
      padding: 6px 12px;
      border-radius: 50px;
      border: 1.5px solid var(--line);
      font-size: 13px;
      font-weight: 700;
      background: white;
      color: var(--muted);
    }

    .chip.sun { background: var(--sun-light); border-color: var(--sun-mid); color: var(--sun-deep); }

    .btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 0;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      background: var(--ink);
      color: white;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.82; }

    .btn-primary { background: var(--sun-deep); }
    .btn-ghost {
      background: white;
      color: var(--sun-deep);
      border: 1.5px solid var(--sun-mid);
    }
    .btn-danger { background: var(--red-light); color: var(--red); }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .page-title { font-size: 26px; font-weight: 900; }
    .page-sub { font-size: 14px; color: var(--muted); margin-top: 4px; }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 18px;
      border-radius: 50px;
      border: 1.5px solid var(--line);
      background: white;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      color: var(--muted);
    }

    .tab-btn.active {
      background: var(--sun-deep);
      border-color: var(--sun-deep);
      color: white;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .section-title { font-size: 19px; font-weight: 900; margin-bottom: 6px; }
    .section-sub { font-size: 13.5px; color: var(--muted); margin-bottom: 16px; }

    .card {
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 18px;
    }

    /* Schedule editor */
    .week-block { margin-bottom: 14px; }

    .week-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
    }

    .week-head:hover { border-color: var(--sun-mid); }
    .week-head strong { font-size: 15px; }
    .week-head span { font-size: 12.5px; color: var(--muted); }

    .week-days { display: none; padding-top: 10px; }
    .week-block.open .week-days { display: grid; gap: 10px; }

    .day-edit {
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
    }

    .day-edit.is-today { border-color: var(--sun); background: var(--sun-light); }

    .day-edit-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .day-edit-date { font-weight: 900; font-size: 14px; }

    .day-edit label {
      display: block;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 10px 0 5px;
    }

    .day-edit textarea, .day-edit input {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 13.5px;
      background: white;
      color: var(--ink);
      outline: none;
      resize: vertical;
    }

    .day-edit textarea:focus, .day-edit input:focus { border-color: var(--sun); }

    .day-save-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .save-status {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--grass);
    }

    /* Announcements */
    .form-grid { display: grid; gap: 12px; }

    .form-grid label {
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      display: block;
      margin-bottom: 5px;
    }

    .form-grid input, .form-grid textarea, .form-grid select {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      font-size: 14px;
      outline: none;
      background: white;
      color: var(--ink);
    }

    .form-grid input:focus, .form-grid textarea:focus, .form-grid select:focus { border-color: var(--sun); }

    .announce-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 10px;
    }

    .announce-item.coach-only { border-left: 4px solid var(--sun); }

    .announce-item h4 { font-size: 15px; font-weight: 900; margin-bottom: 4px; }
    .announce-item p { font-size: 13.5px; color: var(--muted); line-height: 1.55; }

    .announce-meta {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    /* Campers */
    .table-wrap { overflow-x: auto; }

    table { border-collapse: collapse; width: 100%; min-width: 560px; }

    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px;
    }

    th {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: var(--sun-light);
    }

    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 50px;
      font-size: 11.5px;
      font-weight: 800;
    }
    .pill.on { background: var(--grass-light); color: var(--grass); }
    .pill.off { background: var(--red-light); color: var(--red); }

    .creds-box {
      background: var(--grass-light);
      border: 1.5px solid #bce5c8;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.7;
    }

    .creds-box code {
      background: white;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 8px;
      font-weight: 800;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .toolbar label {
      font-size: 12px;
      font-weight: 900;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .toolbar select {
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      background: white;
      color: var(--ink);
      font-weight: 700;
    }

    .progress-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .submission-card {
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .submission-card.missing { opacity: 0.72; background: #fbfcfd; }
    .submission-card h4 { font-size: 15px; margin-bottom: 6px; }
    .submission-card p { font-size: 13px; line-height: 1.5; color: var(--muted); margin-top: 8px; }
    .submission-card img { width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--line); margin-top: 10px; }

    .class-heading {
      font-size: 14px;
      font-weight: 900;
      color: var(--sun-deep);
      margin: 18px 0 8px;
    }

    .print-queue {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .print-queue-card {
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      background: white;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .print-queue-card h4 { margin: 0 0 6px; font-size: 15px; }
    .print-queue-card p { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 8px 0; }
    .print-queue-card img { width: 100%; max-height: 260px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--line); margin-top: 10px; }
    .print-controls { display: grid; grid-template-columns: 160px 110px 1fr auto; gap: 8px; align-items: end; margin-top: 12px; }
    .print-controls label { display: block; font-size: 11px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }

    .dojo-panel {
      display: grid;
      grid-template-columns: 1fr 1fr 110px 1.5fr auto;
      gap: 10px;
      align-items: end;
      margin-top: 14px;
    }

    .dojo-panel label {
      display: block;
      font-size: 11px;
      font-weight: 900;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 4px;
    }

    .dojo-feed {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .class-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
      margin: 14px 0 18px;
    }

    .class-tile {
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      background: white;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
      color: var(--ink);
    }

    .class-tile:hover,
    .class-tile.active {
      border-color: var(--sun);
      background: var(--sun-light);
    }

    .class-tile strong {
      display: block;
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .class-tile span {
      display: inline-block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-right: 8px;
    }

    .dojo-board-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .dojo-class-board {
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      background: white;
      padding: 16px;
      margin-bottom: 16px;
    }

    .dojo-board-tools {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .dojo-board-tools select,
    .dojo-board-tools input {
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      background: white;
      color: var(--ink);
      font-weight: 700;
      min-width: 150px;
    }

    .student-figure-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .student-figure-card {
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfd;
      padding: 14px;
      text-align: center;
    }

    .student-avatar {
      width: 66px;
      height: 66px;
      border-radius: 22px 22px 28px 28px;
      margin: 0 auto 10px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 900;
      font-size: 18px;
      box-shadow: inset 0 -10px 0 rgba(7,20,38,0.12), var(--shadow);
    }

    .student-figure-card h4 {
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .student-points {
      font-size: 22px;
      font-weight: 900;
      color: var(--sun-deep);
      margin-bottom: 10px;
    }

    .point-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .point-actions .btn {
      padding: 7px 8px;
      font-size: 12px;
    }

    .classroom-controls {
      display: grid;
      gap: 16px;
    }

    .control-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      align-items: end;
    }

    .group-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px;
      background: #fbfcfd;
      margin-top: 10px;
    }

    .group-card h4 { margin: 0 0 5px; }
    .group-card p { margin: 5px 0; color: var(--muted); font-size: 13px; line-height: 1.45; }

    .error-box {
      background: var(--red-light);
      border: 1.5px solid #f3c4c4;
      border-radius: var(--radius-sm);
      color: var(--red);
      padding: 12px 14px;
      font-size: 13.5px;
      margin-top: 12px;
      display: none;
    }

    .loading-state {
      min-height: 60vh;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .loading-spinner {
      font-size: 48px;
      animation: spin 1.5s linear infinite;
      display: block;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-size: 16px; font-weight: 700; color: var(--muted); }

    @media (max-width: 580px) {
      .page { padding-inline: 14px; }
      .dojo-panel { grid-template-columns: 1fr; }
      .student-figure-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* ── Collapsible sidebar dashboard layout ── */
    .dash { display: flex; gap: 20px; align-items: flex-start; }
    .sidebar {
      flex: 0 0 220px;
      position: sticky;
      top: 84px;
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 10px;
      transition: flex-basis 0.2s ease, transform 0.2s ease;
    }
    .sidebar nav { display: grid; gap: 4px; }
    .sidebar-tools {
      border-bottom: 1px solid var(--line);
      padding: 4px 4px 10px;
      margin-bottom: 8px;
      display: grid;
      gap: 8px;
    }
    .sidebar-tools label {
      display: block;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .sidebar-tools select {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      background: white;
      color: var(--ink);
      font-weight: 800;
      font-size: 13px;
    }
    .sidebar-tools select:focus { outline: 3px solid rgba(254,206,0,0.22); border-color: var(--sun); }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; text-align: left;
      padding: 11px 13px; border: 0; border-radius: var(--radius-sm);
      background: transparent; color: var(--ink);
      font-weight: 800; font-size: 14px; cursor: pointer;
      white-space: nowrap; overflow: hidden;
    }
    .nav-item:hover { background: var(--sun-light); }
    .nav-item.active { background: var(--sun-deep); color: white; }
    .nav-item .nav-ico { font-size: 17px; flex-shrink: 0; }
    .nav-item .nav-badge {
      margin-left: auto; background: var(--red); color: white;
      border-radius: 50px; font-size: 11px; font-weight: 900; padding: 1px 7px;
    }
    .nav-item.active .nav-badge { background: white; color: var(--sun-deep); }
    .dash-main { flex: 1 1 auto; min-width: 0; }
    .view { display: none; }
    .view.active { display: block; }

    .sidebar-toggle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--line); background: white; cursor: pointer;
      font-size: 18px; flex-shrink: 0;
    }
    .sidebar-toggle:hover { border-color: var(--sun); }

    /* Collapsed: sidebar slides away, main takes full width */
    .dash.collapsed .sidebar { display: none; }

    /* ── Live Lesson ── */
    .lesson-card {
      background: white; border: 1.5px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    }
    .lesson-card.is-live { border-color: var(--sun); box-shadow: 0 0 0 2px var(--sun-mid); }
    .lesson-card h4 { font-size: 16px; font-weight: 900; margin-bottom: 3px; }
    .lesson-card .meta { font-size: 12.5px; color: var(--muted); }
    .lesson-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 5px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    .slide-editor {
      background: var(--bg); border: 1.5px solid var(--line); border-left: 4px solid var(--sun);
      border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px;
    }
    .slide-editor-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .slide-editor-head .idx { font-weight: 900; font-size: 13px; color: var(--sun-deep); }
    .slide-editor label { display: block; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 8px 0 4px; }
    .slide-editor input, .slide-editor textarea, .slide-editor select {
      width: 100%; border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 11px;
      font-size: 14px; background: white; color: var(--ink); outline: none; resize: vertical;
    }
    .slide-editor input:focus, .slide-editor textarea:focus, .slide-editor select:focus { border-color: var(--sun); }
    .opt-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .opt-row input[type="radio"] { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--grass); }
    .opt-row input[type="text"] { flex: 1; }
    .opt-row .opt-x { border: 0; background: var(--red-light); color: var(--red); border-radius: 7px; width: 30px; height: 32px; cursor: pointer; font-weight: 900; flex-shrink: 0; }
    .mini-btn { border: 1.5px solid var(--line); background: white; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 800; cursor: pointer; }
    .mini-btn:hover { border-color: var(--sun); }

    /* Presenter */
    .presenter { background: white; border: 1.5px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .presenter-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      background: var(--sun-deep); color: white; padding: 14px 18px;
    }
    .presenter-bar .title { font-weight: 900; font-size: 15px; }
    .presenter-bar .counter { font-weight: 800; font-size: 13px; opacity: 0.9; }
    .presenter-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .presenter-controls .btn { min-width: 92px; justify-content: center; }
    .slide-show { padding: 26px; min-height: 240px; }
    .slide-show.q { background: linear-gradient(180deg, var(--sun-light), white); }
    .slide-kicker { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sun-deep); margin-bottom: 8px; }
    .slide-show h2 { font-size: clamp(22px, 3vw, 30px); font-weight: 900; margin-bottom: 12px; line-height: 1.15; }
    .slide-show .body { font-size: clamp(16px, 2vw, 19px); line-height: 1.6; white-space: pre-wrap; }
    .slide-show img { max-width: 100%; max-height: 280px; border-radius: var(--radius-sm); margin-top: 14px; border: 1px solid var(--line); }
    .tally { display: grid; gap: 10px; margin-top: 18px; }
    .tally-row { }
    .tally-row .tally-label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; margin-bottom: 4px; }
    .tally-row.correct .tally-label { color: var(--grass); }
    .tally-bar { height: 26px; background: var(--bg); border-radius: 50px; overflow: hidden; border: 1px solid var(--line); }
    .tally-fill { height: 100%; background: var(--sun); border-radius: 50px; transition: width 0.4s ease; min-width: 2px; }
    .tally-row.correct .tally-fill { background: var(--grass); }
    .slide-thumbs { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--bg); }
    .thumb { width: 30px; height: 30px; border-radius: 7px; border: 1.5px solid var(--line); background: white; font-size: 12px; font-weight: 900; cursor: pointer; color: var(--muted); }
    .thumb.current { background: var(--sun-deep); color: white; border-color: var(--sun-deep); }
    .thumb.q { border-color: var(--sun); }

    /* Touch devices (iPad/phone): 16px inputs stop iOS focus-zoom; bigger tap targets */
    @media (pointer: coarse) {
      body { -webkit-tap-highlight-color: transparent; }
      .day-edit textarea, .day-edit input,
      .form-grid input, .form-grid textarea, .form-grid select,
      .slide-editor input, .slide-editor textarea, .slide-editor select { font-size: 16px; }
      .btn { min-height: 44px; }
      .tab-btn, .nav-item { min-height: 46px; }
      .week-head { padding: 18px; }
      th, td { padding: 14px 16px; }
    }

    @media (max-width: 820px) {
      .dash { flex-direction: column; }
      .sidebar { flex-basis: auto; width: 100%; position: static; }
      .sidebar nav { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Show or hide menu" title="Show/hide menu">☰</button>
        <img src="/ai%20future%20logo.png" alt="AI Future" />
        <div class="brand-text">
          <strong>Coach Dashboard</strong>
          <span id="userLine">Loading…</span>
        </div>
      </div>
      <div class="topbar-right">
        <a class="chip" href="/camp-hub">Camper view</a>
        <span class="chip sun">Coach</span>
        <button class="btn" id="logoutButton">Sign out</button>
      </div>
    </div>
  </header>

  <main class="page" id="app">
    <div class="loading-state">
      <span class="loading-spinner">☀️</span>
      <p class="loading-text">Loading the coach dashboard…</p>
    </div>
  </main>

  <script>
    const app = document.getElementById('app');
    const userLine = document.getElementById('userLine');
    const logoutButton = document.getElementById('logoutButton');

    let hubData = null;
    let roster = [];
    let progressData = { students: [], days: [], submissions: [] };
    let printQueue = [];
    let projectQueue = [];
    let rosterView = 'class';
    let selectedClassName = '';
    let classroomState = { noiseLevel: 'partner', timer: { label: 'Work time', durationMinutes: 20, pausedRemainingSeconds: 1200, running: false }, groups: [] };
    let lessons = [];
    let liveState = null;
    let livePollTimer = null;
    let lessonDraft = null;

    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function todayKey() {
      const now = new Date();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${now.getFullYear()}-${m}-${d}`;
    }

    function fmt(value, opts) {
      if (!value) return '';
      const date = new Date(`${value}T12:00:00`);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString(undefined, opts);
    }

    function formatProgramLabel(program) {
      const labels = { 'lego-robotics': 'LEGO Robotics', ftc: 'FTC Robotics', fll: 'FLL', 'code-lab': 'Code Lab' };
      return labels[program] || 'Robotics';
    }

    function classList() {
      return Array.from(new Set([
        ...summerClasses().map(item => item.name),
        ...roster.filter(u => u.role === 'student').map(u => u.className || 'Unassigned')
      ])).sort((a, b) => {
        const order = ['Summer LEGO Robotics 1', 'Summer LEGO Robotics 2', 'Summer FTC Robotics'];
        return (order.indexOf(a) === -1 ? 99 : order.indexOf(a)) - (order.indexOf(b) === -1 ? 99 : order.indexOf(b)) || a.localeCompare(b);
      });
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const result = await response.json().catch(() => ({}));
      if (response.status === 401) {
        window.location.href = '/camp-hub/login';
        throw new Error('Login required');
      }
      if (!response.ok || result.success === false) {
        throw new Error(result.message || 'Request failed');
      }
      return result;
    }

    /* ── Schedule tab ── */
    function renderScheduleTab(curriculum) {
      const today = todayKey();
      return `
        <div class="section-title">Schedule Editor</div>
        <p class="section-sub">Edit any day's activity, build, or private coach notes — campers see activity and build instantly. Weeks 7–8 have open days ready to fill in.</p>
        ${curriculum.map(week => {
          const dates = (week.days || []).map(d => d.date).filter(Boolean).sort();
          const isCurrent = dates.length && today >= dates[0] && today <= dates[dates.length - 1];
          return `
            <div class="week-block ${isCurrent ? 'open' : ''}" id="wk-${esc(week.id)}">
              <div class="week-head" onclick="document.getElementById('wk-${esc(week.id)}').classList.toggle('open')">
                <div>
                  <strong>${esc(week.label)}${week.theme ? ` · ${esc(week.theme)}` : ''}</strong><br/>
                  <span>${esc(fmt(dates[0], { month: 'short', day: 'numeric' }))} – ${esc(fmt(dates[dates.length - 1], { month: 'short', day: 'numeric' }))}${week.goal ? ` · ${esc(week.goal)}` : ''}</span>
                </div>
                <span style="font-weight:900;color:var(--sun-deep)">${isCurrent ? 'This week' : 'Edit'} ▾</span>
              </div>
              <div class="week-days">
                ${(week.days || []).map(day => `
                  <div class="day-edit ${day.date === today ? 'is-today' : ''}" id="day-${esc(day.id)}">
                    <div class="day-edit-head">
                      <span class="day-edit-date">${esc(fmt(day.date, { weekday: 'long', month: 'long', day: 'numeric' }))}${day.date === today ? ' · TODAY' : ''}</span>
                    </div>
                    <label>Activity (campers see this)</label>
                    <textarea rows="2" data-field="activity">${esc(day.activity)}</textarea>
                    <label>Assignment / reflection prompt (campers submit this)</label>
                    <textarea rows="2" data-field="assignment">${esc(day.assignment || '')}</textarea>
                    <label>Build (campers see this)</label>
                    <input data-field="build" value="${esc(day.build)}" />
                    <label>Worksheet or PDF label</label>
                    <input data-field="worksheetLabel" value="${esc(day.worksheetLabel || '')}" placeholder="e.g. Gear Ratio Worksheet" />
                    <label>Worksheet or PDF URL</label>
                    <input data-field="worksheetUrl" value="${esc(day.worksheetUrl || '')}" placeholder="https://... or /path/to/file.pdf" />
                    <label>Coach notes (private — coaches only)</label>
                    <textarea rows="2" data-field="coachNotes">${esc(day.coachNotes)}</textarea>
                    <div class="day-save-row">
                      <button class="btn btn-primary" onclick="saveDay('${esc(day.id)}')">Save day</button>
                      <span class="save-status" id="status-${esc(day.id)}"></span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).join('')}
      `;
    }

    async function saveDay(dayId) {
      const box = document.getElementById('day-' + dayId);
      const status = document.getElementById('status-' + dayId);
      if (!box) return;
      const payload = {};
      box.querySelectorAll('[data-field]').forEach(el => { payload[el.dataset.field] = el.value; });
      status.textContent = 'Saving…';
      status.style.color = 'var(--muted)';
      try {
        await api(`/api/camp/coach/days/${encodeURIComponent(dayId)}`, {
          method: 'PATCH',
          body: JSON.stringify(payload)
        });
        status.textContent = 'Saved ✓';
        status.style.color = 'var(--grass)';
        setTimeout(() => { status.textContent = ''; }, 2500);
      } catch (err) {
        status.textContent = err.message;
        status.style.color = 'var(--red)';
      }
    }

    /* ── Announcements tab ── */
    function renderAnnouncementsTab(announcements) {
      return `
        <div class="section-title">Announcements</div>
        <p class="section-sub">Post updates for campers, or coach-only notes for the team. Newest first.</p>
        <div class="card">
          <div class="form-grid">
            <div>
              <label for="annTitle">Title</label>
              <input id="annTitle" placeholder="e.g. Bring a water bottle tomorrow!" />
            </div>
            <div>
              <label for="annBody">Message</label>
              <textarea id="annBody" rows="3" placeholder="What do campers (or coaches) need to know?"></textarea>
            </div>
            <div>
              <label for="annAudience">Audience</label>
              <select id="annAudience">
                <option value="all">Everyone</option>
                <option value="coach">Coaches only</option>
              </select>
            </div>
            <div>
              <button class="btn btn-primary" onclick="postAnnouncement()">Post announcement</button>
            </div>
            <div class="error-box" id="annError"></div>
          </div>
        </div>
        <div id="announceList">
          ${renderAnnounceItems(announcements)}
        </div>
      `;
    }

    function renderAnnounceItems(announcements) {
      const sorted = [...announcements].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
      if (!sorted.length) return '<p style="color:var(--muted);font-size:14px">No announcements yet.</p>';
      return sorted.map(a => `
        <div class="announce-item ${a.audience === 'coach' ? 'coach-only' : ''}">
          <div>
            <div class="announce-meta">${esc(a.date || '')} · ${a.audience === 'coach' ? 'Coaches only' : 'Everyone'}</div>
            <h4>${esc(a.title)}</h4>
            <p>${esc(a.body)}</p>
          </div>
          <button class="btn btn-danger" onclick="deleteAnnouncement('${esc(a.id)}')">Delete</button>
        </div>
      `).join('');
    }

    async function postAnnouncement() {
      const title = document.getElementById('annTitle').value.trim();
      const body = document.getElementById('annBody').value.trim();
      const audience = document.getElementById('annAudience').value;
      const errorBox = document.getElementById('annError');
      errorBox.style.display = 'none';
      if (!title || !body) {
        errorBox.textContent = 'Title and message are both required.';
        errorBox.style.display = 'block';
        return;
      }
      try {
        const result = await api('/api/camp/coach/announcements', {
          method: 'POST',
          body: JSON.stringify({ title, body, audience })
        });
        hubData.announcements = result.announcements;
        document.getElementById('announceList').innerHTML = renderAnnounceItems(hubData.announcements);
        document.getElementById('annTitle').value = '';
        document.getElementById('annBody').value = '';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    }

    async function deleteAnnouncement(id) {
      if (!confirm('Delete this announcement?')) return;
      try {
        const result = await api(`/api/camp/coach/announcements/${encodeURIComponent(id)}`, { method: 'DELETE' });
        hubData.announcements = result.announcements;
        document.getElementById('announceList').innerHTML = renderAnnounceItems(hubData.announcements);
      } catch (err) {
        alert(err.message);
      }
    }

    /* ── Campers tab ── */
    function renderClassroomControls() {
      const timer = classroomState.timer || {};
      return `
        <div class="section-title">Classroom Tools</div>
        <p class="section-sub">Set the shared timer, noise level, and group/subgroup structure students see in the summer hub.</p>
        <div class="classroom-controls">
          <div class="control-row">
            <div><label for="timerLabel">Timer label</label><input id="timerLabel" value="${esc(timer.label || 'Work time')}" /></div>
            <div><label for="timerMinutes">Minutes</label><input id="timerMinutes" type="number" min="1" max="180" value="${esc(timer.durationMinutes || 20)}" /></div>
            <div><label for="noiseLevel">Noise level</label><select id="noiseLevel">${['silent','whisper','partner','team','present'].map(level => `<option value="${level}" ${level === classroomState.noiseLevel ? 'selected' : ''}>${level}</option>`).join('')}</select></div>
            <button class="btn btn-primary" onclick="saveClassroomBasics(false)">Save</button>
            <button class="btn btn-primary" onclick="saveClassroomBasics(true)">Start timer</button>
            <button class="btn btn-ghost" onclick="pauseClassroomTimer()">Pause</button>
          </div>
          <div class="card" style="box-shadow:none">
            <div class="section-title" style="font-size:16px">Create group</div>
            <div class="form-grid">
              <div><label>Group name</label><input id="groupName" placeholder="e.g. Robot Builders, Research Team" /></div>
              <div><label>Focus</label><input id="groupFocus" placeholder="What should this group work on?" /></div>
              <div><label>Members</label><textarea id="groupMembers" rows="2" placeholder="One student per line"></textarea></div>
              <div><label>Subgroups</label><textarea id="groupSubgroups" rows="4" placeholder="Format: Subgroup Name: student, student&#10;Build Team: Maya, Leo&#10;Code Team: Aria, Sam"></textarea></div>
              <button class="btn btn-primary" onclick="createClassroomGroup()">Create group</button>
            </div>
          </div>
          <div id="groupList">${renderCoachGroups()}</div>
        </div>
      `;
    }

    function renderCoachGroups() {
      const groups = classroomState.groups || [];
      if (!groups.length) return '<p class="section-sub">No groups yet.</p>';
      return groups.map(group => `
        <div class="group-card">
          <h4>${esc(group.name)}</h4>
          ${group.focus ? `<p><strong>Focus:</strong> ${esc(group.focus)}</p>` : ''}
          ${group.members?.length ? `<p><strong>Members:</strong> ${esc(group.members.join(', '))}</p>` : ''}
          ${(group.subgroups || []).map(sub => `<p><strong>${esc(sub.name)}:</strong> ${esc((sub.members || []).join(', ') || 'No members listed')}</p>`).join('')}
          <button class="btn btn-danger" onclick="deleteClassroomGroup('${esc(group.id)}')">Delete group</button>
        </div>
      `).join('');
    }

    function parseLines(value) {
      return String(value || '').split(/\r?\n/).map(line => line.trim()).filter(Boolean);
    }

    function parseSubgroups(value) {
      return parseLines(value).map(line => {
        const [name, membersText = ''] = line.split(':');
        return { name: (name || '').trim() || 'Subgroup', members: membersText.split(',').map(item => item.trim()).filter(Boolean) };
      });
    }

    async function saveClassroomBasics(startTimer) {
      const minutes = Math.max(1, Number(document.getElementById('timerMinutes').value || 20));
      const timer = {
        label: document.getElementById('timerLabel').value.trim() || 'Work time',
        durationMinutes: minutes,
        pausedRemainingSeconds: minutes * 60,
        running: Boolean(startTimer),
        startedAt: startTimer ? new Date().toISOString() : ''
      };
      const result = await api('/api/camp/coach/classroom', {
        method: 'PATCH',
        body: JSON.stringify({ noiseLevel: document.getElementById('noiseLevel').value, timer })
      });
      classroomState = result.classroom;
      document.getElementById('classroomToolsWrap').innerHTML = renderClassroomControls();
    }

    async function pauseClassroomTimer() {
      const current = classroomState.timer || {};
      const elapsed = current.running && current.startedAt ? Math.floor((Date.now() - new Date(current.startedAt).getTime()) / 1000) : 0;
      const remaining = Math.max(0, Number(current.pausedRemainingSeconds || 0) - elapsed);
      const result = await api('/api/camp/coach/classroom', {
        method: 'PATCH',
        body: JSON.stringify({ timer: { ...current, running: false, startedAt: '', pausedRemainingSeconds: remaining } })
      });
      classroomState = result.classroom;
      document.getElementById('classroomToolsWrap').innerHTML = renderClassroomControls();
    }

    async function createClassroomGroup() {
      const result = await api('/api/camp/coach/classroom/groups', {
        method: 'POST',
        body: JSON.stringify({
          name: document.getElementById('groupName').value,
          focus: document.getElementById('groupFocus').value,
          members: parseLines(document.getElementById('groupMembers').value),
          subgroups: parseSubgroups(document.getElementById('groupSubgroups').value)
        })
      });
      classroomState = result.classroom;
      document.getElementById('classroomToolsWrap').innerHTML = renderClassroomControls();
    }

    async function deleteClassroomGroup(id) {
      if (!confirm('Delete this group?')) return;
      const result = await api(`/api/camp/coach/classroom/groups/${encodeURIComponent(id)}`, { method: 'DELETE' });
      classroomState = result.classroom;
      document.getElementById('classroomToolsWrap').innerHTML = renderClassroomControls();
    }

    function renderProgressTab() {
      const classes = ['All', ...classSummaries().map(c => c.name)];
      const days = progressData.days || [];
      const defaultDay = days.find(d => d.date >= todayKey()) || days[0] || {};
      const summaries = classSummaries();
      const selected = summaries.some(item => item.name === selectedClassName) ? selectedClassName : summaries[0]?.name || 'Unassigned';
      selectedClassName = selected;
      return `
        <div class="section-title">Summer Classes</div>
        <p class="section-sub">Choose a class to open its classroom board. Each camper has a small figure for quick ClassDojo-style point awards.</p>
        ${renderClassTiles()}
        <div id="dojoClassBoard">${renderClassDojoBoard(selected)}</div>
        <div class="toolbar">
          <label for="progressClass">Class</label>
          <select id="progressClass" onchange="refreshProgressView()">
            ${classes.map(c => `<option value="${esc(c)}" ${c === selected ? 'selected' : ''}>${esc(c)}</option>`).join('')}
          </select>
          <label for="progressDay">Assignment</label>
          <select id="progressDay" onchange="refreshProgressView()">
            ${days.map(d => `<option value="${esc(d.id)}" ${d.id === defaultDay.id ? 'selected' : ''}>${esc(fmt(d.date, { month: 'short', day: 'numeric' }))} - ${esc((d.assignment || d.activity || 'Assignment').slice(0, 60))}</option>`).join('')}
          </select>
        </div>
        <div id="progressView"></div>
      `;
    }

    function campStudents() {
      return (progressData.students || []).filter(s => s.active !== false);
    }

    function summerClasses() {
      const seeded = (progressData.summerClasses || [])
        .filter(item => item?.name)
        .map(item => ({
          id: item.id || item.name,
          name: item.name || 'Unassigned',
          program: item.program || '',
          schedule: item.schedule || ''
        }));
      if (seeded.length) return seeded;
      return ['Summer LEGO Robotics 1', 'Summer LEGO Robotics 2', 'Summer FTC Robotics']
        .map(name => ({ id: name.toLowerCase().replace(/[^a-z0-9]+/g, '-'), name, program: name.includes('FTC') ? 'ftc' : 'lego-robotics', schedule: 'Summer camp weekly enrollment' }));
    }

    function classSummaries() {
      const groups = new Map();
      summerClasses().forEach(classItem => {
        groups.set(classItem.name, { ...classItem, students: [] });
      });
      campStudents().forEach(student => {
        const name = student.className || 'Unassigned';
        if (!groups.has(name)) groups.set(name, { id: name, name, program: '', schedule: '', students: [] });
        groups.get(name).students.push(student);
      });
      return Array.from(groups.values()).map(item => ({
        ...item,
        students: item.students.sort((a, b) => a.name.localeCompare(b.name)),
        totalPoints: item.students.reduce((sum, s) => sum + Number(s.points?.total || 0), 0)
      })).sort((a, b) => {
        const order = ['Summer LEGO Robotics 1', 'Summer LEGO Robotics 2', 'Summer FTC Robotics'];
        return (order.indexOf(a.name) === -1 ? 99 : order.indexOf(a.name)) - (order.indexOf(b.name) === -1 ? 99 : order.indexOf(b.name)) || a.name.localeCompare(b.name);
      });
    }

    function renderClassTiles() {
      const classes = classSummaries();
      if (!classes.length) return '<p class="section-sub">No active campers yet. Add campers from the Campers tab to build a class board.</p>';
      const selected = selectedClassName || classes[0].name;
      return `
        <div class="class-strip">
          ${classes.map(item => `
            <button class="class-tile ${item.name === selected ? 'active' : ''}" type="button" onclick="selectCampClass(decodeURIComponent('${encodeURIComponent(item.name)}'))">
              <strong>${esc(item.name)}</strong>
              <span>${item.students.length} camper${item.students.length === 1 ? '' : 's'}</span>
              <span>${esc(formatProgramLabel(item.program))}</span>
              <span>${item.totalPoints} pts</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    function initials(name) {
      return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0]).join('').toUpperCase() || '?';
    }

    function avatarColor(id) {
      const colors = ['#1767b4', '#16a34a', '#f97316', '#7c3aed', '#db2777', '#0f766e', '#b45309', '#2563eb'];
      const text = String(id || '');
      const n = Array.from(text).reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
      return colors[n % colors.length];
    }

    function renderClassDojoBoard(className) {
      const classes = classSummaries();
      const classItem = classes.find(item => item.name === className) || classes[0];
      const students = classItem?.students || [];
      const categories = ['Teamwork', 'Helping Others', 'Creativity', 'Persistence', 'Problem Solving', 'Clean Workspace', 'Leadership', 'Ready to Learn'];
      const recent = (progressData.pointEvents || [])
        .filter(e => !classItem || (e.className || 'Unassigned') === classItem.name)
        .slice()
        .sort((a,b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')))
        .slice(0, 10);
      return `
        <div class="dojo-class-board">
          <div class="dojo-board-head">
            <div>
              <div class="section-title" style="font-size:17px">${esc(classItem?.name || 'Class board')}</div>
              <p class="section-sub">${students.length} camper${students.length === 1 ? '' : 's'} on this board.${classItem?.schedule ? ` ${esc(classItem.schedule)}` : ''}</p>
            </div>
            <div class="dojo-board-tools">
              <select id="dojoCategory">${categories.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select>
              <input id="dojoNote" placeholder="Optional note" />
            </div>
          </div>
          <div class="student-figure-grid">
            ${students.map(student => `
              <div class="student-figure-card">
                <div class="student-avatar" style="background:${avatarColor(student.id)}">${esc(initials(student.name))}</div>
                <h4>${esc(student.name)}</h4>

    function selectCampClass(className, openBoard = false) {
      selectedClassName = className || 'Unassigned';
      const wrap = document.getElementById('progressToolsWrap');
      if (wrap) wrap.innerHTML = renderProgressTab();
      const sideTools = document.getElementById('sidebarTools');
      if (sideTools) sideTools.innerHTML = renderSidebarTools();
      if (openBoard) showView('progress');
      refreshProgressView();
    }

    async function awardClassPoint(studentIdArg, pointsArg) {
      const studentId = studentIdArg || document.getElementById('dojoStudent')?.value;
      const quickCategory = document.getElementById('dojoCategory')?.value;
      const manualCategory = document.getElementById('dojoManualCategory')?.value;
      const category = studentIdArg ? quickCategory : manualCategory;
      const pointsValue = Number(pointsArg ?? document.getElementById('dojoPoints')?.value ?? 1);
      const note = studentIdArg ? (document.getElementById('dojoNote')?.value || '') : (document.getElementById('dojoManualNote')?.value || '');
      if (!studentId) return;
      try {
        await api('/api/camp/coach/points', {
          method: 'POST',
          body: JSON.stringify({
            studentId,
            category,
            points: Math.abs(pointsValue),
            type: pointsValue < 0 ? 'needs-work' : 'positive',
            note
          })
        });
        const refreshed = await api('/api/camp/coach/progress');
        progressData = refreshed || progressData;
        const wrap = document.getElementById('progressToolsWrap');
        if (wrap) wrap.innerHTML = renderProgressTab();
        const sideTools = document.getElementById('sidebarTools');
        if (sideTools) sideTools.innerHTML = renderSidebarTools();
        refreshProgressView();
      } catch (err) {
        alert(err.message);
      }
    }

    function refreshProgressView() {
      const classFilter = document.getElementById('progressClass')?.value || 'All';
      const dayId = document.getElementById('progressDay')?.value || '';
      const day = (progressData.days || []).find(d => d.id === dayId) || {};
      const submissions = progressData.submissions || [];
      const students = (progressData.students || [])
        .filter(s => s.active !== false)
        .filter(s => classFilter === 'All' || (s.className || 'Unassigned') === classFilter)
        .sort((a, b) => `${a.className || ''}${a.name}`.localeCompare(`${b.className || ''}${b.name}`));
      const submittedCount = students.filter(s => submissions.some(item => item.studentId === s.id && item.dayId === dayId)).length;
      const cards = students.map(student => {
        const sub = submissions.find(item => item.studentId === student.id && item.dayId === dayId);
        return `
          <div class="submission-card ${sub ? '' : 'missing'}">
            <h4>${esc(student.name)}</h4>
            <span class="pill on">${esc(student.points?.total || 0)} pts</span>
            <span class="pill ${sub ? 'on' : 'off'}">${sub ? 'Submitted' : 'Missing'}</span>
            <p><strong>Class:</strong> ${esc(student.className || 'Unassigned')}</p>
            ${sub ? `
              <p><strong>Reflection:</strong> ${esc(sub.reflection || 'No written reflection')}</p>
              <p><strong>Submitted:</strong> ${esc(new Date(sub.updatedAt || sub.submittedAt).toLocaleString())}</p>
              ${sub.photoDataUrl ? `<a class="btn btn-ghost" href="${sub.photoDataUrl}" target="_blank" rel="noreferrer">Open photo</a><img src="${sub.photoDataUrl}" alt="${esc(student.name)} submission photo" />` : '<p>No photo submitted.</p>'}
            ` : `<p>No submission yet for ${esc(day.assignment || day.activity || 'this assignment')}.</p>`}
          </div>
        `;
      }).join('');
      const view = document.getElementById('progressView');
      if (!view) return;
      view.innerHTML = `
        <div class="card">
          <div class="section-title" style="font-size:16px">${esc(day.assignment || day.activity || 'Assignment')}</div>
          <p class="section-sub">${submittedCount} of ${students.length} submitted</p>
          <div class="progress-grid">${cards || '<p class="section-sub">No campers match this view.</p>'}</div>
        </div>
      `;
    }

    function renderPrintQueue() {
      const pendingFirst = [...printQueue].sort((a, b) => {
        const rank = { pending: 0, approved: 1, printing: 2, 'needs-changes': 3, ready: 4, completed: 5, declined: 6 };
        return (rank[a.status] ?? 9) - (rank[b.status] ?? 9) || String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
      });
      if (!pendingFirst.length) {
        return `
          <div class="section-title">3D Print Queue</div>
          <p class="section-sub">No student print requests yet.</p>
        `;
      }
      return `
        <div class="section-title">3D Print Queue</div>
        <p class="section-sub">Review student print requests, update status, leave notes, and award bonus points.</p>
        <div class="print-queue">
          ${pendingFirst.map(req => `
            <div class="print-queue-card" id="print-${esc(req.id)}">
              <h4>${esc(req.title)}</h4>
              <span class="pill ${req.status === 'completed' || req.status === 'ready' ? 'on' : 'none'}">${esc(req.status || 'pending')}</span>
              <span class="pill count">${esc(req.pointsAwarded || 0)} bonus pts</span>
              <p><strong>${esc(req.studentName)}</strong> · ${esc(req.className || 'Unassigned')}</p>
              <p><strong>Purpose:</strong> ${esc(req.purpose)}</p>
              ${req.dimensions ? `<p><strong>Size:</strong> ${esc(req.dimensions)}</p>` : ''}
              ${req.color ? `<p><strong>Color:</strong> ${esc(req.color)}</p>` : ''}
              ${req.notes ? `<p><strong>Student notes:</strong> ${esc(req.notes)}</p>` : ''}
              <div class="print-controls">
                <div>
                  <label>Status</label>
                  <select data-print-field="status">
                    ${['pending','approved','printing','ready','completed','needs-changes','declined'].map(status => `<option value="${status}" ${status === req.status ? 'selected' : ''}>${status}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label>Points</label>
                  <input data-print-field="pointsAwarded" type="number" min="0" max="100" value="${esc(req.pointsAwarded || 0)}" />
                </div>
                <div>
                  <label>Coach notes</label>
                  <input data-print-field="coachNotes" value="${esc(req.coachNotes || '')}" placeholder="Approval notes, changes needed, pickup info..." />

                <button class="btn btn-primary" onclick="updatePrintRequest('${esc(req.id)}')">Update</button>
              </div>
            </div>

    async function updatePrintRequest(id) {
      const card = document.getElementById('print-' + id);
      if (!card) return;
      const payload = {};
      card.querySelectorAll('[data-print-field]').forEach(el => { payload[el.dataset.printField] = el.value; });
      try {
        const result = await api(`/api/camp/coach/print-requests/${encodeURIComponent(id)}`, {
          method: 'PATCH',
          body: JSON.stringify(payload)
        });
        printQueue = result.requests || [];
        const refreshed = await api('/api/camp/coach/progress');
        progressData = refreshed || progressData;
        document.getElementById('printQueueWrap').innerHTML = renderPrintQueue();
        refreshProgressView();
      } catch (err) {
        alert(err.message);
      }
    }

              ${project.linkUrl ? `<p><a class="btn btn-ghost" href="${esc(project.linkUrl)}" target="_blank" rel="noreferrer">Open project link</a></p>` : ''}
              ${project.photoDataUrl ? `<a class="btn btn-ghost" href="${project.photoDataUrl}" target="_blank" rel="noreferrer">Open photo</a><img src="${project.photoDataUrl}" alt="${esc(project.studentName)} project photo" />` : '<p>No project photo submitted.</p>'}

    async function updateProject(id) {
      const card = document.getElementById('project-' + id);
      if (!card) return;
      const payload = {};
      card.querySelectorAll('[data-project-field]').forEach(el => { payload[el.dataset.projectField] = el.value; });

    function renderRosterRows() {
      let students = roster.filter(u => u.role === 'student');
      if (!students.length) return '<tr><td colspan="5" style="color:var(--muted)">No campers yet - add the first one above.</td></tr>';
      students = [...students].sort((a, b) => {
        if (rosterView === 'status') return String(b.active !== false).localeCompare(String(a.active !== false)) || a.name.localeCompare(b.name);
        if (rosterView === 'name') return a.name.localeCompare(b.name);
        return `${a.className || 'Unassigned'}${a.name}`.localeCompare(`${b.className || 'Unassigned'}${b.name}`);
      });
      let currentClass = '';
      return students.map(s => {
        const className = s.className || 'Unassigned';
        const classBreak = rosterView === 'class' && className !== currentClass
          ? `<tr><td colspan="5" class="class-heading">${esc(className)}</td></tr>`
          : '';
        currentClass = className;
        return `${classBreak}
        <tr>
          <td style="font-weight:800">${esc(s.name)}</td>
          <td><input value="${esc(className)}" style="min-width:150px" onchange="updateCamperClass('${esc(s.id)}', this.value)" /></td>
          <td><code>${esc(s.username)}</code></td>
          <td><span class="pill ${s.active !== false ? 'on' : 'off'}">${s.active !== false ? 'Active' : 'Disabled'}</span></td>
          <td style="white-space:nowrap">
            <button class="btn btn-ghost" onclick="resetPassword('${esc(s.id)}', '${esc(s.name)}')">Reset password</button>
            <button class="btn ${s.active !== false ? 'btn-danger' : 'btn-primary'}" onclick="toggleActive('${esc(s.id)}', ${s.active !== false})">
              ${s.active !== false ? 'Disable' : 'Enable'}
            </button>
          </td>
        </tr>
      `;
      }).join('');
    }

    function setRosterView(value) {
      rosterView = value;
      const body = document.getElementById('rosterBody');
      if (body) body.innerHTML = renderRosterRows();
    }

    async function refreshRoster() {
      const [result, progressResult] = await Promise.all([
        api('/api/camp/coach/roster'),
        api('/api/camp/coach/progress')
      ]);
      roster = result.users || [];
      progressData = progressResult || progressData;
      const body = document.getElementById('rosterBody');
      if (body) body.innerHTML = renderRosterRows();
      const progressWrap = document.getElementById('progressToolsWrap');
      if (progressWrap) progressWrap.innerHTML = renderProgressTab();
      const sideTools = document.getElementById('sidebarTools');
      if (sideTools) sideTools.innerHTML = renderSidebarTools();
      refreshProgressView();
    }

    async function addCamper() {
      const name = document.getElementById('camperName').value.trim();
      const className = document.getElementById('camperClass').value.trim();
      const errorBox = document.getElementById('camperError');
      const credsBox = document.getElementById('credsBox');
      errorBox.style.display = 'none';
      credsBox.style.display = 'none';
      if (!name) {
        errorBox.textContent = 'Camper name is required.';
        errorBox.style.display = 'block';
        return;
      }
      try {
        const result = await api('/api/camp/coach/students', {
          method: 'POST',
          body: JSON.stringify({ name, className })
        });
        const s = result.student;
        credsBox.innerHTML = `
          ✅ <strong>${esc(s.name)}</strong> added!<br/>
          Class: <code>${esc(s.className || 'Unassigned')}</code><br/>
          Username: <code>${esc(s.username)}</code><br/>
          Password: <code>${esc(s.password)}</code><br/>
          <span style="font-size:12.5px;color:var(--muted)">Save these now — the password is not shown again.</span>
        `;
        credsBox.style.display = 'block';
        document.getElementById('camperName').value = '';
        document.getElementById('camperClass').value = '';
        await refreshRoster();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    }

    async function resetPassword(id, name) {
      if (!confirm(`Reset the password for ${name}?`)) return;
      try {
        const result = await api(`/api/camp/coach/students/${encodeURIComponent(id)}`, {
          method: 'PATCH',
          body: JSON.stringify({ resetPassword: true })
        });
        alert(`New password for ${name}: ${result.password}\n\nWrite it down — it is not shown again.`);
      } catch (err) {
        alert(err.message);
      }
    }

    async function updateCamperClass(id, className) {
      try {
        await api(`/api/camp/coach/students/${encodeURIComponent(id)}`, {
          method: 'PATCH',
          body: JSON.stringify({ className })
        });
        await refreshRoster();
      } catch (err) {
        alert(err.message);
      }
    }

          body: JSON.stringify({ active: !isActive })

            <div class="view ${activeView === 'progress' ? 'active' : ''}" id="view-progress"><div class="card" id="progressToolsWrap">${renderProgressTab()}</div></div>
            <div class="view ${activeView === 'classroom' ? 'active' : ''}" id="view-classroom"><div class="card" id="classroomToolsWrap">${renderClassroomControls()}</div></div>
            <div class="view ${activeView === 'projects' ? 'active' : ''}" id="view-projects"><div class="card" id="projectQueueWrap">${renderProjectQueue()}</div></div>
            <div class="view ${activeView === 'print' ? 'active' : ''}" id="view-print"><div class="card" id="printQueueWrap">${renderPrintQueue()}</div></div>
          </div>
        </div>
      `;
    }

    /* ── Live Lesson: authoring + presenting ── */
    let lastTally = { total: 0, counts: [] };

    async function loadLessons() {
      try {
        const res = await api('/api/camp/coach/lessons');
        lessons = res.lessons || [];
        liveState = res.live && res.live.active ? { active: true, ...res.live } : { active: false };
        refreshNavBadges();
        if (liveState.active) {
          await pollLive();
          if (activeView === 'livelesson') startLivePolling();
        } else {
          renderLiveLessonWrap();
        }
      } catch (err) {
        const wrap = document.getElementById('liveLessonWrap');
        if (wrap) wrap.innerHTML = `<div class="empty-curriculum">${esc(err.message)}</div>`;
      }
    }

    function renderLiveLessonWrap() {
      const wrap = document.getElementById('liveLessonWrap');
      if (!wrap) return;
      if (lessonDraft) { wrap.innerHTML = renderLessonEditor(); return; }
      if (liveState && liveState.active) { wrap.innerHTML = renderPresenter(); return; }
      wrap.innerHTML = renderLessonList();
    }

    function renderLessonList() {
      return `
        <div class="section-title">🎥 Live Lessons</div>
        <p class="section-sub">Build a slide deck, then press <strong>Present</strong>. Campers tap “Join lesson” on their iPad and follow along — including question slides they answer live.</p>
        <div style="margin-bottom:16px"><button class="btn btn-primary" onclick="newLesson()">➕ New lesson</button></div>
        ${lessons.length ? lessons.map(l => {
          const qn = l.slides.filter(s => s.type === 'question').length;
          return `
            <div class="lesson-card">
              <div>
                <h4>${esc(l.title)}</h4>
                <div class="meta">${l.slides.length} slide${l.slides.length === 1 ? '' : 's'}${qn ? ` · ${qn} question${qn === 1 ? '' : 's'}` : ''}</div>
              </div>
              <div class="lesson-actions">
                <button class="btn btn-primary" onclick="presentLesson('${esc(l.id)}')">▶ Present</button>
                <button class="btn btn-ghost" onclick="editLesson('${esc(l.id)}')">Edit</button>
                <button class="btn btn-danger" onclick="deleteLesson('${esc(l.id)}')">Delete</button>
              </div>
            </div>`;
        }).join('') : `<div class="empty-curriculum">No lessons yet. Click “New lesson” to build your first one.</div>`}
      `;
    }

    /* Editor */
    function blankSlide(type) {
      return { id: 'slide-' + Math.random().toString(36).slice(2, 8), type: type || 'content', title: '', body: '', image: '', options: type === 'question' ? ['', ''] : [], correctIndex: type === 'question' ? 0 : -1 };
    }
    function newLesson() {
      lessonDraft = { id: '', title: '', slides: [blankSlide('content')] };
      renderLiveLessonWrap();
    }
    function editLesson(id) {
      const l = lessons.find(x => x.id === id);
      if (!l) return;
      lessonDraft = JSON.parse(JSON.stringify(l));
      renderLiveLessonWrap();
    }
    function cancelEdit() { lessonDraft = null; renderLiveLessonWrap(); }

    function renderSlideEditor(slide, i) {
      const isQ = slide.type === 'question';
      return `
        <div class="slide-editor" data-slide-card="${i}">
          <div class="slide-editor-head">
            <span class="idx">Slide ${i + 1} · ${isQ ? '❓ Question' : '📄 Content'}</span>
            <span style="display:flex;gap:6px">
              <button class="mini-btn" onclick="moveSlide(${i},-1)" ${i === 0 ? 'disabled' : ''}>↑</button>
              <button class="mini-btn" onclick="moveSlide(${i},1)" ${i === lessonDraft.slides.length - 1 ? 'disabled' : ''}>↓</button>
              <button class="mini-btn" style="color:var(--red)" onclick="removeSlide(${i})">✕</button>
            </span>
          </div>
          <label>Slide type</label>
          <select data-field="type" onchange="onSlideTypeChange(${i}, this.value)">
            <option value="content" ${!isQ ? 'selected' : ''}>Content (text / image)</option>
            <option value="question" ${isQ ? 'selected' : ''}>Question (campers answer)</option>
          </select>
          <label>Title</label>
          <input data-field="title" value="${esc(slide.title)}" placeholder="${isQ ? 'Ask the question' : 'Slide heading'}" />
          <label>${isQ ? 'Question details (optional)' : 'Body text'}</label>
          <textarea data-field="body" rows="3" placeholder="${isQ ? 'Extra detail campers should read' : 'What you want campers to read on their iPad'}">${esc(slide.body)}</textarea>
          <label>Image URL (optional)</label>
          <input data-field="image" value="${esc(slide.image)}" placeholder="https://… or /robotics lab/…" />
          ${isQ ? `
            <label>Answer choices (pick the correct one)</label>
            <div data-options>
              ${(slide.options.length ? slide.options : ['', '']).map((opt, j) => `
                <div class="opt-row">
                  <input type="radio" name="correct-${i}" value="${j}" ${slide.correctIndex === j ? 'checked' : ''} title="Mark correct">
                  <input type="text" data-opt="${j}" value="${esc(opt)}" placeholder="Choice ${j + 1}">
                  <button class="opt-x" onclick="removeOption(${i}, ${j})" title="Remove">✕</button>
                </div>`).join('')}
            </div>
            <button class="mini-btn" onclick="addOption(${i})">＋ Add choice</button>
          ` : ''}
        </div>`;
    }

    function renderLessonEditor() {
      return `
        <div class="section-title">${lessonDraft.id ? 'Edit lesson' : 'New lesson'}</div>
        <p class="section-sub">Each slide is shown full-screen on campers' iPads when you present. Question slides give them tappable answers.</p>
        <div class="card" style="margin-bottom:16px">
          <label class="day-edit-date" style="display:block;margin-bottom:6px">Lesson title</label>
          <input id="lessonTitle" value="${esc(lessonDraft.title)}" placeholder="e.g. Day 1: Meet LEGO + Balloon Car"
            style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15px;outline:none" />
        </div>
        <div id="slidesWrap">${lessonDraft.slides.map((s, i) => renderSlideEditor(s, i)).join('')}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 20px">
          <button class="mini-btn" onclick="addSlide('content')">＋ Content slide</button>
          <button class="mini-btn" onclick="addSlide('question')">＋ Question slide</button>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="saveLesson()">Save lesson</button>
          <button class="btn btn-ghost" onclick="cancelEdit()">Cancel</button>
        </div>`;
    }

    function collectDraft() {
      if (!lessonDraft) return;
      const titleEl = document.getElementById('lessonTitle');
      if (titleEl) lessonDraft.title = titleEl.value;
      lessonDraft.slides.forEach((s, i) => {
        const root = document.querySelector(`[data-slide-card="${i}"]`);
        if (!root) return;
        s.type = root.querySelector('[data-field="type"]').value === 'question' ? 'question' : 'content';
        s.title = root.querySelector('[data-field="title"]').value;
        s.body = root.querySelector('[data-field="body"]').value;
        s.image = root.querySelector('[data-field="image"]').value;
        if (s.type === 'question') {
          s.options = [...root.querySelectorAll('[data-opt]')].map(el => el.value);
          const checked = root.querySelector(`input[name="correct-${i}"]:checked`);
          s.correctIndex = checked ? Number(checked.value) : -1;
        } else { s.options = []; s.correctIndex = -1; }
      });
    }
    function onSlideTypeChange(i, val) {
      collectDraft();
      const s = lessonDraft.slides[i];
      if (val === 'question' && (!s.options || !s.options.length)) { s.options = ['', '']; s.correctIndex = 0; }
      renderLiveLessonWrap();
    }
    function addSlide(type) { collectDraft(); lessonDraft.slides.push(blankSlide(type)); renderLiveLessonWrap(); }
    function removeSlide(i) { collectDraft(); if (lessonDraft.slides.length <= 1) { alert('A lesson needs at least one slide.'); return; } lessonDraft.slides.splice(i, 1); renderLiveLessonWrap(); }
    function moveSlide(i, dir) { collectDraft(); const j = i + dir; if (j < 0 || j >= lessonDraft.slides.length) return; const t = lessonDraft.slides[i]; lessonDraft.slides[i] = lessonDraft.slides[j]; lessonDraft.slides[j] = t; renderLiveLessonWrap(); }
    function addOption(i) { collectDraft(); lessonDraft.slides[i].options.push(''); renderLiveLessonWrap(); }
    function removeOption(i, j) { collectDraft(); const s = lessonDraft.slides[i]; if (s.options.length <= 2) { alert('A question needs at least two choices.'); return; } s.options.splice(j, 1); if (s.correctIndex >= s.options.length) s.correctIndex = 0; renderLiveLessonWrap(); }

    async function saveLesson() {
      collectDraft();
      if (!lessonDraft.title.trim()) { alert('Give the lesson a title.'); return; }
      try {
        const res = await api('/api/camp/coach/lessons', { method: 'POST', body: JSON.stringify(lessonDraft) });
        lessons = res.lessons || [];
        lessonDraft = null;
        renderLiveLessonWrap();
        refreshNavBadges();
      } catch (err) { alert(err.message); }
    }
    async function deleteLesson(id) {
      const l = lessons.find(x => x.id === id);
      if (!confirm(`Delete “${l ? l.title : 'this lesson'}”?`)) return;
      try {
        const res = await api(`/api/camp/coach/lessons/${encodeURIComponent(id)}`, { method: 'DELETE' });
        lessons = res.lessons || [];
        renderLiveLessonWrap();
      } catch (err) { alert(err.message); }
    }

    /* Presenter */
    async function presentLesson(id) {
      try {
        const res = await api('/api/camp/coach/live/start', { method: 'POST', body: JSON.stringify({ lessonId: id }) });
        liveState = res.live; lastTally = res.tally || { total: 0, counts: [] };
        lessonDraft = null;
        renderLiveLessonWrap();
        refreshNavBadges();
        startLivePolling();
      } catch (err) { alert(err.message); }
    }
    async function liveGoto(index) {
      try {
        const res = await api('/api/camp/coach/live/goto', { method: 'POST', body: JSON.stringify({ index }) });
        liveState = res.live; lastTally = res.tally || { total: 0, counts: [] };
        renderLiveLessonWrap();
      } catch (err) { alert(err.message); }
    }
    function liveNext() { if (liveState) liveGoto(Math.min(liveState.currentIndex + 1, liveState.slides.length - 1)); }
    function livePrev() { if (liveState) liveGoto(Math.max(liveState.currentIndex - 1, 0)); }
    async function liveStop() {
      if (!confirm('End the live lesson for everyone?')) return;
      try {
        await api('/api/camp/coach/live/stop', { method: 'POST' });
        liveState = { active: false };
        stopLivePolling();
        renderLiveLessonWrap();
        refreshNavBadges();
      } catch (err) { alert(err.message); }
    }

    async function pollLive() {
      try {
        const res = await api('/api/camp/coach/live');
        liveState = res.live; lastTally = res.tally || { total: 0, counts: [] };
        if (!liveState.active) { stopLivePolling(); refreshNavBadges(); }
        if (activeView === 'livelesson' && !lessonDraft) renderLiveLessonWrap();
      } catch (err) { /* keep last view */ }
    }
    function startLivePolling() { stopLivePolling(); livePollTimer = setInterval(pollLive, 3000); }
    function stopLivePolling() { if (livePollTimer) { clearInterval(livePollTimer); livePollTimer = null; } }

    function renderPresenter() {
      const s = liveState.slides[liveState.currentIndex] || liveState.slides[0];
      const isQ = s.type === 'question';
      const thumbs = liveState.slides.map((sl, i) =>
        `<button class="thumb ${i === liveState.currentIndex ? 'current' : ''} ${sl.type === 'question' ? 'q' : ''}" onclick="liveGoto(${i})" title="${esc(sl.title || ('Slide ' + (i + 1)))}">${i + 1}</button>`
      ).join('');
      let tallyHtml = '';
      if (isQ) {
        const total = lastTally.total || 0;
        tallyHtml = `<div class="tally">
          ${s.options.map((opt, j) => {
            const c = (lastTally.counts && lastTally.counts[j]) || 0;
            const pct = total ? Math.round((c / total) * 100) : 0;
            const correct = j === s.correctIndex;
            return `<div class="tally-row ${correct ? 'correct' : ''}">
              <div class="tally-label"><span>${correct ? '✓ ' : ''}${esc(opt)}</span><span>${c} (${pct}%)</span></div>
              <div class="tally-bar"><div class="tally-fill" style="width:${pct}%"></div></div>
            </div>`;
          }).join('')}
          <div class="meta" style="font-size:12.5px;color:var(--muted)">${total} camper${total === 1 ? '' : 's'} answered · the ✓ row is the correct choice (campers don't see which is right).</div>
        </div>`;
      }
      return `
        <div class="section-title">🎥 Presenting: ${esc(liveState.lessonTitle)}</div>
        <p class="section-sub"><span class="live-dot"></span>Live now — campers can join from their iPad. Use Prev/Next (or the numbers) to move everyone's screen.</p>
        <div class="presenter">
          <div class="presenter-bar">
            <div>
              <div class="title">${esc(liveState.lessonTitle)}</div>
              <div class="counter">Slide ${liveState.currentIndex + 1} of ${liveState.slides.length}</div>
            </div>
            <div class="presenter-controls">
              <button class="btn btn-ghost" onclick="livePrev()" ${liveState.currentIndex === 0 ? 'disabled' : ''}>◀ Prev</button>
              <button class="btn btn-ghost" onclick="liveNext()" ${liveState.currentIndex >= liveState.slides.length - 1 ? 'disabled' : ''}>Next ▶</button>
              <button class="btn btn-danger" onclick="liveStop()">■ End</button>
            </div>
          </div>
          <div class="slide-show ${isQ ? 'q' : ''}">
            <div class="slide-kicker">${isQ ? '❓ Question' : '📄 ' + ('Slide ' + (liveState.currentIndex + 1))}</div>
            <h2>${esc(s.title) || '<span style=\"color:var(--muted)\">(no title)</span>'}</h2>
            ${s.body ? `<div class="body">${esc(s.body)}</div>` : ''}
            ${s.image ? `<img src="${esc(s.image)}" alt="" onerror="this.style.display='none'">` : ''}
            ${tallyHtml}
          </div>
          <div class="slide-thumbs">${thumbs}</div>
        </div>`;
    }

    async function load() {
      try {
        const [hubResult, rosterResult, progressResult, printResult, projectResult] = await Promise.all([
          api('/api/camp/hub-data'),
          api('/api/camp/coach/roster'),
          api('/api/camp/coach/progress'),
          api('/api/camp/coach/print-requests'),
          api('/api/camp/coach/projects')
        ]);
        hubData = hubResult.data;
        roster = rosterResult.users || [];
        progressData = progressResult || { students: [], days: [], submissions: [] };
        printQueue = printResult.requests || [];
        projectQueue = projectResult.projects || [];
        classroomState = hubData.classroom || classroomState;
        renderShell();
        refreshProgressView();
        loadLessons();
      } catch (err) {
        if (err.message !== 'Login required') {
          app.innerHTML = `<div class="loading-state"><p class="loading-text">${esc(err.message)}</p></div>`;
        }
      }
    }

    logoutButton.addEventListener('click', async () => {
      await fetch('/api/camp/logout', { method: 'POST' });
      window.location.href = '/camp-hub/login';
    });

    document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);
    window.addEventListener('beforeunload', stopLivePolling);

    load();
  </script>
</body>
</html>
