    window.deleteSkill = async function deleteSkill(id) {
      if (!confirm('Delete this skill?')) return;
      try {
        const res = await api(`/api/camp/coach/skills/${encodeURIComponent(id)}`, { method: 'DELETE' });
        classroomState = res.classroom || classroomState;
        renderManageSkills();
      } catch (err) { alert(err.message); }

    function refreshProgressView() {
      const classFilter = document.getElementById('progressClass')?.value || 'All';
      const dayId = document.getElementById('progressDay')?.value || '';
      const day = (progressData.days || []).find(d => d.id === dayId) || {};
      const submissions = progressData.submissions || [];
      const students = (progressData.students || [])
        .filter(s => s.active !== false)
        .filter(s => classFilter === 'All' || (s.className || 'Unassigned') === classFilter)
        .sort((a, b) => `${a.className || ''}${a.name}`.localeCompare(`${b.className || ''}${b.name}`));
      const submittedCount = students.filter(s => submissions.some(item => item.studentId === s.id && item.dayId === dayId)).length;
      const cards = students.map(student => {
        const sub = submissions.find(item => item.studentId === student.id && item.dayId === dayId);
        return `
          <div class="submission-card ${sub ? '' : 'missing'}">
            <h4>${esc(student.name)}</h4>
            <span class="pill on">${esc(student.points?.total || 0)} pts</span>

            <p><strong>Class:</strong> ${esc(student.className || 'Unassigned')}</p>
            ${sub ? `
              <p><strong>Reflection:</strong> ${esc(sub.reflection || 'No written reflection')}</p>
              <p><strong>Submitted:</strong> ${esc(new Date(sub.updatedAt || sub.submittedAt).toLocaleString())}</p>

      }).join('');
      const view = document.getElementById('progressView');
      if (!view) return;
      view.innerHTML = `
        <div class="card">
          <div class="section-title" style="font-size:16px">${esc(day.assignment || day.activity || 'Assignment')}</div>

    async function updatePrintRequest(id) {
      const card = document.getElementById('print-' + id);
      if (!card) return;
      const payload = {};
      card.querySelectorAll('[data-print-field]').forEach(el => { payload[el.dataset.printField] = el.value; });
      try {
        const result = await api(`/api/camp/coach/print-requests/${encodeURIComponent(id)}`, {
          method: 'PATCH',
          body: JSON.stringify(payload)
        });
        printQueue = result.requests || [];
        const refreshed = await api('/api/camp/coach/progress');
        progressData = refreshed || progressData;
        document.getElementById('printQueueWrap').innerHTML = renderPrintQueue();
        refreshProgressView();
      } catch (err) {
        alert(err.message);
      }
    }

                  <label>Status</label>
                  <select data-project-field="status">
                    ${['submitted','reviewing','approved','featured','needs-revision'].map(status => `<option value="${status}" ${status === project.status ? 'selected' : ''}>${status}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label>Points</label>
                  <input data-project-field="pointsAwarded" type="number" min="0" max="100" value="${esc(project.pointsAwarded || 0)}" />
                </div>
                <div>
                  <label>Feedback</label>
                  <input data-project-field="coachFeedback" value="${esc(project.coachFeedback || '')}" placeholder="What went well, revisions, or next steps..." />
                </div>
                <button class="btn btn-primary" onclick="updateProject('${esc(project.id)}')">Update</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function updateProject(id) {
      const card = document.getElementById('project-' + id);
      if (!card) return;
      const payload = {};
      card.querySelectorAll('[data-project-field]').forEach(el => { payload[el.dataset.projectField] = el.value; });
      try {
        const result = await api(`/api/camp/coach/projects/${encodeURIComponent(id)}`, {
          method: 'PATCH',
          body: JSON.stringify(payload)
        });
        projectQueue = result.projects || [];
        const refreshed = await api('/api/camp/coach/progress');
        progressData = refreshed || progressData;
        document.getElementById('projectQueueWrap').innerHTML = renderProjectQueue();
        refreshProgressView();
      } catch (err) {
        alert(err.message);
      }
    }

    function renderCampersTab() {
      return `
        <div class="section-title">Campers</div>
        <p class="section-sub">Add campers to give them hub logins. Usernames and passwords are generated automatically — write them down when shown, they only appear once.</p>
        <div class="card">
          <div class="form-grid">
            <div>
              <label for="camperName">Camper name</label>
              <input id="camperName" placeholder="e.g. Maya Chen" />
            </div>
            <div>
              <label for="camperClass">Class / group</label>
              <input id="camperClass" list="summerClassOptions" placeholder="Choose a summer class" />
              <datalist id="summerClassOptions">
                ${classList().map(name => `<option value="${esc(name)}"></option>`).join('')}
              </datalist>
            </div>
            <div>
              <button class="btn btn-primary" onclick="addCamper()">Add camper</button>
            </div>
            <div class="creds-box" id="credsBox" style="display:none"></div>
            <div class="error-box" id="camperError"></div>
          </div>
        </div>
        <div class="card">
          <div class="toolbar">
            <label for="rosterView">Organize roster by</label>
            <select id="rosterView" onchange="setRosterView(this.value)">
              <option value="class" ${rosterView === 'class' ? 'selected' : ''}>Class / group</option>
              <option value="name" ${rosterView === 'name' ? 'selected' : ''}>Student name</option>
              <option value="status" ${rosterView === 'status' ? 'selected' : ''}>Status</option>
            </select>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Name</th><th>Class</th><th>Username</th><th>Status</th><th>Actions</th></tr>
              </thead>
              <tbody id="rosterBody">
                ${renderRosterRows()}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderRosterRows() {
      let students = roster.filter(u => u.role === 'student');
      if (!students.length) return '<tr><td colspan="5" style="color:var(--muted)">No campers yet - add the first one above.</td></tr>';
      students = [...students].sort((a, b) => {
        if (rosterView === 'status') return String(b.active !== false).localeCompare(String(a.active !== false)) || a.name.localeCompare(b.name);
        if (rosterView === 'name') return a.name.localeCompare(b.name);
        return `${a.className || 'Unassigned'}${a.name}`.localeCompare(`${b.className || 'Unassigned'}${b.name}`);
      });
      let currentClass = '';
      return students.map(s => {
        const className = s.className || 'Unassigned';
        const classBreak = rosterView === 'class' && className !== currentClass
          ? `<tr><td colspan="5" class="class-heading">${esc(className)}</td></tr>`
          : '';
        currentClass = className;
        return `${classBreak}
        <tr>
          <td style="font-weight:800">${esc(s.name)}</td>
          <td><input value="${esc(className)}" style="min-width:150px" onchange="updateCamperClass('${esc(s.id)}', this.value)" /></td>
          <td><code>${esc(s.username)}</code></td>
          <td><span class="pill ${s.active !== false ? 'on' : 'off'}">${s.active !== false ? 'Active' : 'Disabled'}</span></td>
          <td style="white-space:nowrap">
            <button class="btn btn-ghost" onclick="resetPassword('${esc(s.id)}', '${esc(s.name)}')">Reset password</button>
            <button class="btn ${s.active !== false ? 'btn-danger' : 'btn-primary'}" onclick="toggleActive('${esc(s.id)}', ${s.active !== false})">
              ${s.active !== false ? 'Disable' : 'Enable'}
            </button>
          </td>
        </tr>
      `;
      }).join('');
    }

    function setRosterView(value) {
      rosterView = value;
      const body = document.getElementById('rosterBody');
      if (body) body.innerHTML = renderRosterRows();
    }

    async function refreshRoster() {
      const [result, progressResult] = await Promise.all([
        api('/api/camp/coach/roster'),
        api('/api/camp/coach/progress')
      ]);
      roster = result.users || [];
      progressData = progressResult || progressData;
      const body = document.getElementById('rosterBody');
      if (body) body.innerHTML = renderRosterRows();
      const progressWrap = document.getElementById('progressToolsWrap');
      if (progressWrap) progressWrap.innerHTML = renderProgressTab();
      const sideTools = document.getElementById('sidebarTools');
      if (sideTools) sideTools.innerHTML = renderSidebarTools();
      refreshProgressView();
    }

    async function addCamper() {
      const name = document.getElementById('camperName').value.trim();
      const className = document.getElementById('camperClass').value.trim();
      const errorBox = document.getElementById('camperError');
      const credsBox = document.getElementById('credsBox');
      errorBox.style.display = 'none';
      credsBox.style.display = 'none';
      if (!name) {
        errorBox.textContent = 'Camper name is required.';
        errorBox.style.display = 'block';
        return;
      }
      try {
        const result = await api('/api/camp/coach/students', {
          method: 'POST',
          body: JSON.stringify({ name, className })
        });
        const s = result.student;
        credsBox.innerHTML = `
          ✅ <strong>${esc(s.name)}</strong> added!<br/>
          Class: <code>${esc(s.className || 'Unassigned')}</code><br/>
          Username: <code>${esc(s.username)}</code><br/>
          Password: <code>${esc(s.password)}</code><br/>
          <span style="font-size:12.5px;color:var(--muted)">Save these now — the password is not shown again.</span>
        `;
        credsBox.style.display = 'block';
        document.getElementById('camperName').value = '';
        document.getElementById('camperClass').value = '';
        await refreshRoster();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    }

    async function resetPassword(id, name) {
      if (!confirm(`Reset the password for ${name}?`)) return;
      try {
        const result = await api(`/api/camp/coach/students/${encodeURIComponent(id)}`, {
          method: 'PATCH',
          body: JSON.stringify({ resetPassword: true })
        });
        alert(`New password for ${name}: ${result.password}\n\nWrite it down — it is not shown again.`);
      } catch (err) {
        alert(err.message);
      }
    }

    async function updateCamperClass(id, className) {
      try {
        await api(`/api/camp/coach/students/${encodeURIComponent(id)}`, {
          method: 'PATCH',
          body: JSON.stringify({ className })
        });
        await refreshRoster();
      } catch (err) {
        alert(err.message);
      }
    }

    async function toggleActive(id, isActive) {
      try {
        await api(`/api/camp/coach/students/${encodeURIComponent(id)}`, {
          method: 'PATCH',
          body: JSON.stringify({ active: !isActive })
        });
        await refreshRoster();
      } catch (err) {
        alert(err.message);
      }
    }

    /* ── Shell with collapsible sidebar ── */
    let activeView = 'schedule';

    const NAV_ITEMS = [
      { id: 'schedule', ico: '🗓️', label: 'Schedule' },
      { id: 'livelesson', ico: '🎥', label: 'Live Lesson' },
      { id: 'announcements', ico: '📢', label: 'Announcements' },
      { id: 'campers', ico: '👧', label: 'Campers' },
      { id: 'progress', ico: '📊', label: 'Progress' },
      { id: 'classroom', ico: '🎛️', label: 'Classroom' },
      { id: 'projects', ico: '🧩', label: 'Projects' },
      { id: 'print', ico: '🖨️', label: 'Print Queue' }
    ];

    function navBadge(id) {
      if (id === 'print') { const n = printQueue.filter(r => (r.status || 'pending') === 'pending').length; return n ? n : 0; }
      if (id === 'projects') { const n = projectQueue.filter(r => (r.status || 'pending') === 'pending').length; return n ? n : 0; }
      if (id === 'livelesson') { return liveState && liveState.active ? '●' : 0; }
      return 0;
    }

    function renderSidebarTools() {
      const classes = classSummaries();
      if (!classes.length) return '';
      const selected = classes.some(item => item.name === selectedClassName) ? selectedClassName : classes[0].name;
      return `
        <div class="sidebar-tools">
          <div>
            <label for="sidebarClassView">Class view</label>
            <select id="sidebarClassView" onchange="selectCampClass(this.value, true)">
              ${classes.map(item => `<option value="${esc(item.name)}" ${item.name === selected ? 'selected' : ''}>${esc(item.name)}</option>`).join('')}
            </select>
          </div>
          <button class="btn btn-ghost" type="button" onclick="showView('progress')">Open class board</button>
        </div>
      `;
    }

    function renderNav() {
      return NAV_ITEMS.map(item => {
        const badge = navBadge(item.id);
        return `<button class="nav-item ${item.id === activeView ? 'active' : ''}" data-view="${item.id}" onclick="showView('${item.id}')">
          <span class="nav-ico">${item.ico}</span><span>${esc(item.label)}</span>${badge ? `<span class="nav-badge">${esc(badge)}</span>` : ''}
        </button>`;
      }).join('');
    }

    function showView(name) {
      activeView = name;
      document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === name));
      document.querySelectorAll('.view').forEach(p => p.classList.toggle('active', p.id === 'view-' + name));
      if (name === 'livelesson') loadLessons();
      else stopLivePolling();
      // On small screens, collapse the menu after choosing so the content is visible.
      if (window.matchMedia('(max-width: 820px)').matches) document.getElementById('dash').classList.add('collapsed');
    }

    // Back-compat: some rendered controls still call showTab.
    function showTab(name) { showView(name); }

    function toggleSidebar() {
      const dash = document.getElementById('dash');
      if (dash) dash.classList.toggle('collapsed');
    }

    function refreshNavBadges() {
      const nav = document.getElementById('sidebarNav');
      if (nav) nav.innerHTML = renderNav();
    }

    function renderShell() {
      const { user, camp, curriculum, announcements } = hubData;
      userLine.textContent = `${user.name} · Coach`;
      app.innerHTML = `
        <div class="dash" id="dash">
          <aside class="sidebar" id="sidebar">
            <div id="sidebarTools">${renderSidebarTools()}</div>
            <nav id="sidebarNav">${renderNav()}</nav>
          </aside>
          <div class="dash-main">
            <div class="page-head">
              <div>
                <div class="page-title">${esc(camp.name)} ${esc(camp.year)}</div>
                <p class="page-sub">${esc(fmt(camp.startDate, { month: 'long', day: 'numeric' }))} – ${esc(fmt(camp.endDate, { month: 'long', day: 'numeric' }))} · ${esc(camp.scheduleNote || '')}</p>
              </div>
              <a class="btn btn-ghost" href="/camp-hub">View hub as campers see it →</a>
            </div>
            <div class="view ${activeView === 'schedule' ? 'active' : ''}" id="view-schedule">${renderScheduleTab(curriculum)}</div>
            <div class="view ${activeView === 'livelesson' ? 'active' : ''}" id="view-livelesson"><div id="liveLessonWrap"></div></div>
            <div class="view ${activeView === 'announcements' ? 'active' : ''}" id="view-announcements">${renderAnnouncementsTab(announcements)}</div>
            <div class="view ${activeView === 'campers' ? 'active' : ''}" id="view-campers">${renderCampersTab()}</div>
            <div class="view ${activeView === 'progress' ? 'active' : ''}" id="view-progress"><div class="card" id="progressToolsWrap">${renderProgressTab()}</div></div>
            <div class="view ${activeView === 'classroom' ? 'active' : ''}" id="view-classroom"><div class="card" id="classroomToolsWrap">${renderClassroomControls()}</div></div>
            <div class="view ${activeView === 'projects' ? 'active' : ''}" id="view-projects"><div class="card" id="projectQueueWrap">${renderProjectQueue()}</div></div>
            <div class="view ${activeView === 'print' ? 'active' : ''}" id="view-print"><div class="card" id="printQueueWrap">${renderPrintQueue()}</div></div>
          </div>
        </div>
      `;
    }

    /* ── Live Lesson: authoring + presenting ── */
    let lastTally = { total: 0, counts: [] };
    // Live HTML-deck presentation (the real Lesson Building slideshows, mirrored to iPads)
    let teacherDeckList = [];
    let deckBank = [];          // ready-made questions for the live deck
    let deckSlideIndex = 0;     // coach's current slide (source of truth for the iframe)
    let deckSlideCount = 0;
    let deckQBarSig = '';       // avoids rebuilding the push-question <select> on every poll

    async function loadLessons() {
      try {
        const res = await api('/api/camp/coach/lessons');
        lessons = res.lessons || [];
        liveState = res.live && res.live.active ? { active: true, ...res.live } : { active: false };
        if (!warmupSelectedDayId) warmupSelectedDayId = defaultWarmupDayId();
        await loadWarmupResponses(warmupSelectedDayId, false);
        refreshNavBadges();
        if (liveState.active) {
          await pollLive();
          if (activeView === 'livelesson') startLivePolling();
        } else {
          renderLiveLessonWrap();
        }
      } catch (err) {
        const wrap = document.getElementById('liveLessonWrap');
        if (wrap) wrap.innerHTML = `<div class="empty-curriculum">${esc(err.message)}</div>`;
      }
    }

    function renderLiveLessonWrap() {
      const wrap = document.getElementById('liveLessonWrap');
      if (!wrap) return;
      if (lessonDraft) { wrap.innerHTML = renderLessonEditor(); return; }
      if (liveState && liveState.active && liveState.kind === 'deck') {
        // Deck mode: the <iframe> must never be re-rendered (that would reload it and
        // drop fullscreen / lose the teacher's place), so build it once, then only
        // refresh the slide counter + question/tally bar in place.
        const existing = document.getElementById('deckPresenterEl');
        if (existing) { updateDeckDynamic(); }
        else {
          wrap.innerHTML = renderDeckPresenter();
          deckQBarSig = liveState.activeQuestion ? 'active:' + liveState.activeQuestion.id : 'push:' + deckBank.length;
        }
        return;
      }
      if (liveState && liveState.active) {
        // Update the presenter IN PLACE if it already exists, so the fullscreen
        // element (#presenterEl) is never removed from the DOM (which would drop
        // the coach out of fullscreen on every poll / slide change).
        const existing = document.getElementById('presenterEl');
        if (existing) {
          existing.innerHTML = renderPresenterInner();
          const warm = document.getElementById('warmupResponsesPanel');
          if (warm) warm.innerHTML = renderWarmupResponsesPanel();
        }
        else { wrap.innerHTML = renderWarmupResponsesPanel() + renderPresenter(); }
        return;
      }
      wrap.innerHTML = renderWarmupResponsesPanel() + renderLessonList();
    }

    function campDaysForWarmup() {
      return (hubData?.curriculum || []).flatMap(week => (week.days || []).map(day => ({ ...day, weekLabel: week.label, weekTheme: week.theme || '' }))).filter(day => day.id);
    }

    function defaultWarmupDayId() {
      const days = campDaysForWarmup().filter(day => day.date).sort((a, b) => a.date.localeCompare(b.date));
      const today = todayKey();
      return days.find(day => day.date === today)?.id || days.find(day => day.date > today)?.id || days[0]?.id || '';
    }

    async function loadWarmupResponses(dayId, rerender = true) {
      const selected = dayId || warmupSelectedDayId || defaultWarmupDayId();
      warmupSelectedDayId = selected;
      if (!selected) return;
      try {
        warmupResponses = await api(`/api/camp/coach/begin-lesson-responses?dayId=${encodeURIComponent(selected)}`);
        if (rerender && activeView === 'livelesson' && !lessonDraft) {
          const panel = document.getElementById('warmupResponsesPanel');
          if (panel) panel.innerHTML = renderWarmupResponsesPanel();
          else renderLiveLessonWrap();
        }
      } catch (err) {
        warmupResponses = { error: err.message };
      }
    }

    async function publishWarmup() {
      const dayId = warmupSelectedDayId || defaultWarmupDayId();
      if (!dayId) return;
      try {
        await api('/api/camp/coach/warmup/publish', { method: 'POST', body: JSON.stringify({ dayId }) });
        await loadWarmupResponses(dayId);
      } catch (err) { alert(err.message); }
    }
    window.publishWarmup = publishWarmup;

    async function stopWarmup() {
      try {
        await api('/api/camp/coach/warmup/stop', { method: 'POST' });
        await loadWarmupResponses(warmupSelectedDayId);
      } catch (err) { alert(err.message); }
    }
    window.stopWarmup = stopWarmup;

    function renderWarmupResponsesPanel() {
      const days = campDaysForWarmup();
      if (!warmupSelectedDayId) warmupSelectedDayId = defaultWarmupDayId();
      const selectedDay = days.find(day => day.id === warmupSelectedDayId) || days[0];
      const data = warmupResponses && warmupResponses.day?.id === warmupSelectedDayId ? warmupResponses : null;
      const answered = data?.answeredCount || 0;
      const total = data?.totalStudents || 0;
      const published = !!(data && data.published);
      return `
        <div class="warmup-panel" id="warmupResponsesPanel">
          <div class="section-title" style="font-size:18px">Begin Lesson Warm-ups</div>
          <p class="section-sub">Press <strong>Present to students</strong> to send every camper a notification to answer this day's warm-up. Their answers show up here as they come in.</p>
          <div class="form-grid" style="grid-template-columns:minmax(220px,1fr) auto">
            <div>
              <label for="warmupDaySelect">Assignment day</label>
              <select id="warmupDaySelect" onchange="loadWarmupResponses(this.value)">
                ${days.map(day => `<option value="${esc(day.id)}" ${day.id === warmupSelectedDayId ? 'selected' : ''}>${esc(fmt(day.date, { month: 'short', day: 'numeric' }))} - ${esc((day.assignment || day.activity || day.build || 'Assignment').slice(0, 70))}</option>`).join('')}
              </select>
            </div>
            <div class="warmup-actions" style="align-self:end;display:flex;gap:8px">
              ${published
                ? `<button class="btn btn-danger" onclick="stopWarmup()">■ Stop warm-up</button>`
                : `<button class="btn btn-primary" onclick="publishWarmup()">📣 Present to students</button>`}
              <button class="btn btn-ghost" onclick="loadWarmupResponses(warmupSelectedDayId)">Refresh</button>
            </div>
          </div>
          ${published ? `<div class="warmup-live-flag"><span class="live-dot"></span>Live now — campers were notified to answer this warm-up.</div>` : ''}
          ${selectedDay ? `<div class="warmup-summary">
            <span class="status-pill done">${answered} answered</span>
            <span class="status-pill todo">${Math.max(0, total - answered)} waiting</span>
            <span class="status-pill todo">${esc(selectedDay.weekLabel || '')}</span>
          </div>` : ''}
          ${data ? renderWarmupResponseGroups(data) : '<p class="section-sub">Choose a day or press Refresh to load warm-up answers.</p>'}
        </div>
      `;
    }

    function renderWarmupResponseGroups(data) {
      if (data.error) return `<p class="section-sub">${esc(data.error)}</p>`;
      const unanswered = data.unanswered || [];
      const groups = data.byQuestion || [];
      return `
        ${groups.map((group, index) => `
          <div class="warmup-answer">
            <strong>Q${index + 1}: ${esc(group.question)}</strong>
            ${(group.answers || []).length ? group.answers.map(item => `<p><b>${esc(item.studentName)}:</b> ${esc(item.answer)}</p>`).join('') : '<p>No answers yet.</p>'}
          </div>
        `).join('')}
        ${unanswered.length ? `<div class="warmup-answer"><strong>Still waiting</strong><p>${esc(unanswered.map(item => item.name).join(', '))}</p></div>` : ''}
      `;
    }

    // The exact Lesson Building decks (rich HTML slideshows). "Present Live" mirrors
    // the slides to camper iPads and lets the coach push Kahoot questions.
    function renderTeacherDecks() {
      const today = todayKey();
      const days = [];
      (hubData.curriculum || []).forEach(week => (week.days || []).forEach(day => {
        if (day.lessonDeckUrl) days.push({ ...day, weekLabel: week.label });
      }));
      if (!days.length) return '';
      // Catalog so onclick handlers can pass an index (avoids quoting issues in titles).
      teacherDeckList = days.map(d => ({
        lessonDeckUrl: d.lessonDeckUrl,
        title: `${d.weekLabel || ''} · ${d.build || 'Lesson'}`.replace(/^ · /, '')
      }));
      const todayIdx = days.findIndex(d => d.date === today);
      return `
        <div class="card teacher-decks">
          <div class="section-title">📽️ Lesson Slides — present live to campers</div>
          <p class="section-sub">Your exact Lesson Building decks. Click <strong>Present Live</strong> to show the slideshow on the TV <em>and</em> mirror it to every camper's iPad — move with the arrows and push a question whenever you want. (Teacher notes stay hidden on the campers' screens.)</p>
          ${todayIdx >= 0 ? `<button class="btn btn-primary present-today" onclick="startDeckLive(${todayIdx})">▶ Present today's slides live${days[todayIdx].build ? ` — ${esc(days[todayIdx].build)}` : ''}</button>` : ''}
          <div class="deck-list">
            ${days.map((d, i) => `
              <div class="deck-row ${d.date === today ? 'is-today' : ''}">
                <div class="deck-info">
                  <strong>${esc(d.weekLabel)} · ${esc(fmt(d.date, { weekday: 'short', month: 'short', day: 'numeric' }))}${d.date === today ? ' · TODAY' : ''}</strong>
                  <span class="deck-build">${esc(d.build || 'Lesson')}</span>
                </div>
                <div class="deck-row-actions">
                  <button class="btn btn-primary" onclick="startDeckLive(${i})">▶ Present Live</button>
                  <button class="btn btn-ghost" onclick="openQuestionManager('${esc(d.lessonDeckUrl)}')" title="Add, edit, or delete this lesson's questions">❓ Questions (${questionCountForDeck(d.lessonDeckUrl)})</button>
                  <a class="btn btn-ghost" href="${esc(d.lessonDeckUrl)}" target="_blank" rel="noreferrer" title="Open on the TV only (campers won't see it)">TV only ↗</a>
                </div>
              </div>`).join('')}
          </div>
        </div>`;
    }

    function renderLessonList() {
      // One live tool: the real lesson decks (slides + Kahoot questions in a single flow).
      return renderTeacherDecks();
    }

    /* Editor */
    function blankSlide(type) {
      return { id: 'slide-' + Math.random().toString(36).slice(2, 8), type: type || 'content', title: '', body: '', image: '', options: type === 'question' ? ['', ''] : [], correctIndex: type === 'question' ? 0 : -1 };
    }
    function newLesson() {
      lessonDraft = { id: '', title: '', slides: [blankSlide('content')] };
      renderLiveLessonWrap();
    }
    function editLesson(id) {
      const l = lessons.find(x => x.id === id);
      if (!l) return;
      lessonDraft = JSON.parse(JSON.stringify(l));
      renderLiveLessonWrap();
    }
    function cancelEdit() { lessonDraft = null; renderLiveLessonWrap(); }

    function renderSlideEditor(slide, i) {
      const isQ = slide.type === 'question';
      return `
        <div class="slide-editor" data-slide-card="${i}">
          <div class="slide-editor-head">
            <span class="idx">Slide ${i + 1} · ${isQ ? '❓ Question' : '📄 Content'}</span>
            <span style="display:flex;gap:6px">
              <button class="mini-btn" onclick="moveSlide(${i},-1)" ${i === 0 ? 'disabled' : ''}>↑</button>
              <button class="mini-btn" onclick="moveSlide(${i},1)" ${i === lessonDraft.slides.length - 1 ? 'disabled' : ''}>↓</button>
              <button class="mini-btn" style="color:var(--red)" onclick="removeSlide(${i})">✕</button>
            </span>
          </div>
          <label>Slide type</label>
          <select data-field="type" onchange="onSlideTypeChange(${i}, this.value)">
            <option value="content" ${!isQ ? 'selected' : ''}>Content (text / image)</option>
            <option value="question" ${isQ ? 'selected' : ''}>Question (campers answer)</option>
          </select>
          <label>Title</label>
          <input data-field="title" value="${esc(slide.title)}" placeholder="${isQ ? 'Ask the question' : 'Slide heading'}" />
          <label>${isQ ? 'Question details (optional)' : 'Body text'}</label>
          <textarea data-field="body" rows="3" placeholder="${isQ ? 'Extra detail campers should read' : 'What you want campers to read on their iPad'}">${esc(slide.body)}</textarea>
          <label>Image URL (optional)</label>
          <input data-field="image" value="${esc(slide.image)}" placeholder="https://… or /robotics lab/…" />
          ${isQ ? `
            <label>Answer choices (pick the correct one)</label>
            <div data-options>
              ${(slide.options.length ? slide.options : ['', '']).map((opt, j) => `
                <div class="opt-row">
                  <input type="radio" name="correct-${i}" value="${j}" ${slide.correctIndex === j ? 'checked' : ''} title="Mark correct">
                  <input type="text" data-opt="${j}" value="${esc(opt)}" placeholder="Choice ${j + 1}">
                  <button class="opt-x" onclick="removeOption(${i}, ${j})" title="Remove">✕</button>
                </div>`).join('')}
            </div>
            <button class="mini-btn" onclick="addOption(${i})">＋ Add choice</button>
          ` : ''}
        </div>`;
    }

    function renderLessonEditor() {
      return `
        <div class="section-title">${lessonDraft.id ? 'Edit lesson' : 'New lesson'}</div>
        <p class="section-sub">Each slide is shown full-screen on campers' iPads when you present. Question slides give them tappable answers.</p>
        <div class="card" style="margin-bottom:16px">
          <label class="day-edit-date" style="display:block;margin-bottom:6px">Lesson title</label>
          <input id="lessonTitle" value="${esc(lessonDraft.title)}" placeholder="e.g. Day 1: Meet LEGO + Balloon Car"
            style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15px;outline:none" />
        </div>
        <div id="slidesWrap">${lessonDraft.slides.map((s, i) => renderSlideEditor(s, i)).join('')}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 20px">
          <button class="mini-btn" onclick="addSlide('content')">＋ Content slide</button>
          <button class="mini-btn" onclick="addSlide('question')">＋ Question slide</button>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="saveLesson()">Save lesson</button>
          <button class="btn btn-ghost" onclick="cancelEdit()">Cancel</button>
        </div>`;
    }

    function collectDraft() {
      if (!lessonDraft) return;
      const titleEl = document.getElementById('lessonTitle');
      if (titleEl) lessonDraft.title = titleEl.value;
      lessonDraft.slides.forEach((s, i) => {
        const root = document.querySelector(`[data-slide-card="${i}"]`);
        if (!root) return;
        s.type = root.querySelector('[data-field="type"]').value === 'question' ? 'question' : 'content';
        s.title = root.querySelector('[data-field="title"]').value;
        s.body = root.querySelector('[data-field="body"]').value;
        s.image = root.querySelector('[data-field="image"]').value;
        if (s.type === 'question') {
          s.options = [...root.querySelectorAll('[data-opt]')].map(el => el.value);
          const checked = root.querySelector(`input[name="correct-${i}"]:checked`);
          s.correctIndex = checked ? Number(checked.value) : -1;
        } else { s.options = []; s.correctIndex = -1; }
      });
    }
    function onSlideTypeChange(i, val) {
      collectDraft();
      const s = lessonDraft.slides[i];
      if (val === 'question' && (!s.options || !s.options.length)) { s.options = ['', '']; s.correctIndex = 0; }
      renderLiveLessonWrap();
    }
    function addSlide(type) { collectDraft(); lessonDraft.slides.push(blankSlide(type)); renderLiveLessonWrap(); }
    function removeSlide(i) { collectDraft(); if (lessonDraft.slides.length <= 1) { alert('A lesson needs at least one slide.'); return; } lessonDraft.slides.splice(i, 1); renderLiveLessonWrap(); }
    function moveSlide(i, dir) { collectDraft(); const j = i + dir; if (j < 0 || j >= lessonDraft.slides.length) return; const t = lessonDraft.slides[i]; lessonDraft.slides[i] = lessonDraft.slides[j]; lessonDraft.slides[j] = t; renderLiveLessonWrap(); }
    function addOption(i) { collectDraft(); lessonDraft.slides[i].options.push(''); renderLiveLessonWrap(); }
    function removeOption(i, j) { collectDraft(); const s = lessonDraft.slides[i]; if (s.options.length <= 2) { alert('A question needs at least two choices.'); return; } s.options.splice(j, 1); if (s.correctIndex >= s.options.length) s.correctIndex = 0; renderLiveLessonWrap(); }

    async function saveLesson() {
      collectDraft();
      if (!lessonDraft.title.trim()) { alert('Give the lesson a title.'); return; }
      try {
        const res = await api('/api/camp/coach/lessons', { method: 'POST', body: JSON.stringify(lessonDraft) });
        lessons = res.lessons || [];
        lessonDraft = null;
        renderLiveLessonWrap();
        refreshNavBadges();
      } catch (err) { alert(err.message); }
    }
    async function deleteLesson(id) {
      const l = lessons.find(x => x.id === id);
      if (!confirm(`Delete “${l ? l.title : 'this lesson'}”?`)) return;
      try {
        const res = await api(`/api/camp/coach/lessons/${encodeURIComponent(id)}`, { method: 'DELETE' });
        lessons = res.lessons || [];
        renderLiveLessonWrap();
      } catch (err) { alert(err.message); }
    }

    /* Presenter */
    async function presentLesson(id) {
      try {
        const res = await api('/api/camp/coach/live/start', { method: 'POST', body: JSON.stringify({ lessonId: id }) });
        liveState = res.live; lastTally = res.tally || { total: 0, counts: [] };
        lessonDraft = null;
        renderLiveLessonWrap();
        refreshNavBadges();
        startLivePolling();
      } catch (err) { alert(err.message); }
    }
    async function liveGoto(index) {
      try {
        const res = await api('/api/camp/coach/live/goto', { method: 'POST', body: JSON.stringify({ index }) });
        liveState = res.live; lastTally = res.tally || { total: 0, counts: [] };
        renderLiveLessonWrap();
      } catch (err) { alert(err.message); }
    }
    function liveNext() { if (liveState) liveGoto(Math.min(liveState.currentIndex + 1, liveState.slides.length - 1)); }
    function livePrev() { if (liveState) liveGoto(Math.max(liveState.currentIndex - 1, 0)); }
    async function liveStop() {
      if (!confirm('End the live lesson for everyone?')) return;
      try {
        await api('/api/camp/coach/live/stop', { method: 'POST' });
        liveState = { active: false };
        stopLivePolling();
        renderLiveLessonWrap();
        refreshNavBadges();
      } catch (err) { alert(err.message); }
    }

    async function pollLive() {
      try {
        const res = await api('/api/camp/coach/live');
        liveState = res.live; lastTally = res.tally || { total: 0, counts: [] };
        await loadWarmupResponses(warmupSelectedDayId, false);
        if (!liveState.active) { stopLivePolling(); refreshNavBadges(); }
        if (activeView === 'livelesson' && !lessonDraft) renderLiveLessonWrap();
      } catch (err) { /* keep last view */ }
    }
    function startLivePolling() { stopLivePolling(); livePollTimer = setInterval(pollLive, 3000); }
    function stopLivePolling() { if (livePollTimer) { clearInterval(livePollTimer); livePollTimer = null; } }

    // Inner content of #presenterEl — re-rendered in place so fullscreen survives polls/navigation.
    function renderPresenterInner() {
      const s = liveState.slides[liveState.currentIndex] || liveState.slides[0];
      const isQ = s.type === 'question';
      const thumbs = liveState.slides.map((sl, i) =>
        `<button class="thumb ${i === liveState.currentIndex ? 'current' : ''} ${sl.type === 'question' ? 'q' : ''}" onclick="liveGoto(${i})" title="${esc(sl.title || ('Slide ' + (i + 1)))}">${i + 1}</button>`
      ).join('');
      let tallyHtml = '';
      if (isQ) {
        const total = lastTally.total || 0;
        tallyHtml = `<div class="tally">
          ${s.options.map((opt, j) => {
            const c = (lastTally.counts && lastTally.counts[j]) || 0;
            const pct = total ? Math.round((c / total) * 100) : 0;
            const correct = j === s.correctIndex;
            return `<div class="tally-row ${correct ? 'correct' : ''}">
              <div class="tally-label"><span>${correct ? '✓ ' : ''}${esc(opt)}</span><span>${c} (${pct}%)</span></div>
              <div class="tally-bar"><div class="tally-fill" style="width:${pct}%"></div></div>
            </div>`;
          }).join('')}
          <div class="meta" style="font-size:12.5px;color:var(--muted)">${total} camper${total === 1 ? '' : 's'} answered · the ✓ row is the correct choice (campers don't see which is right).</div>
        </div>`;
      }
      return `
        <div class="presenter-bar">
          <div>
            <div class="title">${esc(liveState.lessonTitle)}</div>
            <div class="counter">Slide ${liveState.currentIndex + 1} of ${liveState.slides.length}</div>
          </div>
          <div class="presenter-controls">
            <button class="fs-btn" onclick="toggleFullscreen('presenterEl')" title="Full screen (for the TV)">⛶ Full screen</button>
            <button class="btn btn-ghost" onclick="livePrev()" ${liveState.currentIndex === 0 ? 'disabled' : ''}>◀ Prev</button>
            <button class="btn btn-ghost" onclick="liveNext()" ${liveState.currentIndex >= liveState.slides.length - 1 ? 'disabled' : ''}>Next ▶</button>
            <button class="btn btn-danger" onclick="liveStop()">■ End</button>
          </div>
        </div>
        <div class="slide-show ${isQ ? 'q' : ''}">
          <div class="slide-kicker">${isQ ? '❓ Question' : '📄 ' + ('Slide ' + (liveState.currentIndex + 1))}</div>
          <h2>${esc(s.title) || '<span style=\"color:var(--muted)\">(no title)</span>'}</h2>
          ${s.body ? `<div class="body">${esc(s.body)}</div>` : ''}
          ${s.image ? `<img src="${esc(s.image)}" alt="" onerror="this.style.display='none'">` : ''}
          ${tallyHtml}
        </div>
        <div class="slide-thumbs">${thumbs}</div>`;
    }

    function renderPresenter() {
      return `
        <div class="section-title presenter-heading">🎥 Presenting: ${esc(liveState.lessonTitle)}</div>
        <p class="section-sub presenter-heading"><span class="live-dot"></span>Live now — campers can join from their iPad. Use Prev/Next (or the numbers) to move everyone's screen.</p>
        <div class="presenter" id="presenterEl">${renderPresenterInner()}</div>`;
    }

    /* ── Live HTML-deck presenter (real Lesson Building slides, mirrored to iPads) ── */
    async function startDeckLive(i) {
      const d = teacherDeckList[i];
      if (!d) return;
      try {
        const res = await api('/api/camp/coach/live/start-deck', { method: 'POST', body: JSON.stringify({ deckUrl: d.lessonDeckUrl, deckTitle: d.title }) });
        liveState = res.live;
        deckBank = res.questions || [];
        lastTally = res.tally || { total: 0, counts: [] };
        deckSlideIndex = 0; deckSlideCount = 0; deckQBarSig = '';
        lessonDraft = null;
        // Make sure the Live Lesson view is showing.
        if (activeView !== 'livelesson') showView('livelesson');
        renderLiveLessonWrap();
        refreshNavBadges();
        startLivePolling();
      } catch (err) { alert(err.message); }
    }
    window.startDeckLive = startDeckLive;

    function renderDeckPresenter() {
      return `
        <div class="section-title presenter-heading">🎥 Presenting Live: ${esc(liveState.deckTitle || 'Lesson')}</div>
        <p class="section-sub presenter-heading"><span class="live-dot"></span>Campers are following these slides on their iPads. Move with Prev/Next (swiping the deck also syncs them). Push a question whenever you like.</p>
        <div class="presenter deck-presenter" id="deckPresenterEl">
          <div class="presenter-bar">
            <div>
              <div class="title">${esc(liveState.deckTitle || 'Lesson')}</div>
              <div class="counter" id="deckCounter">Slide ${deckSlideIndex + 1}${deckSlideCount ? ' of ' + deckSlideCount : ''}</div>
            </div>
            <div class="presenter-controls">
              <button class="fs-btn" onclick="toggleFullscreen('deckPresenterEl')" title="Full screen (for the TV)">⛶ Full screen</button>
              <button class="btn btn-ghost" onclick="deckPrev()">◀ Prev</button>
              <button class="btn btn-ghost" onclick="deckNext()">Next ▶</button>
              <button class="btn btn-danger" onclick="deckStop()">■ End</button>
            </div>
          </div>
          <iframe id="deckFrame" class="deck-frame" src="${esc(liveState.deckUrl)}" onload="onDeckFrameLoad()"></iframe>
          <div class="deck-q-bar" id="deckQBar">${renderDeckQBar()}</div>
        </div>`;
    }

    function renderDeckQBar() {
      const aq = liveState.activeQuestion;
      if (aq) {
        const total = lastTally.total || 0;
        const rows = (aq.options || []).map((opt, j) => {
          const c = (lastTally.counts && lastTally.counts[j]) || 0;
          const pct = total ? Math.round((c / total) * 100) : 0;
          const correct = j === aq.correctIndex;
          return `<div class="tally-row ${correct ? 'correct' : ''}">
            <div class="tally-label"><span>${correct ? '✓ ' : ''}${esc(opt)}</span><span>${c} (${pct}%)</span></div>
            <div class="tally-bar"><div class="tally-fill" style="width:${pct}%"></div></div>
          </div>`;
        }).join('');
        return `<div class="deck-q-live">
          <div class="deck-q-head"><strong>❓ ${esc(aq.title)}</strong>
            <button class="btn btn-primary" onclick="deckCloseQuestion()">✓ Reveal &amp; score</button></div>
          ${aq.body ? `<div class="deck-q-body">${esc(aq.body)}</div>` : ''}
          <div class="tally">${rows}
            <div class="meta" style="font-size:12px;color:var(--muted)">${total} camper${total === 1 ? '' : 's'} answered · correct = 5→1 pts (faster earns more), added to their class points. The ✓ row is correct (campers don't see it yet).</div>
          </div>
        </div>`;
      }
      if (!deckBank.length) {
        return `<div class="deck-q-empty">This lesson has no ready-made questions yet. <button class="btn btn-primary" onclick="openQuestionManager(liveState.deckUrl)">➕ Add a question</button></div>`;
      }
      return `<div class="deck-q-push">
        <label for="deckQSelect" class="deck-q-label">Push a question to campers (Kahoot-style):</label>
        <div class="deck-q-push-row">
          <select id="deckQSelect">${deckBank.map((q, i) => `<option value="${esc(q.id)}">Q${i + 1}: ${esc((q.body || q.title || 'Question').slice(0, 80))}</option>`).join('')}</select>
          <button class="btn btn-primary" onclick="deckPushQuestion()">❓ Push question</button>
          <button class="btn btn-ghost" onclick="openQuestionManager(liveState.deckUrl)" title="Add, edit, or delete this lesson's questions">✏️ Manage questions</button>
        </div>
      </div>`;
    }

    function updateDeckCounter() {
      const c = document.getElementById('deckCounter');
      if (c) c.textContent = 'Slide ' + (deckSlideIndex + 1) + (deckSlideCount ? ' of ' + deckSlideCount : '');
    }
    function updateDeckDynamic() {
      updateDeckCounter();
      const qb = document.getElementById('deckQBar');
      if (!qb) return;
      const aq = liveState.activeQuestion;
      if (aq) { qb.innerHTML = renderDeckQBar(); deckQBarSig = 'active:' + aq.id; }
      else {
        const sig = 'push:' + deckBank.length;
        if (sig !== deckQBarSig) { qb.innerHTML = renderDeckQBar(); deckQBarSig = sig; }
      }
    }

    function deckFrameDoc() {
      const f = document.getElementById('deckFrame');
      try { return f && f.contentDocument; } catch (e) { return null; }
    }
    function deckEl() { const d = deckFrameDoc(); return d && d.querySelector('.deck'); }

    function onDeckFrameLoad() {
      const d = deckFrameDoc();
      if (!d) return;
      const deck = d.querySelector('.deck');
      if (!deck) return;
      deckSlideCount = d.querySelectorAll('.slide').length || 0;
      // restore the coach's place (e.g. after a re-render), then report to the server
      const w = deck.clientWidth || 1;
      deck.scrollTo({ left: deckSlideIndex * w, behavior: 'auto' });
      updateDeckCounter();
      postDeckSlide(deckSlideIndex, deckSlideCount);
      // teacher swiping/scrolling the deck itself also syncs the campers
      let t = null;
      deck.addEventListener('scroll', () => {
        if (t) clearTimeout(t);
        t = setTimeout(() => {
          const cw = deck.clientWidth || 1;
          const max = deckSlideCount ? deckSlideCount - 1 : 9999;
          const idx = Math.max(0, Math.min(max, Math.round(deck.scrollLeft / cw)));
          if (idx !== deckSlideIndex) { deckSlideIndex = idx; updateDeckCounter(); postDeckSlide(idx, deckSlideCount); }
        }, 160);
      });
    }
    window.onDeckFrameLoad = onDeckFrameLoad;

    function deckGoto(i) {
      const deck = deckEl();
      const max = deckSlideCount ? deckSlideCount - 1 : i;
      i = Math.max(0, Math.min(i, max));
      deckSlideIndex = i;
      if (deck) { const w = deck.clientWidth || 1; deck.scrollTo({ left: i * w, behavior: 'smooth' }); }
      updateDeckCounter();
      postDeckSlide(i, deckSlideCount);
    }
    function deckNext() { deckGoto(deckSlideIndex + 1); }
    function deckPrev() { deckGoto(deckSlideIndex - 1); }
    window.deckNext = deckNext; window.deckPrev = deckPrev;

    async function postDeckSlide(index, slideCount) {
      try { await api('/api/camp/coach/live/slide', { method: 'POST', body: JSON.stringify({ index, slideCount }) }); } catch (e) { /* keep going */ }
    }

    async function deckPushQuestion() {
      const sel = document.getElementById('deckQSelect');
      if (!sel) return;
      try {
        const res = await api('/api/camp/coach/live/push-question', { method: 'POST', body: JSON.stringify({ questionId: sel.value }) });
        liveState = res.live; lastTally = res.tally || { total: 0, counts: [] };
        updateDeckDynamic();
      } catch (err) { alert(err.message); }
    }
    window.deckPushQuestion = deckPushQuestion;

    async function deckCloseQuestion() {
      try {
        const res = await api('/api/camp/coach/live/close-question', { method: 'POST' });
        liveState = res.live; lastTally = res.tally || { total: 0, counts: [] };
        if (res.awarded && res.awarded.length && typeof playPointSound === 'function') playPointSound(true);
        updateDeckDynamic();
      } catch (err) { alert(err.message); }
    }
    window.deckCloseQuestion = deckCloseQuestion;

    async function deckStop() {
      if (!confirm('End the live presentation for everyone?')) return;
      try {
        await api('/api/camp/coach/live/stop', { method: 'POST' });
        liveState = { active: false };
        stopLivePolling();
        renderLiveLessonWrap();
        refreshNavBadges();
      } catch (err) { alert(err.message); }
    }
    window.deckStop = deckStop;

    /* ── Question Manager: add / edit / delete Kahoot questions (saved to the lesson) ── */
    let qmDeckUrl = '';
    let qmMode = 'list';            // 'list' | 'form'
    let qmForm = null;             // { id, body, options:[], correctIndex }

    function qmLessonFor(deckUrl) {
      return lessons.find(l => l.deckUrl === deckUrl) || (liveState && liveState.lessonId && lessons.find(l => l.id === liveState.lessonId)) || null;
    }
    function qmQuestions(lesson) {
      return (lesson && lesson.slides ? lesson.slides : []).filter(s => s.type === 'question');
    }
    function questionCountForDeck(deckUrl) {
      const lesson = lessons.find(l => l.deckUrl === deckUrl);
      return lesson ? qmQuestions(lesson).length : 0;
    }
    function refreshDeckBankFromLessons() {
      if (!liveState || liveState.kind !== 'deck') return;
      const lesson = qmLessonFor(liveState.deckUrl);
      deckBank = lesson ? qmQuestions(lesson).filter(s => s.correctIndex >= 0).map(s => ({ id: s.id, title: s.title, body: s.body, options: s.options })) : [];
      deckQBarSig = '';
      updateDeckDynamic();
    }

    function openQuestionManager(deckUrl) {
      const lesson = qmLessonFor(deckUrl);
      if (!lesson) { alert('This deck isn’t linked to a question bank yet, so questions can’t be edited here.'); return; }
      qmDeckUrl = lesson.deckUrl || deckUrl;
      qmMode = 'list';
      qmForm = null;
      document.getElementById('qmTitle').textContent = '❓ Questions · ' + (lesson.title || 'Lesson');
      document.getElementById('qmOverlay').classList.add('open');
      renderQuestionManager();
    }
    window.openQuestionManager = openQuestionManager;

    function closeQuestionManager() {
      document.getElementById('qmOverlay').classList.remove('open');
      qmForm = null; qmMode = 'list';
    }
    window.closeQuestionManager = closeQuestionManager;

    function renderQuestionManager() {
      const body = document.getElementById('qmBody');
      const lesson = qmLessonFor(qmDeckUrl);
      if (!lesson) { body.innerHTML = '<div class="qm-empty">Lesson not found.</div>'; return; }
      if (qmMode === 'form') { body.innerHTML = renderQmForm(); return; }
      const qs = qmQuestions(lesson);
      body.innerHTML = `
        <div class="qm-toolbar">
          <span class="qm-count">${qs.length} question${qs.length === 1 ? '' : 's'} · reused every time you present</span>
          <button class="btn btn-primary" onclick="qmShowForm()">➕ Add question</button>
        </div>
        ${qs.length ? `<div class="qm-list">${qs.map(q => `
          <div class="qm-row">
            <div class="qm-q">
              <strong>${esc(q.body || q.title || 'Question')}</strong>
              <div class="qm-correct">✓ ${esc((q.options || [])[q.correctIndex] || 'no correct answer set')}</div>
            </div>
            <div class="qm-acts">
              <button class="btn btn-ghost" onclick="qmShowForm('${esc(q.id)}')">✏️ Edit</button>
              <button class="btn btn-danger" onclick="qmDelete('${esc(q.id)}')">🗑</button>
            </div>
          </div>`).join('')}</div>`
          : `<div class="qm-empty">No questions yet. Click <strong>Add question</strong> to make your first one.</div>`}
      `;
    }

    function qmShowForm(id) {
      const lesson = qmLessonFor(qmDeckUrl);
      const existing = id ? qmQuestions(lesson).find(q => q.id === id) : null;
      qmForm = existing
        ? { id: existing.id, body: existing.body || existing.title || '', options: (existing.options || []).slice(), correctIndex: existing.correctIndex >= 0 ? existing.correctIndex : 0 }
        : { id: '', body: '', options: ['', '', '', ''], correctIndex: 0 };
      qmMode = 'form';
      renderQuestionManager();
    }
    window.qmShowForm = qmShowForm;

    function renderQmForm() {
      const f = qmForm;
      return `
        <label for="qmBodyInput">Question</label>
        <textarea id="qmBodyInput" placeholder="e.g. Why does a wide base help a tall tower?" oninput="qmForm.body=this.value">${esc(f.body)}</textarea>
        <label>Answer choices <span style="font-weight:600;color:var(--muted)">(tap the circle to mark the correct one)</span></label>
        ${f.options.map((opt, i) => `
          <div class="qm-opt">
            <label class="qm-correct-pick" title="Mark as correct">
              <input type="radio" name="qmCorrect" ${i === f.correctIndex ? 'checked' : ''} onclick="qmForm.correctIndex=${i}">
              ✓
            </label>
            <input type="text" value="${esc(opt)}" placeholder="Choice ${String.fromCharCode(65 + i)}" oninput="qmForm.options[${i}]=this.value">
            ${f.options.length > 2 ? `<button type="button" class="qm-del-opt" title="Remove choice" onclick="qmRemoveOption(${i})">✕</button>` : ''}
          </div>`).join('')}
        ${f.options.length < 6 ? `<button type="button" class="btn btn-ghost qm-add-opt" onclick="qmAddOption()">＋ Add choice</button>` : ''}
        <div class="qm-hint">Campers earn 5→1 points for the correct answer (faster = more). Need 2–6 choices.</div>
        <div class="qm-form-actions">
          <button class="btn btn-primary" onclick="qmSave()">💾 Save question</button>
          <button class="btn btn-ghost" onclick="qmCancelForm()">Cancel</button>
        </div>
      `;
    }

    function qmAddOption() { if (qmForm.options.length < 6) { qmForm.options.push(''); renderQuestionManager(); } }
    window.qmAddOption = qmAddOption;
    function qmRemoveOption(i) {
      if (qmForm.options.length <= 2) return;
      qmForm.options.splice(i, 1);
      if (qmForm.correctIndex >= qmForm.options.length) qmForm.correctIndex = qmForm.options.length - 1;
      else if (qmForm.correctIndex > i) qmForm.correctIndex--;
      renderQuestionManager();
    }
    window.qmRemoveOption = qmRemoveOption;
    function qmCancelForm() { qmMode = 'list'; qmForm = null; renderQuestionManager(); }
    window.qmCancelForm = qmCancelForm;

    async function qmSaveLesson(lesson) {
      const res = await api('/api/camp/coach/lessons', { method: 'POST', body: JSON.stringify(lesson) });
      lessons = res.lessons || lessons;
      refreshDeckBankFromLessons();
      // keep the deck list question counts fresh when not presenting
      if (!(liveState && liveState.active)) renderLiveLessonWrap();
    }

    async function qmSave() {
      const lesson = qmLessonFor(qmDeckUrl);
      if (!lesson) return;
      const body = (qmForm.body || '').trim();
      const options = qmForm.options.map(o => (o || '').trim()).filter(Boolean);
      if (!body) { alert('Please type the question.'); return; }
      if (options.length < 2) { alert('Please give at least 2 answer choices.'); return; }
      // correctIndex points into the *original* list; remap after trimming empties.
      let correctIndex = qmForm.correctIndex;
      const trimmedCorrectVal = (qmForm.options[qmForm.correctIndex] || '').trim();
      correctIndex = Math.max(0, options.indexOf(trimmedCorrectVal));
      const slide = { id: qmForm.id || ('q-' + Date.now().toString(36)), type: 'question', title: body.slice(0, 60), body, image: '', options, correctIndex };
      const slides = lesson.slides.slice();
      const idx = qmForm.id ? slides.findIndex(s => s.id === qmForm.id) : -1;
      if (idx >= 0) slides[idx] = slide; else slides.push(slide);
      try {
        await qmSaveLesson({ ...lesson, slides });
        qmMode = 'list'; qmForm = null;
        renderQuestionManager();
      } catch (err) { alert(err.message); }
    }
    window.qmSave = qmSave;

    async function qmDelete(id) {
      const lesson = qmLessonFor(qmDeckUrl);
      if (!lesson) return;
      if (!confirm('Delete this question? This removes it from the lesson for next time too.')) return;
      const slides = lesson.slides.filter(s => s.id !== id);
      try {
        await qmSaveLesson({ ...lesson, slides });
        renderQuestionManager();
      } catch (err) { alert(err.message); }
    }
    window.qmDelete = qmDelete;

    async function load() {
      try {
        const [hubResult, rosterResult, progressResult, printResult, projectResult] = await Promise.all([
          api('/api/camp/hub-data'),
          api('/api/camp/coach/roster'),
          api('/api/camp/coach/progress'),
          api('/api/camp/coach/print-requests'),
          api('/api/camp/coach/projects')
        ]);
        hubData = hubResult.data;
        roster = rosterResult.users || [];
        progressData = progressResult || { students: [], days: [], submissions: [] };
        printQueue = printResult.requests || [];
        projectQueue = projectResult.projects || [];
        classroomState = hubData.classroom || classroomState;
        renderShell();
        refreshProgressView();
        loadLessons();
      } catch (err) {
        if (err.message !== 'Login required') {
          app.innerHTML = `<div class="loading-state"><p class="loading-text">${esc(err.message)}</p></div>`;
        }
      }
    }

    logoutButton.addEventListener('click', async () => {
      await fetch('/api/camp/logout', { method: 'POST' });
      window.location.href = '/camp-hub/login';
    });

    document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);
    window.addEventListener('beforeunload', stopLivePolling);

    function toggleFullscreen(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const doc = document;
      if (doc.fullscreenElement || doc.webkitFullscreenElement) {
        (doc.exitFullscreen || doc.webkitExitFullscreen || function(){}).call(doc);
      } else {
        (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
      }
    }
    window.toggleFullscreen = toggleFullscreen;

    setInterval(tickCoachTimer, 1000);

    load();
  </script>
</body>
</html>
