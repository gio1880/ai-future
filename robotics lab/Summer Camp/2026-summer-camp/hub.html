<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Summer Camp Hub | AI Future</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b2a4a" />
  <link rel="icon" href="/ai%20future%20logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="image" href="/robotics%20lab/Summer%20Camp/2026-summer-camp/assets/hero.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* AI Future brand palette (see index.html) */
      --sun: #f97316;
      --sun-deep: #0b2a4a;
      --sun-light: #fff4e8;
      --sun-mid: #fdd9b5;
      --gold: #fece00;
      --sky: #1767b4;
      --sky-light: #e3effd;
      --grass: #16a34a;
      --grass-light: #e7f7ec;
      --purple: #7c51d4;
      --purple-light: #f0ebfd;
      --ink: #10233f;
      --muted: #5f6c80;
      --line: #dce5ef;
      --bg: #f7f8fa;
      --white: #ffffff;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 20px rgba(11, 42, 74, 0.08);
      --shadow-hover: 0 8px 32px rgba(11, 42, 74, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,0.94);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand { display: flex; align-items: center; gap: 11px; }

    .brand img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 4px;
      background: white;
    }

    .brand-text strong { display: block; font-size: 15px; font-weight: 800; }
    .brand-text span { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }

    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .chip {
      padding: 6px 12px;
      border-radius: 50px;
      border: 1.5px solid var(--line);
      font-size: 13px;
      font-weight: 700;
      background: white;
      color: var(--muted);
    }

    .chip.sun { background: var(--sun-light); border-color: var(--sun-mid); color: var(--sun-deep); }

    .btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 0;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      background: var(--ink);
      color: white;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.82; }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    .hero-card {
      border-radius: var(--radius);
      overflow: hidden;
      background:
        linear-gradient(140deg, rgba(7, 20, 38, 0.92) 0%, rgba(23, 103, 180, 0.72) 100%),
        url("/robotics%20lab/Summer%20Camp/2026-summer-camp/assets/hero.jpg") center / cover;
      color: white;
      padding: clamp(28px, 5vw, 52px);
      margin-bottom: 28px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 28px;
      align-items: center;
    }

    .hero-eyebrow {
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.72);
      margin-bottom: 10px;
    }

    .hero-title {
      font-size: clamp(36px, 7.5vw, 64px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.02em;
    }

    .hero-title em { font-style: normal; color: var(--gold); }

    .hero-sub {
      font-size: 16px;
      line-height: 1.65;
      color: rgba(255,255,255,0.88);
      margin-top: 14px;
      max-width: 540px;
    }

    .hero-date-badge {
      background: rgba(255,255,255,0.18);
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: var(--radius-sm);
      padding: 18px 22px;
      text-align: center;
      white-space: nowrap;
    }

    .hero-date-badge .date-label {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.65);
      margin-bottom: 6px;
    }

    .hero-date-badge .date-val { font-size: 18px; font-weight: 900; }

    .focus-banner {
      background: #fff7d6;
      border: 2px solid #f5d96e;
      border-radius: var(--radius);
      padding: 22px 26px;
      margin-bottom: 28px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }

    .focus-icon { font-size: 36px; line-height: 1; flex-shrink: 0; margin-top: 2px; }

    .focus-body strong {
      display: block;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8a6a00;
      margin-bottom: 4px;
    }

    .focus-body h2 { font-size: 20px; font-weight: 900; color: #5a4400; margin-bottom: 6px; }
    .focus-body p { font-size: 15px; color: #6b5200; line-height: 1.6; }

    .focus-build-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1.5px solid #f0dc8e;
      border-radius: 50px;
      padding: 5px 13px;
      font-size: 13px;
      font-weight: 800;
      color: #8a6a00;
      margin-top: 10px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-sub { font-size: 14px; color: var(--muted); margin-bottom: 18px; }

    .progress-card {
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 24px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    .progress-card .big-num {
      font-size: 38px;
      font-weight: 900;
      color: var(--sun-deep);
      line-height: 1;
    }

    .progress-card .label { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }

    .progress-track {
      flex: 1;
      min-width: 200px;
      height: 12px;
      background: var(--sun-light);
      border-radius: 50px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 50px;
      background: linear-gradient(90deg, var(--gold), var(--sun));
      transition: width 0.5s ease;
    }

    .week-card {
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      overflow: hidden;
    }

    .week-card.is-current { border-color: var(--sun); box-shadow: var(--shadow-hover); }

    .week-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 22px;
      cursor: pointer;
      user-select: none;
      flex-wrap: wrap;
    }

    .week-card.is-current .week-head {
      background: linear-gradient(135deg, var(--sun-light), white);
    }

    .week-label {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .week-num {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--sun-light);
      color: var(--sun-deep);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 15px;
      flex-shrink: 0;
    }

    .week-card.is-current .week-num { background: var(--sun); color: white; }
    .week-card.is-past .week-num { background: var(--grass-light); color: var(--grass); }

    .week-title { font-size: 17px; font-weight: 900; }
    .week-dates { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: 2px; }

    .week-badge {
      padding: 5px 12px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .week-badge.now { background: var(--sun); color: white; }
    .week-badge.done { background: var(--grass-light); color: var(--grass); }
    .week-badge.soon { background: var(--sky-light); color: var(--sky); }

    .week-toggle {
      font-size: 18px;
      font-weight: 900;
      color: var(--sun-deep);
      margin-left: auto;
    }

    .week-body { display: none; border-top: 1px solid var(--line); }
    .week-card.open .week-body { display: block; }

    .week-goal {
      padding: 12px 22px;
      background: var(--bg);
      font-size: 13.5px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }

    .day-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
    }

    .day-row:last-child { border-bottom: 0; }
    .day-row.is-today { background: var(--sun-light); }
    .day-row.is-past { opacity: 0.6; }

    .day-date {
      flex-shrink: 0;
      width: 76px;
      text-align: center;
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 6px;
    }

    .day-row.is-today .day-date { border-color: var(--sun); }

    .day-date .dow {
      font-size: 10.5px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .day-date .dom { font-size: 19px; font-weight: 900; margin-top: 1px; }

    .day-info { flex: 1; min-width: 0; }

    .day-activity { font-size: 14px; line-height: 1.55; }
    .day-activity.empty { color: var(--muted); font-style: italic; }

    .day-build {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      background: var(--sky-light);
      color: var(--sky);
      border-radius: 50px;
      padding: 4px 11px;
      font-size: 12px;
      font-weight: 800;
    }

    .today-tag {
      display: inline-block;
      background: var(--sun);
      color: white;
      border-radius: 50px;
      padding: 2px 9px;
      font-size: 10.5px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .assignment-table-wrap {
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow-x: auto;
      margin-bottom: 28px;
    }

    .assignment-table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
    }

    .assignment-table th,
    .assignment-table td {
      text-align: left;
      vertical-align: top;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px;
      line-height: 1.5;
    }

    .assignment-table th {
      background: var(--sun-light);
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .assignment-table tr:last-child td { border-bottom: 0; }
    .assignment-table tr.is-today { background: #fffaf0; }
    .assignment-table tr.is-past { opacity: 0.72; }

    .assignment-date { font-weight: 900; color: var(--sun-deep); white-space: nowrap; }
    .assignment-week { color: var(--muted); font-size: 12px; font-weight: 800; margin-top: 3px; }
    .assignment-title { font-weight: 900; color: var(--ink); margin-bottom: 4px; }
    .assignment-build { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 800; color: var(--sky); }
    .student-menu {
      position: sticky;
      top: 65px;
      z-index: 15;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      margin: -12px 0 24px;
      padding: 8px 0;
      background: linear-gradient(180deg, var(--bg) 72%, rgba(247,248,250,0));
    }
    .student-menu::-webkit-scrollbar { display: none; }
    .student-menu a {
      flex: none;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 3px 12px rgba(11,42,74,0.06);
    }
    .student-menu a:hover { border-color: var(--sun); color: var(--sun-deep); }
    .begin-btn {
      margin-top: 10px;
      border: 0;
      border-radius: 999px;
      background: var(--sun);
      color: var(--sun-deep);
      font-weight: 900;
      font-size: 13px;
      padding: 9px 14px;
      cursor: pointer;
      min-height: 40px;
    }
    .begin-btn:hover { filter: brightness(0.96); }
    .begin-status {
      display: inline-flex;
      margin-top: 8px;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 900;
      background: var(--grass-light);
      color: var(--grass);
    }
    .begin-card {
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 24px;
      margin-bottom: 28px;
    }
    .begin-card.is-ready { border-color: #bce5c8; background: linear-gradient(180deg, #fff, var(--grass-light)); }
    .begin-kicker {
      color: var(--sun-deep);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .begin-title { font-size: 22px; font-weight: 900; margin-bottom: 8px; }
    .begin-question { margin-top: 16px; }
    .begin-question label { display: block; font-weight: 900; margin-bottom: 7px; }
    .begin-question textarea {
      width: 100%;
      min-height: 82px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px 13px;
      font: inherit;
      resize: vertical;
      outline: none;
    }
    .begin-question textarea:focus { border-color: var(--sky); box-shadow: 0 0 0 4px rgba(23,103,180,0.12); }
    .begin-waiting {
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 14px;
      background: #fff;
      border: 1.5px solid #bce5c8;
      color: #14663b;
      font-weight: 800;
      line-height: 1.5;
    }
    .anchor-section { scroll-margin-top: 126px; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 50px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }
    .status-pill.done { background: var(--grass-light); color: var(--grass); }
    .status-pill.todo { background: var(--sky-light); color: var(--sky); }

    .mini-link {
      display: inline-flex;
      align-items: center;
      margin-top: 8px;
      color: var(--sun-deep);
      font-weight: 900;
      font-size: 12.5px;
    }

    .submit-card {
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin: 28px 0;
    }

    .submit-card label {
      display: block;
      font-size: 12px;
      font-weight: 900;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 14px 0 6px;
    }

    .submit-card select,
    .submit-card textarea,
    .submit-card input[type="file"] {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      background: white;
      color: var(--ink);
      outline: none;
    }

    .submit-card textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
    .submit-card select:focus, .submit-card textarea:focus { border-color: var(--sun); }

    .photo-guidance {
      background: var(--sky-light);
      color: var(--sun-deep);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 13.5px;
      line-height: 1.5;
      margin-top: 10px;
      font-weight: 700;
    }

    .form-status {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
    }

    .submission-preview {
      margin-top: 16px;
      display: grid;
      gap: 10px;
    }

    .submission-preview img {
      max-width: 220px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
    }

    .points-card {
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 24px;
    }

    .points-total {
      font-size: 42px;
      line-height: 1;
      font-weight: 900;
      color: var(--sun-deep);
    }

    .points-breakdown {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .point-feed {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .point-event {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      background: #fbfcfd;
      font-size: 13px;
    }

    .point-event strong { display: block; }
    .point-event span { color: var(--muted); }
    .point-value { font-weight: 900; color: var(--grass); white-space: nowrap; }
    .point-value.negative { color: #b42318; }

    .print-request-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .print-request-item {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px;
      background: #fbfcfd;
    }

    .print-request-item strong { display: block; margin-bottom: 4px; }
    .print-request-item p { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 6px; }

    .classroom-card {
      background: white;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 24px;
    }

    .classroom-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .classroom-tile {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 13px;
      background: #fbfcfd;
    }

    .classroom-tile strong { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .timer-readout { font-size: 30px; font-weight: 900; color: var(--sun-deep); }
    .group-list { display: grid; gap: 10px; margin-top: 14px; }
    .group-item { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; background: #fbfcfd; }
    .group-item h4 { margin: 0 0 5px; font-size: 15px; }
    .group-item p { margin: 5px 0; color: var(--muted); font-size: 13px; line-height: 1.45; }

    .resource-category { margin-bottom: 26px; }

    .cat-label {
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--line);
    }

    .resource-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .resource-card {
      background: white;
      border-radius: var(--radius);
      border: 1.5px solid var(--line);
      padding: 18px;
      box-shadow: var(--shadow);
      transition: box-shadow 0.18s, transform 0.18s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .resource-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }

    .resource-name { font-size: 15px; font-weight: 800; line-height: 1.35; }

    .resource-type-badge {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 9px;
      border-radius: 50px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .type-Website { background: var(--sky-light); color: var(--sky); }
    .type-Video   { background: #fdeee9; color: #e8583a; }
    .type-Reading { background: var(--grass-light); color: var(--grass); }
    .type-Folder  { background: var(--purple-light); color: var(--purple); }

    .resource-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .resource-desc { font-size: 13px; color: var(--muted); line-height: 1.55; }

    .resource-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 800;
      color: var(--sun-deep);
      margin-top: auto;
    }

    .announce-list { display: grid; gap: 14px; }

    .announce-card {
      background: white;
      border-radius: var(--radius);
      border: 1.5px solid var(--line);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .announce-card.coach-only { border-left: 4px solid var(--sun); }

    .announce-date {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }

    .announce-title { font-size: 16px; font-weight: 900; margin-bottom: 6px; }
    .announce-body { font-size: 14px; color: var(--muted); line-height: 1.6; }

    .main-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) 330px;
      gap: 28px;
      align-items: start;
    }

    .loading-state {
      min-height: 60vh;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .loading-spinner {
      font-size: 48px;
      animation: spin 1.5s linear infinite;
      display: block;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-size: 16px; font-weight: 700; color: var(--muted); }

    @media (max-width: 900px) {
      .main-layout { grid-template-columns: 1fr; }
      .hero-card { grid-template-columns: 1fr; }
      .hero-date-badge { align-self: flex-start; }
    }

    @media (max-width: 580px) {
      .page { padding-inline: 14px; }
      .hero-card { padding: 24px 20px; }
      .day-row { flex-direction: column; gap: 10px; }
      .day-date { width: 100%; display: flex; gap: 10px; align-items: baseline; justify-content: center; }
    }

    /* Touch devices (iPad/phone): comfortable tap targets, no tap flash or hover-only effects */
    @media (pointer: coarse) {
      body { -webkit-tap-highlight-color: transparent; }
      .btn, .chip { min-height: 44px; display: inline-flex; align-items: center; }
      .week-head { padding: 20px 22px; }
      .resource-link { padding: 8px 0; }
      .resource-card:hover { transform: none; }
    }

    /* ── Live lesson: join banner ── */
    .live-banner {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
      background: linear-gradient(135deg, var(--sun-deep), #14365a);
      color: #fff; padding: 16px 20px;
      display: none; align-items: center; gap: 14px; justify-content: center; flex-wrap: wrap;
      box-shadow: 0 -6px 24px rgba(7,20,38,0.25);
    }
    .live-banner.show { display: flex; }
    .live-banner .lb-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff5a5a; animation: lvpulse 1.2s infinite; }
    @keyframes lvpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .live-banner .lb-text { font-weight: 800; font-size: 15px; }
    .live-banner .lb-join {
      background: var(--gold); color: var(--sun-deep); border: 0; border-radius: 50px;
      font-weight: 900; font-size: 16px; padding: 12px 26px; cursor: pointer; min-height: 48px;
    }
    .live-banner .lb-join:hover { background: #ffd84d; }
    .warmup-banner { background: linear-gradient(135deg, #1f8a4c, #0f6b39); }

    /* ── Live lesson: full-screen camper view ── */
    .live-overlay {
      position: fixed; inset: 0; z-index: 100; background: var(--bg);
      display: none; flex-direction: column;
    }
    .live-overlay.show { display: flex; }
    .lo-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 18px; background: var(--sun-deep); color: #fff; flex-shrink: 0;
    }
    .lo-bar .lo-title { font-weight: 900; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .lo-bar .lo-actions { display: flex; gap: 8px; }
    .lo-btn {
      background: rgba(255,255,255,0.16); color: #fff; border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 10px; font-weight: 800; font-size: 14px; padding: 10px 16px; cursor: pointer; min-height: 46px;
    }
    .lo-btn:hover { background: rgba(255,255,255,0.28); }
    .lo-btn.gold { background: var(--gold); color: var(--sun-deep); border-color: var(--gold); }
    .lo-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: clamp(20px, 4vw, 48px); display: flex; flex-direction: column; }
    .lo-content { max-width: 760px; margin: 0 auto; width: 100%; }
    .lo-kicker { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sun-deep); margin-bottom: 10px; }
    .lo-content h1 { font-size: clamp(26px, 5vw, 42px); font-weight: 900; line-height: 1.12; margin-bottom: 16px; }
    .lo-content .lo-text { font-size: clamp(18px, 2.6vw, 24px); line-height: 1.6; white-space: pre-wrap; color: var(--ink); }
    .lo-content img { max-width: 100%; max-height: 46vh; border-radius: 14px; margin-top: 18px; border: 1px solid var(--line); }
    .lo-counter { text-align: center; color: var(--muted); font-weight: 800; font-size: 13px; padding: 10px; flex-shrink: 0; }

    .lo-answers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 26px; }
    .lo-answer {
      display: flex; align-items: center; gap: 12px; text-align: left;
      border: 0; border-radius: 16px; padding: 22px 20px; cursor: pointer;
      font-size: clamp(17px, 2.4vw, 22px); font-weight: 800; color: #fff; min-height: 84px;
      transition: transform 0.1s, box-shadow 0.15s; box-shadow: 0 4px 14px rgba(7,20,38,0.12);
    }
    .lo-answer:hover { transform: translateY(-2px); }
    .lo-answer .lo-key { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,0.25); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
    .lo-answer.a0 { background: #e8583a; }
    .lo-answer.a1 { background: #1767b4; }
    .lo-answer.a2 { background: #f59e0b; }
    .lo-answer.a3 { background: #16a34a; }
    .lo-answer.a4 { background: #7c51d4; }
    .lo-answer.a5 { background: #0ea5e9; }
    .lo-answer.chosen { outline: 5px solid var(--sun-deep); }
    .lo-answer.dim { opacity: 0.5; }
    .lo-answered-msg {
      margin-top: 22px; background: var(--grass-light); border: 1.5px solid #bce5c8; color: #14663b;
      border-radius: 14px; padding: 16px 18px; font-size: 17px; font-weight: 800; text-align: center;
    }
    .lo-waiting { text-align: center; color: var(--muted); margin-top: 12vh; }
    .lo-waiting .big { font-size: 52px; display: block; margin-bottom: 14px; }
    @media (max-width: 520px) { .lo-answers { grid-template-columns: 1fr; } }

    /* Deck-follow mode: campers mirror the real lesson slides + Kahoot question overlay */
    .lo-body.deck { padding: 0; }
    .lo-deck-wrap { position: relative; flex: 1; width: 100%; height: 100%; min-height: 0; }
    .lo-deck-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #8fc4f4; }
    .lo-q-layer {
      position: absolute; inset: 0; z-index: 5; display: none;
      background: rgba(7, 20, 38, 0.82); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
      align-items: center; justify-content: center; padding: clamp(16px, 4vw, 40px); overflow-y: auto;
    }
    .lo-q-layer.show { display: flex; }
    .lo-q-card { max-width: 760px; width: 100%; background: #fff; border-radius: 22px; padding: clamp(22px, 4vw, 40px); box-shadow: 0 24px 60px rgba(7,20,38,0.4); }
    .lo-q-card h1 { font-size: clamp(24px, 4.6vw, 40px); font-weight: 900; line-height: 1.12; margin: 4px 0 14px; }
    .lo-q-card .lo-text { font-size: clamp(17px, 2.5vw, 23px); line-height: 1.5; color: var(--ink); }
    .lo-q-card.result { text-align: center; }
    .lo-q-card.result .big { font-size: 64px; display: block; margin-bottom: 8px; }
    .lo-q-card.result.good { border: 4px solid var(--grass); }
    .lo-q-card.result.bad { border: 4px solid #e8583a; }

    /* ── ClassDojo-style cartoon class board (camper view) ── */
    .monster-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 14px; margin-top: 6px;
    }
    .monster-card {
      background: #fff; border: 1.5px solid var(--line); border-radius: 18px;
      padding: 12px 8px 14px; text-align: center; box-shadow: var(--shadow);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      transition: transform 0.12s, box-shadow 0.15s;
    }
    .monster-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
    .monster-card.is-me {
      border-color: var(--gold); background: linear-gradient(180deg, var(--sun-light), #fff);
      box-shadow: 0 0 0 2px var(--gold);
    }
    .monster-points {
      min-width: 40px; padding: 3px 12px; border-radius: 50px;
      background: var(--sun-deep); color: #fff; font-weight: 900; font-size: 17px;
      font-variant-numeric: tabular-nums;
    }
    .monster-card.is-me .monster-points { background: var(--sun); color: var(--sun-deep); }
    .monster-char { width: 72px; height: 74px; }
    .monster-name { font-size: 13px; font-weight: 800; color: var(--ink); line-height: 1.25; }
    .me-tag {
      display: inline-block; background: var(--gold); color: var(--sun-deep);
      border-radius: 50px; font-size: 10px; font-weight: 900; padding: 1px 7px; margin-left: 2px;
      text-transform: uppercase; letter-spacing: 0.04em; vertical-align: middle;
    }
    @media (max-width: 520px) { .monster-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); } .monster-char { width: 60px; height: 62px; } }
  </style>
  <link rel="stylesheet" href="/assets/css/af-hub-system.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="/ai%20future%20logo.png" alt="AI Future" />
        <div class="brand-text">
          <strong>Summer Camp Hub</strong>
          <span id="userLine">Loading…</span>
        </div>
      </div>
      <div class="topbar-right">
        <span class="chip sun" id="rolePill">Camper</span>
        <button class="btn" id="logoutButton">Sign out</button>
      </div>
    </div>
  </header>

  <main class="page" id="app">
    <div class="loading-state">
      <span class="loading-spinner">☀️</span>
      <p class="loading-text">Loading your camp hub…</p>
    </div>
  </main>

  <!-- Live lesson join banner -->
  <div class="live-banner" id="liveBanner">
    <span class="lb-dot"></span>
    <span class="lb-text" id="liveBannerTitle">A lesson is live</span>
    <button class="lb-join" id="liveJoinBtn" type="button">🎥 Join lesson</button>
  </div>

  <!-- Warm-up "answer now" banner -->
  <div class="live-banner warmup-banner" id="warmupBanner">
    <span class="lb-dot"></span>
    <span class="lb-text" id="warmupBannerTitle">Your coach wants you to answer the warm-up</span>
    <button class="lb-join" id="warmupAnswerBtn" type="button">✍️ Answer now</button>
  </div>

  <!-- Live lesson full-screen view -->
  <div class="live-overlay" id="liveOverlay" role="dialog" aria-modal="true">
    <div class="lo-bar">
      <div class="lo-title"><span class="lb-dot"></span><span id="liveOverlayTitle">Live lesson</span></div>
      <div class="lo-actions">
        <button class="lo-btn" id="liveFullscreenBtn" type="button" title="Full screen">⛶</button>
        <button class="lo-btn gold" id="liveRefreshBtn" type="button">🔄 Refresh</button>
        <button class="lo-btn" id="liveLeaveBtn" type="button">Leave</button>
      </div>
    </div>
    <div class="lo-body" id="liveOverlayBody"></div>
    <div class="lo-counter" id="liveOverlayCounter"></div>
  </div>

  <script>
    const app = document.getElementById('app');
    const userLine = document.getElementById('userLine');
    const rolePill = document.getElementById('rolePill');
    const logoutButton = document.getElementById('logoutButton');
    let hubState = null;

    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function parseDate(value) {
      if (!value) return null;
      const date = new Date(`${value}T12:00:00`);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function todayKey() {
      const now = new Date();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${now.getFullYear()}-${m}-${d}`;
    }

    function fmt(value, opts) {
      const date = parseDate(value);
      return date ? date.toLocaleDateString(undefined, opts) : '';
    }

    function allDays(curriculum) {
      return curriculum.flatMap(week => Array.isArray(week.days) ? week.days : []);
    }

    function findFocusDay(curriculum) {
      const days = allDays(curriculum).filter(d => d.date).sort((a, b) => a.date.localeCompare(b.date));
      const today = todayKey();
      const exact = days.find(d => d.date === today);
      if (exact) return { day: exact, isToday: true };
      const next = days.find(d => d.date > today);
      if (next) return { day: next, isToday: false };
      return null;
    }

    function renderHero(camp) {
      const start = fmt(camp.startDate, { month: 'short', day: 'numeric' });
      const end = fmt(camp.endDate, { month: 'short', day: 'numeric' });
      return `
        <div class="hero-card">
          <div>
            <div class="hero-eyebrow">${esc(camp.year)} · ${esc(camp.scheduleNote || '')}</div>
            <div class="hero-title">Summer <em>Camp</em></div>
            <p class="hero-sub">${esc(camp.themeSummary || '')}</p>
          </div>
          <div class="hero-date-badge">
            <div class="date-label">Camp runs</div>
            <div class="date-val">${esc(start)} – ${esc(end)}</div>
          </div>
        </div>
      `;
    }

    function renderFocus(curriculum, enrollment) {
      const focus = findFocusDay(curriculum);
      if (!focus) {
        if (enrollment && enrollment.source === 'master-roster' && !enrollment.visibleWeekId) {
          return `
            <div class="focus-banner">
              <div class="focus-icon">📋</div>
              <div class="focus-body">
                <strong>No camp week assigned</strong>
                <h2>Your summer weeks are not selected yet</h2>
                <p>Ask a coach to check your enrollment in the master roster. Once your week is selected, your assignments will appear here.</p>
              </div>
            </div>
          `;
        }
        return `
          <div class="focus-banner">
            <div class="focus-icon">🎉</div>
            <div class="focus-body">
              <strong>That's a wrap</strong>
              <h2>Camp is complete — amazing work this summer!</h2>
              <p>Check announcements for next steps and fall program info.</p>
            </div>
          </div>
        `;
      }
      const { day, isToday } = focus;
      const dateLabel = fmt(day.date, { weekday: 'long', month: 'long', day: 'numeric' });
      const activity = day.activity || 'Your coach will post today’s plan soon — check back!';
      return `
        <div class="focus-banner">
          <div class="focus-icon">${isToday ? '🎯' : '⏭️'}</div>
          <div class="focus-body">
            <strong>${isToday ? 'Today at camp' : 'Next camp day'} · ${esc(dateLabel)}</strong>
            <h2>${isToday ? 'Here’s the plan for today' : 'Get ready for what’s next'}</h2>
            <p>${esc(activity)}</p>
            ${day.build ? `<span class="focus-build-tag">🔧 Build: ${esc(day.build)}</span>` : ''}
          </div>
        </div>
      `;
    }

    function submissionFor(dayId, submissions) {
      return (submissions || []).find(s => s.dayId === dayId);
    }

    function renderProgress(curriculum, submissions) {
      const days = allDays(curriculum).filter(d => d.date);
      const done = days.filter(d => submissionFor(d.id, submissions)).length;
      const total = days.length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      return `
        <div class="progress-card">
          <div>
            <div class="big-num">${done}<span style="font-size:20px;color:var(--muted)"> / ${total}</span></div>
            <div class="label">Assignments submitted</div>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div style="font-weight:900;font-size:16px;color:var(--sun-deep)">${pct}%</div>
        </div>
      `;
    }

    function renderEnrollmentNotice(enrollment) {
      if (!enrollment || !enrollment.visibleWeekLabel) return '';
      const range = enrollment.visibleWeekRange && enrollment.visibleWeekRange.start
        ? `${fmt(enrollment.visibleWeekRange.start, { month: 'short', day: 'numeric' })} - ${fmt(enrollment.visibleWeekRange.end, { month: 'short', day: 'numeric' })}`
        : '';
      const note = enrollment.source === 'master-roster'
        ? 'Based on your camp registration.'
        : 'Showing the next camp week available to this account.';
      return `
        <div class="focus-banner" style="background:var(--sky-light);border-color:#bdd7f4">
          <div class="focus-icon">📌</div>
          <div class="focus-body">
            <strong>Your visible camp week</strong>
            <h2>${esc(enrollment.visibleWeekLabel)}${range ? ` · ${esc(range)}` : ''}</h2>
            <p>${esc(note)} To keep things clear, this page only shows one week of assignments at a time.</p>
          </div>
        </div>
      `;
    }

    function beginResponseFor(dayId) {
      return (hubState?.beginLessonResponses || []).find(item => item.dayId === dayId);
    }

    function renderStudentMenu(isCoach) {
      if (isCoach) return '';
      return `
        <nav class="student-menu" aria-label="Summer Camp sections">
          <a href="#today">Today</a>
          <a href="#myclass">My Class</a>
          <a href="#assignments">Assignments</a>
          <a href="#begin-lesson">Begin Lesson</a>
          <a href="#submit-activity">Submit</a>
          <a href="#points">Points</a>
          <a href="#resources">Resources</a>
          <a href="#announcements">Announcements</a>
        </nav>
      `;
    }

    function defaultBeginDay(curriculum) {
      const focus = findFocusDay(curriculum);
      return focus?.day || allDays(curriculum).find(day => day.date) || null;
    }

    function beginQuestionsForDay(day) {
      const custom = Array.isArray(day.beginLessonQuestions) ? day.beginLessonQuestions.filter(Boolean).slice(0, 3) : [];
      if (custom.length >= 3) return custom.slice(0, 3);
      const activity = day.activity || day.assignment || 'today\'s challenge';
      const build = day.build || day.assignment || activity || 'this project';
      return [...custom,
        `What part of "${activity}" sounds most interesting or surprising to you?`,
        `Before we begin, what do you predict will be the trickiest part of building or testing ${build}?`,
        'If you were the engineer leading this lesson, what would you try first and why?'
      ].slice(0, 3);
    }

    function renderBeginLessonSection(curriculum) {
      const day = defaultBeginDay(curriculum);
      if (!day) {
        return `
          <div class="begin-card anchor-section" id="begin-lesson">
            <div class="begin-kicker">Begin Lesson</div>
            <div class="begin-title">No warm-up is available yet</div>
            <p class="section-sub">Ask a coach to check your camp week assignment.</p>
          </div>
        `;
      }
      return `<div class="anchor-section" id="begin-lesson">${renderBeginLessonPanel(day, beginResponseFor(day.id))}</div>`;
    }

    function renderBeginLessonPanel(day, response) {
      const assignment = day.assignment || day.activity || 'Today\'s lesson';
      const answered = response && Array.isArray(response.answers) && response.answers.length;
      return `
        <div class="begin-card ${answered ? 'is-ready' : ''}">
          <div class="begin-kicker">Begin Lesson</div>
          <div class="begin-title">${esc(assignment)}</div>
          <p class="section-sub">${day.build ? `Build focus: ${esc(day.build)}. ` : ''}Answer these quick warm-up questions while your teacher gets ready.</p>
          <div id="beginLessonBody">
            ${answered ? renderBeginWaiting(day, response) : renderBeginForm(day, null)}
          </div>
        </div>
      `;
    }

    function renderBeginForm(day, response) {
      const questions = Array.isArray(day.questions) ? day.questions : beginQuestionsForDay(day);
      const answers = response?.answers || [];
      return `
        <form onsubmit="submitBeginLesson(event, '${esc(day.id)}')">
          ${questions.map((question, index) => `
            <div class="begin-question">
              <label for="beginAnswer${index}">${esc(question)}</label>
              <textarea id="beginAnswer${index}" data-begin-answer="${index}" required>${esc(answers[index] || '')}</textarea>
            </div>
          `).join('')}
          <button class="btn" style="margin-top:16px" type="submit">I am ready for the lesson</button>
          <div class="form-status" id="beginLessonStatus"></div>
        </form>
      `;
    }

    function renderBeginWaiting(day, response) {
      return `
        <div class="begin-waiting">
          You're ready. Your teacher will start the live lesson soon.
          ${lvState && lvState.active ? '<div style="margin-top:12px"><button class="btn" type="button" onclick="joinLive()">Join live lesson</button></div>' : ''}
        </div>
        <div style="margin-top:14px">
          <button class="btn btn-outline" type="button" onclick="editBeginLesson('${esc(day.id)}')">Edit my warm-up answers</button>
        </div>
      `;
    }

    async function openBeginLesson(dayId) {
      const target = document.getElementById('begin-lesson');
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      try {
        const result = await fetch(`/api/camp/begin-lesson/${encodeURIComponent(dayId)}`, { cache: 'no-store' }).then(r => r.json().then(data => ({ ok: r.ok, data })));
        if (!result.ok || !result.data.success) throw new Error(result.data.message || 'Could not open warm-up');
        const day = result.data.day;
        const response = result.data.response;
        if (target) target.innerHTML = renderBeginLessonPanel(day, response);
      } catch (err) {
        if (target) target.innerHTML = `<div class="begin-card"><div class="begin-title">${esc(err.message)}</div></div>`;
      }
    }

    async function editBeginLesson(dayId) {
      const result = await fetch(`/api/camp/begin-lesson/${encodeURIComponent(dayId)}`, { cache: 'no-store' }).then(r => r.json().then(data => ({ ok: r.ok, data })));
      if (!result.ok || !result.data.success) return;
      const body = document.getElementById('beginLessonBody');
      if (body) body.innerHTML = renderBeginForm(result.data.day, result.data.response);
    }

    async function submitBeginLesson(event, dayId) {
      event.preventDefault();
      const status = document.getElementById('beginLessonStatus');
      const answers = [...document.querySelectorAll('[data-begin-answer]')].map(input => input.value.trim());
      if (answers.some(answer => !answer)) {
        if (status) status.textContent = 'Please answer every question before beginning.';
        return;
      }
      if (status) status.textContent = 'Saving your warm-up...';
      try {
        const response = await fetch(`/api/camp/begin-lesson/${encodeURIComponent(dayId)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers })
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Could not save warm-up');
        const list = hubState.beginLessonResponses || [];
        const index = list.findIndex(item => item.dayId === dayId);
        if (index >= 0) list[index] = result.response;
        else list.push(result.response);
        hubState.beginLessonResponses = list;
        renderCampDashboard(hubState);
        openBeginLesson(dayId);
      } catch (err) {
        if (status) status.textContent = err.message || 'Could not save warm-up.';
      }
    }

    function timerSeconds(timer) {
      if (!timer) return 0;
      if (!timer.running || !timer.startedAt) return Math.max(0, Number(timer.pausedRemainingSeconds || 0));
      const elapsed = Math.floor((Date.now() - new Date(timer.startedAt).getTime()) / 1000);
      return Math.max(0, Number(timer.pausedRemainingSeconds || 0) - elapsed);
    }

    function formatSeconds(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

      const seconds = running && startedAt

    function weekStatus(week) {
      const dates = (week.days || []).map(d => d.date).filter(Boolean).sort();
      if (!dates.length) return 'soon';
      const today = todayKey();
      if (today > dates[dates.length - 1]) return 'done';
      if (today >= dates[0]) return 'now';
      return 'soon';
    }

    function renderWeek(week, index) {
      const status = weekStatus(week);
      const today = todayKey();
      const dates = (week.days || []).map(d => d.date).filter(Boolean).sort();

        ? `${fmt(dates[0], { month: 'short', day: 'numeric' })} – ${fmt(dates[dates.length - 1], { month: 'short', day: 'numeric' })}`

      const badge = status === 'now'
        ? '<span class="week-badge now">This week</span>'
        : status === 'done'
          ? '<span class="week-badge done">Done ✓</span>'
          : '<span class="week-badge soon">Coming up</span>';

      const dayRows = (week.days || []).map(day => {
        const isToday = day.date === today;

        return `
          <div class="day-row ${isToday ? 'is-today' : ''} ${isPast ? 'is-past' : ''}">

    // Deterministic cute "monster" cartoon avatar from a student id — same id always
    // gives the same character. Pure SVG, no image files needed.
    function monsterAvatar(seed) {
      let h = 2166136261;
      const s = String(seed || 'camper');
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
      const pick = (n) => { h = (Math.imul(h, 48271)) >>> 0; return h % n; };
      const bodyColors = ['#ff6b6b','#4dabf7','#51cf66','#ffd43b','#cc5de8','#ff922b','#22b8cf','#f783ac','#9775fa','#20c997','#ffa94d','#63e6be','#ff8787','#74c0fc'];
      const body = bodyColors[pick(bodyColors.length)];
      const eyeCount = 1 + pick(3);
      const horn = pick(3);
      const mouth = pick(3);
      let top = '';
      if (horn === 0) top = `<path d="M22 14 L26 3 L30 14 Z" fill="${body}"/><path d="M34 14 L38 3 L42 14 Z" fill="${body}"/>`;
      else if (horn === 1) top = `<line x1="22" y1="14" x2="19" y2="5" stroke="${body}" stroke-width="2.5"/><circle cx="19" cy="4" r="3.5" fill="${body}"/><line x1="42" y1="14" x2="45" y2="5" stroke="${body}" stroke-width="2.5"/><circle cx="45" cy="4" r="3.5" fill="${body}"/>`;
      else top = `<path d="M18 16 Q32 0 46 16" fill="none" stroke="${body}" stroke-width="3.5" stroke-linecap="round"/>`;
      const eyePos = eyeCount === 1 ? [32] : eyeCount === 2 ? [25, 39] : [21, 32, 43];
      let eyes = '';
      eyePos.forEach((x) => { eyes += `<circle cx="${x}" cy="31" r="6" fill="#fff"/><circle cx="${x}" cy="32" r="3" fill="#22303f"/>`; });
      let mo = '';
      if (mouth === 0) mo = '<path d="M24 45 Q32 53 40 45" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>';
      else if (mouth === 1) mo = '<path d="M25 45 h14 a3 3 0 0 1 -14 0 z" fill="#22303f"/><rect x="29" y="45" width="2" height="4" fill="#fff"/><rect x="34" y="45" width="2" height="4" fill="#fff"/>';
      else mo = '<ellipse cx="32" cy="46" rx="4" ry="4.5" fill="#22303f"/>';
      return `<svg viewBox="0 0 64 66" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" aria-hidden="true">${top}<rect x="13" y="15" width="38" height="41" rx="17" fill="${body}"/>${eyes}${mo}<ellipse cx="32" cy="61" rx="15" ry="3" fill="rgba(0,0,0,0.08)"/></svg>`;
    }

      if (!list.length) {
        return `
          <div class="section-title">🦄 My Class</div>
          <p class="section-sub">Your class board will appear here once your coach adds classmates.</p>`;
      }
      const shortName = (full) => {
        const parts = String(full || '').trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return 'Camper';
        return parts.length > 1 ? `${parts[0]} ${parts[parts.length - 1][0]}.` : parts[0];
      };
      const cards = list.map((c) => `
        <div class="monster-card ${c.id === meId ? 'is-me' : ''}">
          <div class="monster-points">${esc(c.points || 0)}</div>
          <div class="monster-char">${monsterAvatar(c.id)}</div>
          <div class="monster-name">${esc(shortName(c.name))}${c.id === meId ? ' <span class="me-tag">You</span>' : ''}</div>
        </div>`).join('');
      return `
        <div class="section-title">🦄 My Class${className ? ` · ${esc(className)}` : ''}</div>
        <p class="section-sub">Everyone in your class. Your points show above your character — earn more by building, helping, and improving!</p>
        <div class="monster-grid">${cards}</div>`;
    }

    function renderCampDashboard(data) {
      hubState = data;
      const { user, camp, curriculum, announcements, resources, submissions = [], enrollment, points, printRequests = [], projectSubmissions = [], classroom, classmates = [], className = '' } = data;
      const isCoach = user.role === 'coach';
      userLine.textContent = `${user.name} · ${isCoach ? 'Coach preview' : 'Camper'}`;
      rolePill.textContent = isCoach ? 'Coach' : 'Camper';

      app.innerHTML = `
        ${renderStudentMenu(isCoach)}
        ${renderHero(camp)}
        <div class="anchor-section" id="today">${renderFocus(curriculum, enrollment)}</div>
        ${renderProgress(curriculum, submissions)}
        ${!isCoach ? renderEnrollmentNotice(enrollment) : ''}
        ${!isCoach ? `<div class="anchor-section" id="myclass">${renderClassBoard(classmates, user.id, className)}</div>` : ''}

        <div class="main-layout">
          <div>
            ${!isCoach ? `<div class="anchor-section" id="points">${renderClassroomCard(classroom)}${renderPointsCard(points, printRequests, projectSubmissions)}</div>` : ''}
            <div class="section-title anchor-section" id="assignments">This Week's Assignments</div>
            <p class="section-sub">Only your current camp week is shown here. Open any worksheet you need, then submit your reflection and final-work photo.</p>
            ${renderAssignmentTable(curriculum, submissions)}
            ${!isCoach ? renderBeginLessonSection(curriculum) : ''}
            ${!isCoach ? `<div class="anchor-section" id="submit-activity">${renderSubmitBox(curriculum, submissions)}</div>` : ''}
            ${!isCoach ? renderProjectSubmissionForm() : ''}
            ${!isCoach ? renderPrintRequestForm() : ''}

            <div class="anchor-section" id="resources" style="margin-top:36px">
              <div class="section-title">Resources</div>
              <p class="section-sub">Everything you need for camp: apps, lessons, worksheets, and project research.</p>
              ${renderResources(resources, user)}
            </div>
          </div>

          <aside class="anchor-section" id="announcements">
            <div class="section-title">Announcements</div>
            <p class="section-sub">Latest updates from your coaches.</p>
            <div class="announce-list">
              ${renderAnnouncements(announcements, user)}
            </div>
            ${isCoach ? `
              <div style="margin-top:24px">
                <a class="btn" style="display:block;text-align:center;padding:14px" href="/camp-hub/coach">Open Coach Dashboard →</a>
              </div>
            ` : ''}
          </aside>
        </div>
      `;
      tickStudentTimer();
    }

    function imageToDataUrl(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve('');
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Could not read the photo'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Could not load the photo'));
          img.onload = () => {
            const max = 1200;
            const scale = Math.min(1, max / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.78));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function submitActivity() {
      const status = document.getElementById('submitStatus');
      const preview = document.getElementById('submissionPreview');
      const dayId = document.getElementById('submitDay').value;
      const reflection = document.getElementById('submitReflection').value.trim();
      const file = document.getElementById('submitPhoto').files[0];
      status.textContent = 'Saving...';
      preview.innerHTML = '';
      try {
        const photoDataUrl = await imageToDataUrl(file);
        const response = await fetch('/api/camp/submissions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dayId, reflection, photoDataUrl })
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Could not submit activity');
        const existingIndex = hubState.submissions.findIndex(s => s.dayId === dayId);
        if (existingIndex >= 0) hubState.submissions[existingIndex] = result.submission;
        else hubState.submissions.push(result.submission);
        preview.innerHTML = `${photoDataUrl ? `<img src="${photoDataUrl}" alt="Submitted activity photo" />` : ''}`;
        renderCampDashboard(hubState);
        const nextStatus = document.getElementById('submitStatus');
        if (nextStatus) nextStatus.textContent = 'Submitted. Your coach can now see it.';
      } catch (err) {
        status.textContent = err.message || 'Could not submit activity.';
      }
    }

    async function submitPrintRequest() {
      const status = document.getElementById('printStatus');
      const payload = {
        title: document.getElementById('printTitle').value.trim(),
        purpose: document.getElementById('printPurpose').value.trim(),
        dimensions: document.getElementById('printDimensions').value.trim(),
        color: document.getElementById('printColor').value.trim(),
        notes: document.getElementById('printNotes').value.trim()
      };
      status.textContent = 'Sending request...';
      try {
        const response = await fetch('/api/camp/print-requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Could not send print request');
        hubState.printRequests = [result.request, ...(hubState.printRequests || [])];
        hubState.points = result.points || hubState.points;
        renderCampDashboard(hubState);
        const nextStatus = document.getElementById('printStatus');
        if (nextStatus) nextStatus.textContent = 'Request sent to the coach queue.';
      } catch (err) {
        status.textContent = err.message || 'Could not send print request.';
      }
    }

    async function submitProject() {
      const status = document.getElementById('projectStatus');
      const preview = document.getElementById('projectPreview');
      const file = document.getElementById('projectPhoto').files[0];
      const payload = {
        title: document.getElementById('projectTitle').value.trim(),
        projectType: document.getElementById('projectType').value,
        description: document.getElementById('projectDescription').value.trim(),
        reflection: document.getElementById('projectReflection').value.trim(),
        linkUrl: document.getElementById('projectLink').value.trim()
      };
      status.textContent = 'Submitting project...';
      preview.innerHTML = '';
      try {
        const photoDataUrl = await imageToDataUrl(file);
        const response = await fetch('/api/camp/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...payload, photoDataUrl })
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Could not submit project');
        hubState.projectSubmissions = [result.project, ...(hubState.projectSubmissions || [])];
        hubState.points = result.points || hubState.points;
        preview.innerHTML = `${photoDataUrl ? `<img src="${photoDataUrl}" alt="Submitted project photo" />` : ''}`;
        renderCampDashboard(hubState);
        const nextStatus = document.getElementById('projectStatus');
        if (nextStatus) nextStatus.textContent = 'Project submitted. Your coach can now review it.';
      } catch (err) {
        status.textContent = err.message || 'Could not submit project.';
      }
    }

    async function loadHub() {
      try {
        const response = await fetch('/api/camp/hub-data');
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Login required');
        renderCampDashboard(result.data);
      } catch (err) {
        window.location.href = '/camp-hub/login';
      }
    }

    logoutButton.addEventListener('click', async () => {
      await fetch('/api/camp/logout', { method: 'POST' });
      window.location.href = '/camp-hub/login';
    });

    /* ── Live lesson (camper) ── */
    let lvState = null;
    let lvJoined = false;
    let lvRenderKey = '';
    let lvDeckUrl = '';        // current deck loaded in the follow iframe
    let lvShownResultId = '';  // last quiz result already shown to this camper
    let wuState = null;        // warm-up "answer now" broadcast state
    const liveBanner = document.getElementById('liveBanner');
    const liveOverlay = document.getElementById('liveOverlay');
    const liveOverlayBody = document.getElementById('liveOverlayBody');
    const warmupBanner = document.getElementById('warmupBanner');

    function escLv(v) {
      return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    async function pollLive() {
      try {
        const r = await fetch('/api/camp/live').then(x => x.json());
        lvState = r && r.success ? r.state : { active: false };
      } catch (err) { return; }
      // Banner shows only when a lesson is live and the camper hasn't joined.
      if (lvState && lvState.active && !lvJoined) {
        document.getElementById('liveBannerTitle').textContent = (lvState.deckTitle || lvState.lessonTitle || 'A lesson') + ' is live';
        liveBanner.classList.add('show');
      } else {
        liveBanner.classList.remove('show');
      }
      if (lvJoined) renderLiveOverlay();
    }

    // Has my coach asked me to answer the warm-up right now?
    async function pollWarmup() {
      try {
        const r = await fetch('/api/camp/warmup').then(x => x.json());
        wuState = r && r.success ? r.state : { active: false };
      } catch (err) { return; }
      // Show only when published, the camper hasn't submitted it yet, and no live
      // slideshow is taking over the screen (avoid two banners stacking).
      const answered = wuState && wuState.active ? !!beginResponseFor(wuState.dayId) : false;
      const slidesLive = lvState && lvState.active;
      if (wuState && wuState.active && !answered && !slidesLive) {
        document.getElementById('warmupBannerTitle').textContent =
          '📣 Answer the warm-up' + (wuState.dayLabel ? `: ${wuState.dayLabel}` : '');
        warmupBanner.classList.add('show');
      } else {
        warmupBanner.classList.remove('show');
      }
    }

    function joinLive() {
      lvJoined = true;
      lvRenderKey = '';
      // Don't replay a result that was scored before this camper opened the overlay.
      if (lvState && lvState.lastResult) lvShownResultId = lvState.lastResult.questionId;
      liveOverlay.classList.add('show');
      liveBanner.classList.remove('show');
      document.body.style.overflow = 'hidden';
      renderLiveOverlay();
      pollLive();
    }
    function leaveLive() {
      lvJoined = false;
      liveOverlay.classList.remove('show');
      document.body.style.overflow = '';
      pollLive();
    }

    function renderLiveOverlay() {
      // Deck mode: follow the real lesson slides + answer pushed Kahoot questions.
      if (lvState && lvState.active && lvState.kind === 'deck') { renderDeckFollow(); return; }
      liveOverlayBody.classList.remove('deck');
      lvDeckUrl = '';
      document.getElementById('liveOverlayTitle').textContent = (lvState && lvState.lessonTitle) || 'Live lesson';
      const counter = document.getElementById('liveOverlayCounter');
      if (!lvState || !lvState.active) {
        const key = 'ended';
        if (lvRenderKey !== key) {
          lvRenderKey = key;
          liveOverlayBody.innerHTML = `
            <div class="lo-waiting"><span class="big">👋</span>
              <h1 style="font-size:26px">The lesson has ended</h1>
              <p style="font-size:18px;margin-top:8px">Nice work today! You can close this and go back to your hub.</p>
              <button class="lo-btn gold" style="margin-top:20px" onclick="leaveLive()">Back to my hub</button>
            </div>`;
        }
        counter.textContent = '';
        return;
      }
      const s = lvState.slide || {};
      const isQ = s.type === 'question';
      const key = `${s.id}|${lvState.slideIndex}|${isQ ? (lvState.myAnswer == null ? 'na' : lvState.myAnswer) : 'c'}`;
      counter.textContent = `Slide ${(lvState.slideIndex || 0) + 1} of ${lvState.slideCount || 1}`;
      if (lvRenderKey === key) return; // avoid flicker when nothing changed
      lvRenderKey = key;

      if (isQ) {
        const answered = lvState.myAnswer != null;
        liveOverlayBody.innerHTML = `
          <div class="lo-content">
            <div class="lo-kicker">❓ Question — tap your answer</div>
            <h1>${escLv(s.title)}</h1>
            ${s.body ? `<div class="lo-text">${escLv(s.body)}</div>` : ''}
            ${s.image ? `<img src="${escLv(s.image)}" alt="" onerror="this.style.display='none'">` : ''}
            <div class="lo-answers">
              ${(s.options || []).map((opt, j) => `
                <button class="lo-answer a${j} ${answered && lvState.myAnswer === j ? 'chosen' : ''} ${answered && lvState.myAnswer !== j ? 'dim' : ''}" onclick="answerLive(${j})">
                  <span class="lo-key">${String.fromCharCode(65 + j)}</span><span>${escLv(opt)}</span>
                </button>`).join('')}
            </div>
            ${answered ? `<div class="lo-answered-msg">✓ Answer sent! You can change it until your coach moves on.</div>` : ''}
          </div>`;
      } else {
        liveOverlayBody.innerHTML = `
          <div class="lo-content">
            <div class="lo-kicker">📄 Follow along</div>
            <h1>${escLv(s.title)}</h1>
            ${s.body ? `<div class="lo-text">${escLv(s.body)}</div>` : ''}
            ${s.image ? `<img src="${escLv(s.image)}" alt="" onerror="this.style.display='none'">` : ''}
          </div>`;
      }
    }

    /* Deck-follow: mirror the coach's real lesson slides in an iframe + question overlay. */
    function renderDeckFollow() {
      liveOverlayBody.classList.add('deck');
      document.getElementById('liveOverlayTitle').textContent = lvState.deckTitle || 'Live lesson';
      const counter = document.getElementById('liveOverlayCounter');
      counter.textContent = lvState.slideCount ? `Slide ${(lvState.slideIndex || 0) + 1} of ${lvState.slideCount}` : '';
      let frame = document.getElementById('camperDeckFrame');
      if (!frame || lvDeckUrl !== lvState.deckUrl) {
        lvDeckUrl = lvState.deckUrl;
        liveOverlayBody.innerHTML = `<div class="lo-deck-wrap">
            <iframe id="camperDeckFrame" class="lo-deck-frame" src="${escLv(lvState.deckUrl)}" onload="onCamperDeckLoad()"></iframe>
            <div class="lo-q-layer" id="loQLayer"></div>
          </div>`;
      }
      syncCamperDeck();
      renderQuestionLayer();
    }

    function camperDeckEl() {
      const f = document.getElementById('camperDeckFrame');
      let d; try { d = f && f.contentDocument; } catch (e) { return null; }
      return d && d.querySelector('.deck');
    }
    function onCamperDeckLoad() {
      const f = document.getElementById('camperDeckFrame');
      let d; try { d = f && f.contentDocument; } catch (e) { return; }
      if (!d) return;
      // Hide teacher notes + the deck's own nav, and freeze user scrolling (coach drives it).
      const style = d.createElement('style');
      style.textContent = '.teacher-note{display:none!important}.slide-nav{display:none!important}.deck{overflow:hidden!important}';
      (d.head || d.documentElement).appendChild(style);
      syncCamperDeck();
    }
    window.onCamperDeckLoad = onCamperDeckLoad;

    function syncCamperDeck() {
      const deck = camperDeckEl();
      if (!deck) return;
      const w = deck.clientWidth || 1;
      const target = (lvState.slideIndex || 0) * w;
      if (Math.abs(deck.scrollLeft - target) > 2) deck.scrollTo({ left: target, behavior: 'auto' });
    }

    function renderQuestionLayer() {
      const layer = document.getElementById('loQLayer');
      if (!layer) return;
      const aq = lvState.activeQuestion;
      if (aq) {
        const answered = lvState.myAnswer != null;
        const key = 'q:' + aq.id + '|' + (answered ? lvState.myAnswer : 'na');
        if (layer.dataset.key === key) return;
        layer.dataset.key = key;
        layer.classList.add('show');
        layer.innerHTML = `<div class="lo-q-card">
          <div class="lo-kicker">❓ Tap your answer — faster earns more points!</div>
          <h1>${escLv(aq.title)}</h1>
          ${aq.body ? `<div class="lo-text" style="margin-bottom:8px">${escLv(aq.body)}</div>` : ''}
          <div class="lo-answers">
            ${(aq.options || []).map((opt, j) => `
              <button class="lo-answer a${j} ${answered && lvState.myAnswer === j ? 'chosen' : ''} ${answered && lvState.myAnswer !== j ? 'dim' : ''}" onclick="answerLive(${j})">
                <span class="lo-key">${String.fromCharCode(65 + j)}</span><span>${escLv(opt)}</span>
              </button>`).join('')}
          </div>
          ${answered ? `<div class="lo-answered-msg">✓ Locked in! Waiting for your coach to reveal the answer…</div>` : ''}
        </div>`;
        return;
      }
      // No active question. Show the camper's result briefly if one is newly available.
      const res = lvState.lastResult;
      if (res && lvShownResultId !== res.questionId) {
        lvShownResultId = res.questionId;
        layer.dataset.key = 'result:' + res.questionId;
        layer.classList.add('show');
        layer.innerHTML = `<div class="lo-q-card result ${res.correct ? 'good' : 'bad'}">
          <span class="big">${res.correct ? '✅' : '❌'}</span>
          <h1>${res.correct ? `Correct! +${res.points} point${res.points === 1 ? '' : 's'}` : 'Not this time'}</h1>
          <p class="lo-text">${res.correct ? 'Nice and fast! Your points were added to your class total.' : 'Keep going — you’ll get the next one!'}</p>
        </div>`;
        setTimeout(() => {
          const l = document.getElementById('loQLayer');
          if (l && l.dataset.key === 'result:' + res.questionId) { l.classList.remove('show'); l.innerHTML = ''; l.dataset.key = ''; }
        }, 4500);
        return;
      }
      // Otherwise make sure no stale question card is left up.
      if (layer.dataset.key && layer.dataset.key.indexOf('q:') === 0) {
        layer.classList.remove('show'); layer.innerHTML = ''; layer.dataset.key = '';
      }
    }
    window.renderQuestionLayer = renderQuestionLayer;

    async function answerLive(choice) {
      if (!lvState) return;
      const deck = lvState.kind === 'deck';
      const qid = deck ? (lvState.activeQuestion && lvState.activeQuestion.id) : (lvState.slide && lvState.slide.id);
      if (!qid) return;
      try {
        const body = deck ? { questionId: qid, choice } : { slideId: qid, choice };
        const r = await fetch('/api/camp/live/answer', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).then(x => x.json());
        if (r && r.success) {
          lvState.myAnswer = (r.myAnswer != null ? r.myAnswer : choice);
          if (deck) { const l = document.getElementById('loQLayer'); if (l) l.dataset.key = ''; renderQuestionLayer(); }
          else { lvRenderKey = ''; renderLiveOverlay(); }
        } else if (r && r.message) { /* question may have moved on */ pollLive(); }
      } catch (err) { /* ignore, next poll recovers */ }
    }

    document.getElementById('liveJoinBtn').addEventListener('click', joinLive);
    document.getElementById('liveLeaveBtn').addEventListener('click', leaveLive);
    document.getElementById('liveRefreshBtn').addEventListener('click', () => { lvRenderKey = ''; pollLive(); });
    document.getElementById('liveFullscreenBtn').addEventListener('click', () => {
      const el = document.getElementById('liveOverlay');
      const doc = document;
      if (doc.fullscreenElement || doc.webkitFullscreenElement) {
        (doc.exitFullscreen || doc.webkitExitFullscreen || function(){}).call(doc);
      } else {
        (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
      }
    });
    window.answerLive = answerLive;
    window.leaveLive = leaveLive;

    document.getElementById('warmupAnswerBtn').addEventListener('click', () => {
      warmupBanner.classList.remove('show');
      if (wuState && wuState.dayId) openBeginLesson(wuState.dayId);
    });

    setInterval(tickStudentTimer, 1000);
    setInterval(() => { pollLive(); pollWarmup(); }, 3000);
    loadHub();
    pollLive();
    pollWarmup();
  </script>
</body>
</html>
