<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Future Dev Workspace</title>
  <style>
    :root {
      --af-navy: #073E77;
      --af-deep-navy: #001B3F;
      --af-blue: #2563FF;
      --af-yellow: #FECE00;
      --af-white: #FAFAF6;
      --af-muted: #D0D9E7;
      --af-border: rgba(255,255,255,.15);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--af-white);
      background: radial-gradient(circle at 10% 10%, rgba(37,99,255,.18), transparent 45%),
                  radial-gradient(circle at 90% 0%, rgba(254,206,0,.12), transparent 35%),
                  linear-gradient(160deg, var(--af-deep-navy), var(--af-navy));
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .card {
      width: min(760px, 100%);
      border: 1px solid var(--af-border);
      border-radius: 16px;
      padding: 2rem;
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 .6rem;
      font-size: clamp(1.5rem, 3vw, 2rem);
    }

    p {
      margin: 0 0 1.25rem;
      color: var(--af-muted);
      line-height: 1.6;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
    }

    a {
      text-decoration: none;
      color: #001B3F;
      background: var(--af-yellow);
      font-weight: 700;
      border-radius: 999px;
      padding: .55rem .95rem;
    }

    a.secondary {
      color: var(--af-white);
      background: rgba(255,255,255,.08);
      border: 1px solid var(--af-border);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>AI Future Dev Workspace</h1>
    <p>
      This protected dev area is now wired through the unified server. Use it for internal tools and platform testing.
    </p>
    <div class="links">
      <a href="/admin">Open Admin</a>
      <a class="secondary" href="/codelab/app">Open Code Lab App</a>
      <a class="secondary" href="/">Back To Home</a>
    </div>
  </main>
</body>
</html>
