<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coach Login | AI Future</title>
  <style>
    :root {
      --ink: #17202c;
      --muted: #667085;
      --line: #d8dee8;
      --brand: #2563ff;
      --brand-dark: #1648cc;
      --surface: #ffffff;
      --soft: #eef4ff;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(120deg, rgba(37, 99, 255, 0.12), rgba(20, 184, 166, 0.12)),
        #f6f8fb;
    }

    main {
      width: min(100%, 420px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 24px 60px rgba(21, 31, 48, 0.14);
      padding: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .mark {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      background: linear-gradient(135deg, #2563ff, #14b8a6);
    }

    h1 {
      margin: 0;
      font-size: 1.7rem;
      line-height: 1.15;
      letter-spacing: 0;
    }

    p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 7px;
      font-weight: 700;
      font-size: 0.93rem;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 13px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }

    input:focus, select:focus {
      outline: 3px solid rgba(37, 99, 255, 0.18);
      border-color: var(--brand);
    }

    .link-btn {
      background: none; border: 0; color: var(--brand); font: inherit; font-weight: 700;
      cursor: pointer; padding: 0; text-decoration: underline; width: auto;
    }
    .link-btn:hover { background: none; color: var(--brand-dark); }
    .toggle-row { text-align: center; margin-top: 4px; font-size: 0.92rem; color: var(--muted); }
    .ok { color: #0f5132; font-weight: 700; }
    [hidden] { display: none !important; }
    h1.small { font-size: 1.35rem; }

    button {
      border: 0;
      border-radius: 8px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 800;
      color: #fff;
      background: var(--brand);
      cursor: pointer;
    }

    button:hover { background: var(--brand-dark); }
    button:disabled {
      opacity: 0.68;
      cursor: wait;
    }

    .error {
      min-height: 22px;
      margin-top: 4px;
      color: var(--danger);
      font-weight: 700;
      font-size: 0.92rem;
    }

    .helper {
      margin-top: 22px;
      padding: 12px 14px;
      border-radius: 8px;
      color: #31415c;
      background: var(--soft);
      font-size: 0.92rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="mark">AI</div>
      <div>
        <h1 id="title">Coach Login</h1>
        <p id="subtitle">One sign-in for your AI Future staff tools.</p>
      </div>
    </div>

    <!-- LOG IN -->
    <form id="loginForm" autocomplete="on">
      <label>
        Username
        <input id="username" name="username" autocomplete="username" required>
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="submitButton" type="submit">Log in</button>
      <div id="loginError" class="error" role="alert"></div>
      <div class="toggle-row">Need access? <button type="button" class="link-btn" id="toSetup">Set or reset your password</button></div>
    </form>

    <!-- FIRST-TIME SETUP -->
    <form id="setupForm" autocomplete="off" hidden>
      <label>
        Your name
        <select id="coachSelect" required></select>
      </label>
      <label>
        Setup code <span style="font-weight:500;color:var(--muted)">(ask your admin)</span>
        <input id="setupCode" autocomplete="off" required>
      </label>
      <label>
        New password
        <input id="newPassword" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <label>
        Confirm password
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <button id="setupButton" type="submit">Set password &amp; log in</button>
      <div id="setupMsg" class="error" role="alert"></div>
      <div class="toggle-row">Already set up? <button type="button" class="link-btn" id="toLogin">Back to log in</button></div>
    </form>

    <div class="helper" id="helper">Enter your coach username and password.</div>
  </main>

  <script>
    const loginForm = document.getElementById('loginForm');
    const setupForm = document.getElementById('setupForm');
    const loginError = document.getElementById('loginError');
    const setupMsg = document.getElementById('setupMsg');
    const submitButton = document.getElementById('submitButton');
    const setupButton = document.getElementById('setupButton');
    const coachSelect = document.getElementById('coachSelect');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const helper = document.getElementById('helper');

    async function checkSession() {
      try {
        const response = await fetch('/api/coach/session', { cache: 'no-store' });
        if (response.ok) window.location.href = '/coach-portal';
      } catch (_) {}
    }

    async function loadSetupList() {
      try {
        const r = await fetch('/api/coach/setup/list', { cache: 'no-store' });
        const data = await r.json();
        const list = (data && data.coaches) || [];
        coachSelect.innerHTML = list.length
          ? list.map(c => `<option value="${c.username}">${c.name} (username: ${c.username})${c.needsSetup ? ' - needs setup' : ''}</option>`).join('')
          : '<option value="">No coach accounts found</option>';
        return list.length;
      } catch (_) { return 0; }
    }

    function showSetup() {
      loginForm.hidden = true; setupForm.hidden = false;
      title.textContent = 'Set or Reset Password';
      title.classList.add('small');
      subtitle.textContent = 'Pick your name, enter the setup code, and choose a password.';
      helper.textContent = 'Your username is shown next to your name. Use this same password for Coach Portal, Camp Hub, and FLL Hub.';
      loadSetupList();
    }
    function showLogin() {
      setupForm.hidden = true; loginForm.hidden = false;
      title.textContent = 'Coach Login'; title.classList.remove('small');
      subtitle.textContent = 'One sign-in for your AI Future staff tools.';
      helper.textContent = 'Enter your coach username and password.';
    }

    document.getElementById('toSetup').addEventListener('click', showSetup);
    document.getElementById('toLogin').addEventListener('click', showLogin);

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginError.textContent = '';
      submitButton.disabled = true; submitButton.textContent = 'Logging in...';
      try {
        const response = await fetch('/api/coach/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          if (result.needsSetup) { showSetup(); setupMsg.textContent = result.message; throw new Error(''); }
          throw new Error(result.message || 'Login failed');
        }
        window.location.href = result.redirectTo || '/coach-portal';
      } catch (err) {
        if (err.message) loginError.textContent = err.message;
        submitButton.disabled = false; submitButton.textContent = 'Log in';
      }
    });

    setupForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      setupMsg.textContent = '';
      const pw = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (pw !== confirm) { setupMsg.textContent = 'Passwords do not match.'; return; }
      setupButton.disabled = true; setupButton.textContent = 'Setting up...';
      try {
        const response = await fetch('/api/coach/setup', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: coachSelect.value, code: document.getElementById('setupCode').value, password: pw })
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Setup failed');
        window.location.href = result.redirectTo || '/coach-portal';
      } catch (err) {
        setupMsg.textContent = err.message || 'Setup failed';
        setupButton.disabled = false; setupButton.textContent = 'Set password & log in';
      }
    });

    checkSession();
  </script>
</body>
</html>
