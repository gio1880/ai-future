<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coach Login | AI Future</title>
  <style>
    :root {
      --ink: #17202c;
      --muted: #667085;
      --line: #d8dee8;
      --brand: #2563ff;
      --brand-dark: #1648cc;
      --surface: #ffffff;
      --soft: #eef4ff;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(120deg, rgba(37, 99, 255, 0.12), rgba(20, 184, 166, 0.12)),
        #f6f8fb;
    }

    main {
      width: min(100%, 420px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 24px 60px rgba(21, 31, 48, 0.14);
      padding: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .mark {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      background: linear-gradient(135deg, #2563ff, #14b8a6);
    }

    h1 {
      margin: 0;
      font-size: 1.7rem;
      line-height: 1.15;
      letter-spacing: 0;
    }

    p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 7px;
      font-weight: 700;
      font-size: 0.93rem;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 13px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }

    input:focus {
      outline: 3px solid rgba(37, 99, 255, 0.18);
      border-color: var(--brand);
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 800;
      color: #fff;
      background: var(--brand);
      cursor: pointer;
    }

    button:hover { background: var(--brand-dark); }
    button:disabled {
      opacity: 0.68;
      cursor: wait;
    }

    .error {
      min-height: 22px;
      margin-top: 4px;
      color: var(--danger);
      font-weight: 700;
      font-size: 0.92rem;
    }

    .helper {
      margin-top: 22px;
      padding: 12px 14px;
      border-radius: 8px;
      color: #31415c;
      background: var(--soft);
      font-size: 0.92rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="mark">AI</div>
      <div>
        <h1>Coach Login</h1>
        <p>One sign-in for your AI Future staff tools.</p>
      </div>
    </div>

    <form id="loginForm" autocomplete="on">
      <label>
        Username
        <input id="username" name="username" autocomplete="username" required>
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="submitButton" type="submit">Log in</button>
      <div id="error" class="error" role="alert"></div>
    </form>

    <div class="helper">Use your existing coach username and password.</div>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const error = document.getElementById('error');
    const submitButton = document.getElementById('submitButton');

    async function checkSession() {
      try {
        const response = await fetch('/api/coach/session', { cache: 'no-store' });
        if (response.ok) {
          window.location.href = '/coach-portal';
        }
      } catch (_) {}
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      submitButton.disabled = true;
      submitButton.textContent = 'Logging in...';

      try {
        const response = await fetch('/api/coach/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error(result.message || 'Login failed');
        }
        window.location.href = result.redirectTo || '/coach-portal';
      } catch (err) {
        error.textContent = err.message || 'Login failed';
        submitButton.disabled = false;
        submitButton.textContent = 'Log in';
      }
    });

    checkSession();
  </script>
</body>
</html>
